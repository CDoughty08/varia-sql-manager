<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varia mock · Compare picker · Layout options</title>
<!-- Design mock for the Compare picker rework (after PR 466). Self-contained: no network, no build step. Not production code. -->
<style>
/* Palette: src/shared/theme/palette.ts (Varia Dark, Varia Light). Metrics: src/shared/theme/metrics.ts (Compact). */
:root {
  --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, 'Noto Sans', sans-serif;
  --font-mono: 'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  --size-xs: 11px; --size-sm: 12px; --size-md: 13px; --size-lg: 15px;
  --bar: 36px; --control: 26px; --row: 22px; --status: 24px;
  --radius-sm: 4px; --radius-lg: 8px; --radius-pill: 999px;
  --grid-row: 20px; --grid-head: 22px;
}
html[data-theme='dark'] {
  color-scheme: dark;
  --canvas: #16181d; --panel: #16181d; --chrome: #111317; --raised: #1c1f25; --overlay: #1d2026; --input: #101216;
  --accentSurface: #232842; --hover: #262a32; --active: #30343e; --selection: #21273b; --selectionStrong: #29314f;
  --text: #d9dce3; --textStrong: #f5f6f8; --textSecondary: #bcc1cb; --textTertiary: #a3a9b5; --textMuted: #9298a4; --textAccent: #bcc5ff;
  --border: #262a31; --borderSubtle: #1f2228; --borderStrong: #2e323a; --separator: #30343c; --controlBorder: #6b7286; --inputBorder: #6a7184;
  --accent: #8f9cff; --accentHover: #a8b2ff; --onAccent: #0e1230;
  --error: #f39a9a; --warning: #e4bb6a; --success: #74d19c;
  --errorSurface: #3a1d22; --errorSurfaceText: #f6bcc1; --warningSurface: #33291a; --warningSurfaceText: #f0d49e;
  --icon: #a3a9b5; --iconMuted: #7f8694;
  --red: #e66767; --green: #6fbf8a;
  --addedRow: #18301f; --removedRow: #3a1d22;
  --shadow: #00000085; --scrim: #0000008a;
}
html[data-theme='light'] {
  color-scheme: light;
  --canvas: #ffffff; --panel: #ffffff; --chrome: #f7f8fa; --raised: #f1f3f6; --overlay: #ffffff; --input: #ffffff;
  --accentSurface: #dde1f9; --hover: #dfe2e7; --active: #d6dae0; --selection: #e7ebfc; --selectionStrong: #d9e0fb;
  --text: #1c1f26; --textStrong: #0a0c10; --textSecondary: #3a404b; --textTertiary: #4d5461; --textMuted: #5c6370; --textAccent: #3240b0;
  --border: #e3e6eb; --borderSubtle: #eceef2; --borderStrong: #d4d8df; --separator: #dcdfe5; --controlBorder: #878e9b; --inputBorder: #878e9b;
  --accent: #4453d0; --accentHover: #3744b8; --onAccent: #ffffff;
  --error: #b42229; --warning: #875800; --success: #146f3b;
  --errorSurface: #fdecec; --errorSurfaceText: #8f1d24; --warningSurface: #fff5dc; --warningSurfaceText: #6b4400;
  --icon: #4d5461; --iconMuted: #6b7280;
  --red: #c42b3c; --green: #2e7d4f;
  --addedRow: #e6f4ea; --removedRow: #fdecec;
  --shadow: #10182830; --scrim: #10182850;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--chrome); color: var(--text); font: var(--size-md)/20px var(--font-ui); font-synthesis: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0; cursor: default; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 1px solid var(--accent); outline-offset: -1px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 12px; height: 12px; }

/* ---- Mock controls: not part of the app ---- */
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; border-bottom: 1px dashed var(--controlBorder); background: var(--raised); font-size: var(--size-sm); line-height: 16px; }
.mock-bar h1 { margin: 0; font-size: var(--size-md); font-weight: 600; color: var(--textStrong); }
.mock-bar .tag { padding: 0 6px; border: 1px dashed var(--controlBorder); border-radius: var(--radius-pill); color: var(--textMuted); font-size: var(--size-xs); }
.mock-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--textMuted); }
.mock-bar select { height: 24px; padding: 0 6px; font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--inputBorder); border-radius: var(--radius-sm); }
.mock-bar .grow { flex: 1; }
.seg { display: inline-flex; gap: 1px; padding: 1px; border: 1px solid var(--border); border-radius: var(--radius-sm); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; color: var(--textMuted); font-size: var(--size-xs); white-space: nowrap; }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed='true'] { background: var(--selection); color: var(--textStrong); font-weight: 600; }
.mock-note { margin: 0; padding: 6px 12px; color: var(--textMuted); font-size: var(--size-xs); line-height: 16px; border-bottom: 1px dashed var(--border); background: var(--raised); }
.mock-note b { color: var(--textSecondary); font-weight: 600; }
.stage { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.pane { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 1100px; height: 470px; min-width: 300px; min-height: 220px; flex: none; overflow: hidden; resize: both; background: var(--panel); border: 1px solid var(--borderStrong); font-size: var(--size-sm); line-height: 16px; }
body[data-size='narrow'] .pane { width: 460px; }

/* ---- Controls ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 24px; padding: 0 10px; white-space: nowrap; color: var(--textSecondary); font-size: var(--size-sm); flex: none; }
.btn:hover:not(:disabled), .ib:hover:not(:disabled) { background: var(--hover); color: var(--textStrong); }
.btn:disabled, .ib:disabled { opacity: .42; }
.btn.outline { border-color: var(--controlBorder); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--onAccent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accentHover); color: var(--onAccent); }
.btn[aria-pressed='true'] { background: var(--selection); color: var(--textAccent); border-color: var(--accent); }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; color: var(--icon); }
.ib.small { width: 20px; height: 20px; }
.ib[aria-pressed='true'] { background: var(--selection); color: var(--textAccent); }
.badge { min-width: 16px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--active); color: var(--textSecondary); font: 600 var(--size-xs)/16px var(--font-ui); text-align: center; }
.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--textMuted); font-size: var(--size-xs); white-space: nowrap; }
.chip.warn { border-color: var(--warning); background: var(--warningSurface); color: var(--warningSurfaceText); }

/* ---- Output toolbar ---- */
.otb { display: flex; flex: none; align-items: center; gap: 8px; min-height: var(--bar); padding: 0 6px 0 8px; border-bottom: 1px solid var(--border); background: var(--panel); }
.oviews { display: inline-flex; flex: none; gap: 1px; padding: 1px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.oviews button { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; color: var(--textMuted); font-size: var(--size-sm); }
.oviews button[aria-selected='true'] { background: var(--selection); color: var(--textStrong); font-weight: 600; }
.rtb { display: flex; align-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid var(--border); }
.ostatus { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; font-size: var(--size-xs); color: var(--textMuted); font-variant-numeric: tabular-nums; }
.ostatus svg { vertical-align: -3px; margin-right: 3px; color: var(--success); }
body[data-size='narrow'] .ostatus { display: none; }

/* ---- Stacked grids (stand-in for GridView) ---- */
.main { position: relative; display: flex; flex: 1; min-height: 0; min-width: 0; }
.stack { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
.item { display: flex; flex-direction: column; flex: none; border-bottom: 3px solid var(--border); }
.item.focused .cap { box-shadow: inset 2px 0 var(--accent); }
.cap { position: relative; display: flex; align-items: center; gap: 8px; height: 26px; flex: none; padding: 0 4px 0 8px; border-bottom: 1px solid var(--border); background: var(--chrome); font-size: var(--size-xs); }
.cap strong { font-weight: 600; color: var(--textStrong); white-space: nowrap; }
.cap .meta { color: var(--textMuted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.cap .acts { display: inline-flex; gap: 2px; }
.cap.diff strong::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--red) 50%, var(--green) 50%); }
table.g { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
table.g th, table.g td { height: var(--grid-row); padding: 0 8px; border-right: 1px solid var(--borderSubtle); border-bottom: 1px solid var(--borderSubtle); white-space: nowrap; text-align: left; }
table.g th { height: var(--grid-head); font-weight: 600; color: var(--textSecondary); background: var(--raised); }
table.g th small { font-weight: 400; color: var(--textMuted); margin-left: 4px; }
table.g td.n { width: 32px; color: var(--textMuted); text-align: right; background: var(--raised); }
table.g td.num { text-align: right; }
table.g tr.add td:not(.n) { background: var(--addedRow); }
table.g tr.rem td:not(.n) { background: var(--removedRow); }
table.g td.tone { font-weight: 600; }
tr.add td.tone { color: var(--green); } tr.rem td.tone { color: var(--red); }
table.g .dim { opacity: .45; }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 22px; padding: 3px 8px; border-bottom: 1px solid var(--border); color: var(--textMuted); font-size: var(--size-xs); }
.strip a { color: var(--textAccent); }
.strip.warn { color: var(--warning); }

/* ---- Grid menu (stand-in for the themed context menu) ---- */
.menu { position: absolute; z-index: 20; min-width: 210px; padding: 4px; border: 1px solid var(--borderStrong); border-radius: var(--radius-lg); background: var(--overlay); box-shadow: 0 8px 24px var(--shadow); font-size: var(--size-sm); }
.menu button { display: flex; justify-content: space-between; gap: 24px; width: 100%; height: 24px; padding: 0 8px; text-align: left; }
.menu button:hover, .menu button.hot { background: var(--selection); color: var(--textStrong); }
.menu kbd { font: inherit; color: var(--textMuted); }
.menu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--separator); }

/* ---- The picker body (shared by all three containers) ---- */
.pk { display: flex; flex-direction: column; min-height: 0; font-size: var(--size-sm); }
.pk-head { display: flex; align-items: center; gap: 6px; flex: none; height: 30px; padding: 0 4px 0 10px; }
.pk-head .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--textStrong); font-weight: 600; }
.pk-head .t span { color: var(--textMuted); font-weight: 400; }
.pk-body { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
.pk-foot { display: flex; align-items: center; gap: 6px; flex: none; padding: 8px 10px; border-top: 1px solid var(--border); }
.pk-foot .grow { flex: 1; min-width: 0; }
.lbl { margin: 0 0 4px; font: 600 var(--size-xs)/16px var(--font-ui); text-transform: uppercase; letter-spacing: .04em; color: var(--textMuted); display: flex; align-items: center; gap: 4px; }
.lbl .ib { width: 16px; height: 16px; color: var(--iconMuted); }

/* Direction: − old ⇄ + new, one line */
.dir { display: flex; align-items: center; gap: 4px; }
.side { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--raised); }
.side b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--textStrong); }
.sign { display: inline-grid; place-content: center; width: 16px; height: 16px; flex: none; border-radius: 3px; font: 700 12px/1 var(--font-mono); }
.sign.minus { background: var(--removedRow); color: var(--red); }
.sign.plus { background: var(--addedRow); color: var(--green); }
.side small { margin-left: auto; color: var(--textMuted); font-size: var(--size-xs); white-space: nowrap; }

/* Targets: one row each, keyboard is the radio group's arrows */
.targets { display: flex; flex-direction: column; gap: 1px; margin: 0; padding: 0; border: 0; }
.target { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: var(--radius-sm); }
.target:hover { background: var(--hover); }
.target.on { background: var(--selection); }
.target input { margin: 0; accent-color: var(--accent); }
.target .nm { font-weight: 600; color: var(--textStrong); }
.target .rows { margin-left: auto; color: var(--textMuted); font-size: var(--size-xs); font-variant-numeric: tabular-nums; }

.unp { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.unp li { display: flex; align-items: baseline; gap: 6px; font-size: var(--size-xs); color: var(--textMuted); }
.unp code { font: var(--size-xs)/16px var(--font-mono); color: var(--text); }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.check input { margin: 0; accent-color: var(--accent); }
.check small { color: var(--textMuted); }
.note { padding: 5px 8px; border-radius: var(--radius-sm); font-size: var(--size-xs); line-height: 16px; display: flex; gap: 6px; align-items: flex-start; }
.note.warn { background: var(--warningSurface); color: var(--warningSurfaceText); }
.note.err { background: var(--errorSurface); color: var(--errorSurfaceText); }
.note.plain { padding: 0; color: var(--textMuted); }
.spin { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* Option A: docked pane, in the builder's place */
.dock { display: flex; flex-direction: column; width: 272px; flex: none; min-height: 0; border-left: 1px solid var(--border); background: var(--chrome); }
.dock .pk-head { height: 26px; border-bottom: 1px solid var(--border); }
.dock .pk-head .t { font-size: var(--size-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--textTertiary); }
.dock .pk-head .t span { text-transform: none; letter-spacing: 0; }
.dock .pk-body { padding-top: 8px; }
body[data-size='narrow'] .dock { width: 220px; }

/* Option B: popover, anchored to its trigger */
.pop { position: absolute; z-index: 30; width: 296px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); display: flex; flex-direction: column; border: 1px solid var(--borderStrong); border-radius: var(--radius-lg); background: var(--overlay); box-shadow: 0 10px 32px var(--shadow); }
.pop::before { content: ''; position: absolute; top: -6px; width: 10px; height: 10px; transform: rotate(45deg); background: var(--overlay); border-left: 1px solid var(--borderStrong); border-top: 1px solid var(--borderStrong); right: var(--beak, 16px); }
.pop.no-beak::before { display: none; }

/* Option C: modal dialog */
.scrim { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.modal { width: 440px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; border: 1px solid var(--borderStrong); border-radius: var(--radius-lg); background: var(--overlay); box-shadow: 0 16px 48px var(--shadow); }
.modal .pk-head { height: 40px; padding-left: 14px; }
.modal .pk-head .t { font-size: var(--size-lg); }
.modal .pk-body { padding: 6px 14px 14px; gap: 12px; }
.modal .pk-foot { padding: 10px 14px; }

.toast { position: absolute; z-index: 50; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--borderStrong); border-radius: var(--radius-lg); background: var(--overlay); box-shadow: 0 6px 18px var(--shadow); font-size: var(--size-xs); color: var(--textSecondary); white-space: nowrap; }

/* ---- Write-up under the pane ---- */
.doc { width: 100%; max-width: 1100px; display: grid; gap: 16px; font-size: var(--size-md); line-height: 20px; }
.doc h2 { margin: 0 0 6px; font-size: var(--size-lg); color: var(--textStrong); }
.doc h3 { margin: 0 0 4px; font-size: var(--size-md); color: var(--textStrong); }
.doc p { margin: 0 0 8px; color: var(--textSecondary); }
.doc ul { margin: 0; padding-left: 18px; color: var(--textSecondary); }
.doc li { margin: 2px 0; }
.card { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--panel); }
.card.rec { border-color: var(--accent); box-shadow: inset 3px 0 var(--accent); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pro::marker { content: '+  '; color: var(--success); font-weight: 700; }
.con::marker { content: '−  '; color: var(--error); font-weight: 700; }
table.cmp { width: 100%; border-collapse: collapse; font-size: var(--size-sm); line-height: 18px; }
table.cmp th, table.cmp td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; color: var(--textSecondary); }
table.cmp th { color: var(--textStrong); font-weight: 600; background: var(--raised); }
table.cmp td:first-child { color: var(--textStrong); font-weight: 600; white-space: nowrap; }
table.cmp .best { color: var(--success); }
table.cmp .worst { color: var(--error); }
table.copy td:nth-child(2) { white-space: nowrap; }
table.copy s { color: var(--textMuted); }
</style>
</head>
<body data-size="normal">
<div class="mock-bar">
  <h1>Compare picker · layout options</h1><span class="tag">mock</span>
  <label>Option <span class="seg" id="optSeg"></span></label>
  <label>State <select id="stateSel"></select></label>
  <label>Opened from <span class="seg" id="fromSeg"></span></label>
  <span class="grow"></span>
  <label>Pane <span class="seg" id="sizeSeg"></span></label>
  <label>Theme <span class="seg" id="themeSeg"></span></label>
</div>
<p class="mock-note" id="mockNote"></p>
<div class="stage">
  <div class="pane" id="pane"></div>
  <div class="doc" id="doc"></div>
</div>

<script>
const ICONS = {
  x: 'M4 4l8 8M12 4l-8 8', chevD: 'M4 6l4 4 4-4', search: 'M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM11 11l3.5 3.5',
  warn: 'M8 2l6.5 11.5h-13zM8 6.5v3.5M8 12v.2', save: 'M3 2.5h8l2.5 2.5v8.5H3zM5.5 2.5v4h5v-4M5 13.5v-4h6v4',
  more: 'M3.5 8h.1M8 8h.1M12.5 8h.1', swap: 'M2.5 5.5h11M11 3l2.5 2.5L11 8M13.5 10.5h-11M5 8l-2.5 2.5L5 13',
  pivot: 'M2.5 2.5h11v11h-11zM2.5 6h11M6 6v7.5', compare: 'M2.5 3.5h4.5v9H2.5zM9 3.5h4.5v9H9zM4 6.5h1.5M10.5 6.5H12M11.25 5.75v1.5',
  ok: 'M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zM5.5 8.2l1.8 1.8 3.4-3.6', spinner: 'M8 2a6 6 0 1 0 6 6',
  help: 'M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zM6.3 6.2a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4M8 11.3v.2',
  info: 'M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zM8 7.2v4M8 4.8v.2', funnel: 'M2.5 3h11L9.5 8.5V13l-3-1.5v-3z'
}
const icon = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true"${name === 'more' ? ' style="stroke-width:2"' : ''}><path d="${ICONS[name]}"/></svg>`
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

// ---------- sample run (fictional) ----------
const COLS = [['OrderID', 'int'], ['Customer', 'nvarchar(40)'], ['Status', 'varchar(12)'], ['Total', 'money']]
const COLS3 = [['OrderID', 'int'], ['Customer', 'nvarchar(40)'], ['Status', 'varchar(12)'], ['Amount', 'money']]
const ROWS = [[10248, 'Harbor Lane Foods', 'Shipped', '440.00'], [10249, 'Quill & Ink', 'Pending', '1863.40'], [10250, 'Northwind Kiosk', 'Shipped', '1552.60'], [10251, 'Blue Fern Co', 'Pending', '654.06']]
const ROWS1 = [[10248, 'Harbor Lane Foods', 'Shipped', '440.00'], [10249, 'Quill & Ink', 'Shipped', '1863.40'], [10250, 'Northwind Kiosk', 'Shipped', '1552.60'], [10252, 'Ostara Market', 'Pending', '3597.90']]
const RESULTS = { 1: { cols: COLS, rows: ROWS1, count: 100 }, 2: { cols: COLS, rows: ROWS, count: 100 }, 3: { cols: COLS3, rows: ROWS, count: 98 } }

const STATES = [
  ['many', 'Several targets (default pick)'],
  ['unpaired', 'Target with columns left out'],
  ['one', 'Only one target: no list'],
  ['filtered', 'An input is filtered'],
  ['running', 'Comparing…'],
  ['failed', 'Comparison failed'],
  ['exists', 'Already compared: Show It'],
  ['none', 'Nothing to compare with']

const OPTIONS = [['A', 'A · Docked pane'], ['B', 'B · Popover (recommended)'], ['C', 'C · Modal']]

const q = new URLSearchParams(location.search)
const S = {
  option: q.get('option') || 'B', state: q.get('state') || 'many', from: q.get('from') || 'toolbar',
  size: q.get('size') || 'normal', theme: q.get('theme') || 'dark',
  open: true, menu: false, target: 1, swapped: false, exact: false, phase: 'idle', diffs: [], toast: ''
}
const anchor = 2 // Compare… was opened on Result 2's grid
const runResults = () => S.state === 'one' ? [1, 2] : S.state === 'none' ? [2] : [1, 2, 3]
const targetsOf = () => runResults().filter(n => n !== anchor)
function resetState() {
  S.open = true; S.menu = false; S.swapped = false; S.exact = false; S.diffs = []; S.toast = ''
  S.target = S.state === 'unpaired' ? 3 : 1
  S.phase = S.state === 'running' ? 'running' : S.state === 'failed' ? 'failed' : 'idle'

const sides = () => S.swapped ? { old: anchor, neu: S.target } : { old: S.target, neu: anchor }
const pairing = (a, b) => {
  const ca = RESULTS[a].cols, cb = RESULTS[b].cols
  const names = new Set(cb.map(c => c[0].toLowerCase()))
  const namesA = new Set(ca.map(c => c[0].toLowerCase()))
  return { pairs: ca.filter(c => names.has(c[0].toLowerCase())).length, total: ca.length, aOnly: ca.filter(c => !names.has(c[0].toLowerCase())), bOnly: cb.filter(c => !namesA.has(c[0].toLowerCase())) }
}
const filteredInputs = () => S.state === 'filtered' ? [anchor] : []
const existing = () => { const s = sides(); return S.diffs.find(d => d.old === s.old && d.neu === s.neu && d.exact === S.exact) }

// ---------- picker content (one design, three containers) ----------
function pickerBody(mode) {
  const targets = targetsOf()
  if (!targets.length) return `<div class="pk-body"><div class="note plain">No other result of this run shares a column with Result ${anchor}.</div></div>
    <div class="pk-foot"><span class="grow"></span><button class="btn outline" data-act="close">Close</button></div>`
  const s = sides(), p = pairing(s.old, s.neu)

    ${targets.map(n => { const tp = pairing(anchor, n); return `<label class="target${S.target === n ? ' on' : ''}"><input type="radio" name="tg" data-act="pick" data-n="${n}"${S.target === n ? ' checked' : ''}${S.phase === 'running' ? ' disabled' : ''}>
      <span class="nm">Result ${n}</span>${tp.pairs < tp.total ? `<span class="chip warn" title="${tp.pairs} of ${tp.total} columns pair; the rest are left out">${tp.pairs} of ${tp.total} columns</span>` : ''}
      <span class="rows">${RESULTS[n].count} rows</span></label>` }).join('')}
  </fieldset>` : ''
  const side = (n, sign) => `<div class="side" title="${sign === 'minus' ? 'Old side: rows only here show as removed' : 'New side: rows only here show as added'}"><span class="sign ${sign}">${sign === 'minus' ? '−' : '+'}</span><b>Result ${n}</b>${targets.length === 1 ? `<small>${RESULTS[n].count} rows</small>` : ''}</div>`
  const dir = `<div class="dir">${side(s.old, 'minus')}<button class="ib" data-act="swap" title="Swap old and new" aria-label="Swap old and new"${S.phase === 'running' ? ' disabled' : ''}>${icon('swap')}</button>${side(s.neu, 'plus')}</div>`
  const left = [...p.aOnly.map(c => [c, s.old]), ...p.bOnly.map(c => [c, s.neu])]
  const unpaired = left.length ? `<div><div class="lbl">Not compared <button class="ib" title="Columns pair by name (ignoring case) and kind of data. There is no manual mapping." aria-label="How columns pair">${icon('info', 'sm')}</button></div>
    <ul class="unp">${left.map(([c, n]) => `<li><code>${esc(c[0])}</code><span>only in Result ${n}</span></li>`).join('')}</ul></div>` : ''
  const filt = filteredInputs()
  const warn = filt.length ? `<div class="note warn">${icon('funnel', 'sm')}<span>Result ${filt.join(' and ')} is filtered here. The comparison uses all its rows.</span></div>` : ''
  const exact = `<label class="check" title="Case and trailing spaces count"><input type="checkbox" data-act="exact"${S.exact ? ' checked' : ''}${S.phase === 'running' ? ' disabled' : ''}> Exact text</label>`
  const status = S.phase === 'failed' ? `<div class="note err" role="status">${icon('warn', 'sm')}<span>The backend stopped the comparison: the results are too large to compare in memory.</span></div>` : ''
  const shown = existing()
  const name = `Differences: Result ${s.old} → Result ${s.neu}`
  const primary = S.phase === 'running'
    ? `<button class="btn primary" aria-disabled="true">${icon('spinner', 'spin')}Comparing…</button>`
    : `<button class="btn primary" data-act="run" title="${shown ? 'Shows' : 'Opens'} “${esc(name)}” (Enter)">${shown ? 'Show It' : 'Compare'}</button>`
  const second = S.phase === 'running' ? `<button class="btn outline" data-act="cancel">Cancel</button>`
    : mode === 'dock' ? '' : `<button class="btn outline" data-act="close">Close</button>`
  const help = `<button class="ib small" title="About comparisons (opens Results tools › Comparisons)" aria-label="About comparisons">${icon('help', 'sm')}</button>`
  return `<div class="pk-body">${list}${dir}${unpaired}${warn}${status}</div>
    <div class="pk-foot">${exact}<span class="grow"></span>${help}${second}${primary}</div>`
}
const pickerHead = mode => mode === 'dock'
  ? `<div class="pk-head"><span class="t">Compare <span>· Result ${anchor}</span></span><button class="ib small" data-act="close" title="Close Compare" aria-label="Close Compare">${icon('x', 'sm')}</button></div>`
  : `<div class="pk-head"><span class="t">Compare Result ${anchor} ${targetsOf().length ? `<span>with</span>` : ''}</span><button class="ib small" data-act="close" title="Close (Esc)" aria-label="Close">${icon('x', 'sm')}</button></div>`
const picker = mode => `<div class="pk" role="${mode === 'modal' ? 'dialog' : mode === 'pop' ? 'dialog' : 'complementary'}" aria-label="Compare"${mode === 'modal' ? ' aria-modal="true"' : ''}>${pickerHead(mode)}${pickerBody(mode)}</div>`

// ---------- the results pane ----------
function grid(n) {
  const r = RESULTS[n], focused = n === anchor
  const cap = `<div class="cap" data-cap="${n}"><strong>Result ${n}</strong><span class="meta">${r.count} rows · ${r.cols.length} columns${filteredInputs().includes(n) ? ' · filtered' : ''}</span>
    <span class="acts"><button class="ib small" title="Save Results As…">${icon('save', 'sm')}</button><button class="ib small" data-act="menu" data-n="${n}" title="More actions (or right-click the grid)" aria-label="More actions">${icon('more', 'sm')}</button><button class="ib small" title="Close Result ${n}">${icon('x', 'sm')}</button></span></div>`
  const head = `<tr><th></th>${r.cols.map(c => `<th>${c[0]}<small>${c[1]}</small></th>`).join('')}</tr>`
  const body = r.rows.slice(0, 3).map((row, i) => `<tr><td class="n">${i + 1}</td>${row.map((v, j) => `<td class="${j === 0 || j === 3 ? 'num' : ''}">${esc(v)}</td>`).join('')}</tr>`).join('')
  return `<div class="item${focused ? ' focused' : ''}" data-item="${n}">${cap}<div style="overflow:auto"><table class="g">${head}${body}</table></div></div>`
}
function diffGrid(d) {
  const a = RESULTS[d.old], b = RESULTS[d.neu]
  const rows = [['−', ...a.rows[1]], ['+', ...b.rows[1]], ['−', ...a.rows[3]], ['+', ...b.rows[3]]]
  const p = pairing(d.old, d.neu)
  return `<div class="item focused"><div class="cap diff"><strong>Differences: Result ${d.old} → Result ${d.neu}</strong><span class="meta">2 changed · 0 removed · 0 added</span><span class="acts"><button class="ib small">${icon('more', 'sm')}</button><button class="ib small">${icon('x', 'sm')}</button></span></div>
    <div class="strip"><span><a href="#">Result ${d.old}</a> → <a href="#">Result ${d.neu}</a></span>${p.aOnly.length + p.bOnly.length ? `<span>· Not compared: ${[...p.aOnly, ...p.bOnly].map(c => c[0]).join(', ')}</span>` : ''}${d.exact ? '<span>· Exact text</span>' : ''}</div>
    <div style="overflow:auto"><table class="g"><tr><th></th><th>Change</th>${a.cols.filter(c => b.cols.some(x => x[0] === c[0])).map(c => `<th>${c[0]}</th>`).join('')}</tr>
    ${rows.map((row, i) => `<tr class="${row[0] === '−' ? 'rem' : 'add'}"><td class="n">${i + 1}</td><td class="tone">${row[0] === '−' ? 'Old' : 'New'}</td>${row.slice(1, 1 + p.pairs).map((v, j) => `<td class="${j === 0 || j === 3 ? 'num' : ''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div></div>`
}
function render() {
  document.documentElement.dataset.theme = S.theme
  document.body.dataset.size = S.size
  seg('optSeg', OPTIONS, S.option, v => { S.option = v; resetState(); render() })
  seg('fromSeg', [['toolbar', 'Toolbar'], ['menu', 'Grid menu']], S.from, v => { S.from = v; resetState(); render() })
  seg('sizeSeg', [['normal', 'Normal'], ['narrow', 'Narrow']], S.size, v => { S.size = v; render() })
  seg('themeSeg', [['dark', 'Dark'], ['light', 'Light']], S.theme, v => { S.theme = v; render() })
  const sel = document.getElementById('stateSel')
  sel.innerHTML = STATES.map(([v, l]) => `<option value="${v}"${v === S.state ? ' selected' : ''}>${l}</option>`).join('')
  sel.onchange = () => { S.state = sel.value; resetState(); render() }
  document.getElementById('mockNote').innerHTML = NOTES[S.option]

  const mode = S.option === 'A' ? 'dock' : S.option === 'B' ? 'pop' : 'modal'
  const open = S.open
  const toggle = `<button class="btn${open ? '' : ''}" data-act="toggle" id="cmpBtn" aria-pressed="${open}" title="Compare Results…">${icon('compare')}${S.size === 'narrow' ? '' : 'Compare'}</button>`
  const pane = document.getElementById('pane')
  pane.innerHTML = `
    <div class="otb"><div class="oviews" role="tablist"><button role="tab" aria-selected="true">Results <span class="badge">${runResults().length + S.diffs.length}</span></button><button role="tab" aria-selected="false">Messages</button></div>
      <div class="rtb"><button class="ib" title="Pivot…">${icon('pivot')}</button>${toggle}</div>
      <span class="ostatus">${icon('ok')}Completed · ${runResults().length} results · 0.064 s</span></div>
    <div class="main"><div class="stack" id="stack">${S.diffs.map(diffGrid).join('')}${runResults().map(grid).join('')}</div>
      ${mode === 'dock' && open ? `<aside class="dock">${picker('dock')}</aside>` : ''}</div>
    ${mode === 'pop' && open ? `<div class="pop" id="pop">${picker('pop')}</div>` : ''}
    ${mode === 'modal' && open ? `<div class="scrim" data-act="scrim"><div class="modal">${picker('modal')}</div></div>` : ''}
    ${S.menu ? menuHtml() : ''}
    ${S.toast ? `<div class="toast">${icon('info', 'sm')}${esc(S.toast)}</div>` : ''}`

  if (S.menu) placeMenu()
  wire(pane)
  document.getElementById('doc').innerHTML = DOC
}
function placePopover() {
  const pane = document.getElementById('pane'), pop = document.getElementById('pop'), pr = pane.getBoundingClientRect()
  let anchorEl = S.from === 'toolbar' ? document.getElementById('cmpBtn') : pane.querySelector(`[data-cap="${anchor}"] [data-act="menu"]`)
  const ar = anchorEl.getBoundingClientRect(), w = pop.offsetWidth
  const right = Math.min(pr.right - 8, ar.right + 6), left = Math.max(pr.left + 8, right - w)
  pop.style.left = (left - pr.left) + 'px'
  pop.style.top = (ar.bottom - pr.top + 8) + 'px'
  pop.style.setProperty('--beak', Math.max(10, (left + w) - (ar.left + ar.width / 2) - 5) + 'px')
}
const menuHtml = () => `<div class="menu" id="menu" role="menu">
  <button>Copy<kbd>Ctrl+C</kbd></button><button>Copy with Headers<kbd>Ctrl+Shift+C</kbd></button><hr>
  <button>Pivot…</button><button class="hot" data-act="openFromMenu">Compare…</button><button>Compare with Previous Result</button><hr>
  <button>Save Results As…</button></div>`
function placeMenu() {
  const pane = document.getElementById('pane'), m = document.getElementById('menu'), pr = pane.getBoundingClientRect()
  const ar = pane.querySelector(`[data-cap="${anchor}"] [data-act="menu"]`).getBoundingClientRect()
  m.style.left = Math.max(8, ar.right - pr.left - m.offsetWidth) + 'px'; m.style.top = (ar.bottom - pr.top + 2) + 'px'
}
function seg(id, items, value, set) {
  const el = document.getElementById(id)
  el.innerHTML = items.map(([v, l]) => `<button type="button" aria-pressed="${v === value}" data-v="${v}">${l}</button>`).join('')
  el.querySelectorAll('button').forEach(b => b.onclick = () => set(b.dataset.v))
}
function wire(pane) {
  pane.onclick = e => {
    const t = e.target.closest('[data-act]'); if (!t) { if (S.option === 'B' && S.open && !e.target.closest('.pop')) { S.open = false; render() } if (S.menu && !e.target.closest('.menu')) { S.menu = false; render() } return }
    const act = t.dataset.act
    if (act === 'scrim' && e.target !== t) return
    switch (act) {
      case 'toggle': S.menu = false; S.from = 'toolbar'; S.open = !S.open; S.toast = ''; break
      case 'menu': S.menu = !S.menu; break
      case 'openFromMenu': S.menu = false; S.from = 'menu'; S.open = true; S.toast = ''; break
      case 'close': case 'scrim': S.open = false; S.toast = 'Focus returns to ' + (S.from === 'toolbar' ? 'the Compare button' : `Result ${anchor}'s grid`); break
      case 'pick': S.target = +t.dataset.n; S.phase = 'idle'; break
      case 'swap': S.swapped = !S.swapped; S.phase = 'idle'; break
      case 'exact': S.exact = t.checked; S.phase = 'idle'; break
      case 'cancel': S.phase = 'idle'; S.toast = 'Comparison cancelled'; break
      case 'run': run(); return

  }
}
function run() {
  const s = sides(), shown = existing()
  if (shown) return finish(`Showing Differences: Result ${s.old} → Result ${s.neu}`)
  S.phase = 'running'; render()

}
function finish(msg) {
  S.phase = 'idle'; S.toast = msg
  if (S.option !== 'A') S.open = false // B and C close on success; A stays open (today's rule)
  render(); document.getElementById('stack').scrollTop = 0
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.open || S.menu) && S.option !== 'A') { S.menu = false; S.open = false; S.toast = 'Esc: focus returns to ' + (S.from === 'toolbar' ? 'the Compare button' : `Result ${anchor}'s grid`); render() }
  if (e.key === 'Enter' && S.open && e.target.closest?.('.pk') && !e.target.matches('button')) { e.preventDefault(); run() }
})

const NOTES = {

  B: '<b>Option B, popover (recommended).</b> Anchored to what opened it: the toolbar\'s Compare button, or the grid\'s caption when opened from Compare… in the grid menu (switch <i>Opened from</i>, or use the caption\'s ⋯ menu). Enter compares, Esc or a click outside closes it, and focus goes back to the trigger. On success it closes and the comparison takes the focus.',
  C: '<b>Option C, modal dialog.</b> Centred over the window with a scrim; focus is trapped inside until Compare, Close or Esc. Shown for completeness: it hides the grids you are choosing between.'
