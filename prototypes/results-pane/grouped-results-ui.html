    const comparisonTabs = state.comparisons.filter(item => tabVisible('c', item.id)).map(item => `<div class="vg-group" data-active="${comparison?.id === item.id}">${button('comparison', item.label, `role="tab" id="vg-comparison-${item.id}" aria-controls="vg-result-content" aria-selected="${comparison?.id === item.id}" data-id="${item.id}"`)}${closeButton('close-comparison', `Close ${item.label}`, `data-id="${item.id}" class="vg-close cursor-interaction"`)}</div>`).join('')
    const actions = group && !comparison ? `<span class="vg-actions-labeled" ${config.actions === 'Actions menu' ? 'style="display:none!important"' : ''}>${view === 'table' || view === 'pivot' ? button('pivot', group.views.pivot ? 'Edit Pivot…' : 'Pivot…', !ready ? 'disabled' : '') : ''}${view === 'table' ? button('transpose', group.views.transpose ? 'Rebuild Transpose' : 'Transpose', !ready ? 'disabled' : '') : ''}${button('compare', 'Compare…', !ready ? 'disabled' : '')}</span>${button('actions', 'Actions', `class="vg-actions-compact cursor-interaction" ${config.actions === 'Actions menu' ? 'style="display:inline-flex!important"' : ''} aria-expanded="${state.menu === 'actions'}"`).replace('class="cursor-interaction" ', '')}` : ''
    const views = group && !comparison ? `<div class="vg-views" role="tablist" aria-label="Views of ${group.label}">${['table', ...['pivot', 'transpose'].filter(kind => group.views[kind])].map(kind => `<div class="vg-view" data-active="${kind === view}">${button('view', viewNames[kind], `role="tab" id="vg-view-${kind}" aria-controls="vg-result-content" aria-selected="${kind === view}" data-kind="${kind}"`)}${kind !== 'table' ? closeButton('close-view', `Close ${viewNames[kind]} of ${group.label}`, `data-id="${group.id}" data-kind="${kind}" class="vg-close cursor-interaction"`) : ''}</div>`).join('')}</div>` : comparison ? `<strong>${viewNames[view]} · Result ${comparison.left} ↔ Result ${comparison.right}</strong>` : ''
    const annotatedFilter = group && !comparison && view === 'table' && group.filter !== null
    const outputData = currentData && !lost && config.runState !== 'Empty'
    const summary = config.runState === 'Empty' ? 'Ready' : config.runState === 'Running' ? 'Executing' : lost ? 'Connection lost' : 'Completed'
    app.innerHTML = `<div class="vg-top"><div class="vg-output-tabs" role="tablist" aria-label="Query output">${button('results', `Results <span class="vg-count">${state.groups.length}</span>`, `role="tab" aria-selected="${state.output === 'results'}" aria-controls="vg-results-output" id="vg-results-tab" data-tooltip="${state.groups.length} original results · ${allCount} total views"`)}${button('messages', 'Messages <span class="vg-count">2</span>', `role="tab" aria-selected="${state.output === 'messages'}" aria-controls="vg-messages-output" id="vg-messages-tab"`)}</div><div class="vg-display" role="toolbar" aria-label="Results tools"><label class="vg-search">${icon('search', '⌕')}<input type="text" data-field="search" aria-label="${state.searchMode === 'Columns' ? 'Search column names' : 'Search all results'}" placeholder="${state.searchMode === 'Columns' ? 'Search column names' : 'Search all results'}" value="${esc(state.search)}"><span class="vg-search-count">${state.search ? `${matches.length ? state.match + 1 : 0}/${matches.length}${matches.length >= 500 ? '+' : ''}` : ''}</span>${iconButton('previous-match', 'Previous match', 'arrow-up', '↑', `class="vg-search-step cursor-interaction" ${!matches.length ? 'disabled' : ''}`)}${iconButton('next-match', 'Next match', 'arrow-down', '↓', `class="vg-search-step cursor-interaction" ${!matches.length ? 'disabled' : ''}`)}${button('search-mode', state.searchMode, `aria-label="Search in ${state.searchMode === 'Data' ? 'columns' : 'data'}" data-tooltip="Search ${state.searchMode === 'Data' ? 'column names' : 'cell values'}"`)}</label>${segments('whitespace', 'White space', ['Off', 'Spaces', 'All'], state.whitespace)}${segments('sort-text', 'Sort text by', ['Value', 'Chars', 'Bytes'], state.sortText)}<div class="vg-segments" role="group" aria-label="Show">${button('profile', 'Profile', `aria-pressed="${state.profile}" data-tooltip="Column profile of the active view"`)}${button('row-size', 'Rows', `aria-label="Row size" aria-pressed="${state.rowSize}" data-tooltip="Row size bars"`)}</div></div><span class="vg-summary">${icon(config.runState === 'Running' ? 'loader' : lost ? 'circle-alert' : 'circle-check', config.runState === 'Running' ? '◌' : lost ? '!' : '✓')}<strong>${summary}</strong><span class="vg-summary-detail">${config.runState === 'Running' ? '· 20,463 rows so far · 0.8 s' : lost ? '· results unavailable' : config.runState === 'Empty' ? '' : '· 40,926 rows · 0.038 s'}</span></span>${iconButton('close-all', 'Close all results', 'x', '×', !canClose || !allCount ? 'disabled' : '')}</div><div class="vg-output" id="vg-results-output" role="tabpanel" aria-labelledby="vg-results-tab" ${state.output !== 'results' ? 'hidden' : ''}><div class="vg-groups" role="tablist" aria-label="Original results and comparisons">${nav}${comparisonTabs}${allCount ? `<select class="vg-all-results" aria-label="All results and views" data-field="navigate">${state.groups.map(item => `<optgroup label="${item.label}">${['table', ...Object.keys(item.views)].map(kind => `<option value="${item.id}:${kind}" ${!comparison && group?.id === item.id && view === kind ? 'selected' : ''}>${item.label} · ${viewNames[kind]}</option>`).join('')}</optgroup>`).join('')}${state.comparisons.map(item => `<option value="c:${item.id}" ${comparison?.id === item.id ? 'selected' : ''}>${item.label}</option>`).join('')}</select>` : ''}</div>${currentData ? `<div class="vg-viewbar">${views}<div class="vg-actions">${actions}${iconButton('save', 'Save active view as…', 'save', '↓')}${iconButton('actions', 'More result actions', 'ellipsis', '…', `aria-expanded="${state.menu === 'actions'}"`)}</div></div>` : ''}${outputData ? `<div class="vg-facts"><strong>${esc(activeName())}</strong><span>${number(currentData.rows.length)} rows · ${number(currentData.columns.length)} ${currentData.columns.length === 1 ? 'column' : 'columns'}${config.runState === 'Running' ? ' · loading' : ''}</span>${annotatedFilter ? `<span class="vg-filter-chip">${columns()[0].name} in (${group.filter.map(esc).join(', ')})${closeButton('clear-filter', 'Remove filter')}</span>` : ''}${group && view === 'table' && !comparison ? button('filter', 'Filter…', 'data-tooltip="Filter the first column"') : ''}</div><div class="vg-main"><div class="vg-grid-column" id="vg-result-content" role="tabpanel" aria-labelledby="${comparison ? `vg-comparison-${comparison.id}` : `vg-view-${view}`}"><div class="vg-scroller"></div>${sourceStrip(currentData)}</div>${state.profile || state.panel ? `<div class="vg-sidecars" data-both="${!!state.profile && !!state.panel}">${state.profile && state.panel ? `<div class="vg-side-switch">${button('side-profile', 'Profile', `aria-pressed="${state.sideFront === 'profile'}"`)}${button('side-builder', state.panel.kind === 'pivot' ? 'Pivot' : 'Compare', `aria-pressed="${state.sideFront === 'builder'}"`)}</div>` : ''}${state.profile ? profileMarkup(currentData) : ''}${panelMarkup()}</div>` : ''}</div>` : `<div class="vg-empty"><strong>${lost ? 'Results are no longer available' : config.runState === 'Empty' ? 'Query results' : 'Results closed'}</strong><span>${lost ? 'Reconnect and execute the query again.' : config.runState === 'Empty' ? 'Execute a query to view results.' : 'Execute the query again to load results. Messages are kept.'}</span></div>`}${state.notice ? `<div class="vg-notice" aria-live="polite"><span>${esc(state.notice)}</span>${closeButton('dismiss', 'Dismiss notice')}</div>` : ''}<div class="vg-messages-strip">${button('messages-strip', `${icon(state.messages ? 'chevron-down' : 'chevron-right', state.messages ? '⌄' : '›')} Messages <span>· 2 · no errors</span>`, `aria-expanded="${state.messages}" aria-controls="vg-inline-messages"`)}${state.messages ? '<div class="vg-messages" id="vg-inline-messages">(20,463 rows affected)<br>(20,463 rows affected)</div>' : ''}</div></div><div id="vg-messages-output" class="vg-messages" role="tabpanel" aria-labelledby="vg-messages-tab" ${state.output !== 'messages' ? 'hidden' : ''}>(20,463 rows affected)<br>(20,463 rows affected)</div>${menuMarkup()}`
    const scroller = app.querySelector('.vg-scroller')
    if (scroller) { scroller.scrollTop = scrollPosition.top; scroller.scrollLeft = scrollPosition.left; paintGrid(); scroller.addEventListener('scroll', () => { scrollPosition = { top: scroller.scrollTop, left: scroller.scrollLeft }; paintGrid() }, { passive: true }) }
    globalThis.lucide?.createIcons({ attrs: { width: 14, height: 14 } })
  }
  function normalize() {
    if (state.comparison && !activeComparison()) state.comparison = null
    if (!activeGroup()) state.activeGroup = state.groups[0]?.id ?? 0
    const group = activeGroup()
    if (group && group.active !== 'table' && !group.views[group.active]) group.active = 'table'
  }
  function moveMatch(by) {
    if (!matches.length) return
    state.match = (state.match + by + matches.length) % matches.length
    const match = matches[state.match]
    state.activeGroup = match.group; state.comparison = null; activeGroup().active = match.kind; state.selection = { row: match.row, col: match.col }; state.panel = null
    render()
    const scroller = app.querySelector('.vg-scroller')
    if (scroller) { scroller.scrollTop = match.row * config.rowHeight; scroller.scrollLeft = currentData.columns.slice(0, match.col).reduce((sum, column) => sum + column.width, 0); paintGrid() }
  }
  app.addEventListener('click', event => {
    const cell = event.target.closest('[data-cell]')
    if (cell) { const [row, col] = cell.dataset.cell.split(':').map(Number); state.selection = { row, col }; paintGrid(); save(); return }
    const control = event.target.closest('button[data-action]')
    if (!control || control.disabled) return
    const action = control.dataset.action, group = activeGroup(), comparison = activeComparison()
    let keepScroll = false
    if (!['actions', 'filter', 'filter-only-eight'].includes(action)) state.menu = null
    if (action === 'group' || action === 'source') { state.activeGroup = Number(control.dataset.id); state.comparison = null; if (action === 'source') activeGroup().active = control.dataset.kind === 'table' || activeGroup().views[control.dataset.kind] ? control.dataset.kind : 'table'; state.panel = null }
    if (action === 'view' && group) { group.active = control.dataset.kind; state.comparison = null; state.panel = null }
    if (action === 'comparison') { state.comparison = Number(control.dataset.id); state.panel = null }
    if (action === 'results' || action === 'messages') state.output = action
    if (action === 'profile') { state.profile = !state.profile; state.sideFront = 'profile'; keepScroll = true }
    if (action === 'row-size') { state.rowSize = !state.rowSize; keepScroll = true }
    if (action === 'side-profile') { state.sideFront = 'profile'; keepScroll = true }
    if (action === 'side-builder') { state.sideFront = 'builder'; keepScroll = true }
    if (action === 'actions') state.menu = state.menu === 'actions' ? null : 'actions'
    if (action === 'close-menu') state.menu = null
    if (action === 'pivot' && group && !comparison && ['table', 'pivot'].includes(group.active) && runReady()) {
      const existing = group.views.pivot
      state.panel = { kind: 'pivot', group: existing?.group ?? columns()[0].name, aggregate: existing?.aggregate ?? 'Count', column: existing?.column ?? '(Rows)' }; state.sideFront = 'builder'; keepScroll = true
    }
    if (action === 'build-pivot' && group && state.panel?.kind === 'pivot' && runReady()) {
      group.views.pivot = { ...state.panel, filter: group.filter === null ? null : [...group.filter], columnGroup: '(None)' }; group.active = 'pivot'; state.panel = null; state.selection = { row: 0, col: 0 }; state.notice = 'Pivot updated from the original table. Comparison snapshots are kept.'
    }
    if (action === 'transpose' && group && group.active === 'table' && !comparison && runReady()) {
      group.views.transpose = { filter: group.filter === null ? null : [...group.filter] }; group.active = 'transpose'; state.panel = null; state.selection = { row: 0, col: 0 }
    }
    if (action === 'compare' && group && !comparison && runReady()) { state.panel = { kind: 'compare', target: candidates()[0]?.id }; state.sideFront = 'builder'; keepScroll = true }
    if (action === 'build-comparison' && group && state.panel?.kind === 'compare' && runReady()) {
      const target = candidates().find(item => item.id === state.panel.target) ?? candidates()[0]
      if (target && state.comparisons.length < 8) {
        const id = Math.max(0, ...state.comparisons.map(item => item.id)) + 1
        state.comparisons.push({ id, label: `Comparison ${id}`, kind: group.active, left: group.id, right: target.id, leftRecipe: { ...(group.active === 'table' ? { filter: group.filter } : group.views[group.active]) }, rightRecipe: { ...(group.active === 'table' ? { filter: target.filter } : target.views[group.active]) } }); state.comparison = id; state.panel = null; state.notice = 'Comparison snapshot created from both inputs.'
      }
    }
    if (action === 'close-panel') { state.panel = null; keepScroll = true }
    if (action === 'close-group' && canCloseResults()) { const id = Number(control.dataset.id); state.groups = state.groups.filter(item => item.id !== id); state.panel = null; state.notice = `Result ${id} and its views closed. Comparison snapshots are kept.` }
    if (action === 'close-view') { const target = state.groups.find(item => item.id === Number(control.dataset.id)); if (target) { delete target.views[control.dataset.kind]; if (target.active === control.dataset.kind) target.active = 'table' }; state.panel = null; state.notice = `${viewNames[control.dataset.kind]} closed. The original table is kept.` }
    if (action === 'close-comparison') { state.comparisons = state.comparisons.filter(item => item.id !== Number(control.dataset.id)); state.notice = 'Comparison closed. Both inputs are kept.' }
    if (action === 'close-all' && canCloseResults()) { state.groups = []; state.comparisons = []; state.profile = false; state.panel = null; state.notice = '' }
    if (action === 'filter' && group && group.active === 'table') { state.menu = state.menu === 'filter' ? null : 'filter'; state.filterDraft = group.filter ?? [...new Set(baseData(group.id).rows.map(row => row[0] === null ? 'NULL' : String(row[0])))].slice(0, 10) }
    if (action === 'filter-only-eight') state.filterDraft = [config.data === 'Screenshot example' ? '8' : String(baseData(group.id).rows[0][0])]
    if (action === 'apply-filter' && group) { group.filter = [...(state.filterDraft ?? [])]; state.filterDraft = null; state.menu = null; state.selection = { row: 0, col: 0 }; state.notice = 'Filter applied to Table. Existing Pivot and Transpose views keep the rows they were built from.' }
    if (action === 'clear-filter' && group) group.filter = null
    if (action === 'sort-column' && group && group.active === 'table') { const col = Number(control.dataset.col); group.sortDirection = group.sortColumn === col ? -group.sortDirection : 1; group.sortColumn = col }
    if (action === 'whitespace') { state.whitespace = control.dataset.value; keepScroll = true }
    if (action === 'sort-text') { state.sortText = control.dataset.value; keepScroll = true }
    if (action === 'search-mode') { state.searchMode = state.searchMode === 'Data' ? 'Columns' : 'Data'; state.match = 0; matches = searchMatches(); keepScroll = true }
    if (action === 'next-match' || action === 'previous-match') { moveMatch(action === 'next-match' ? 1 : -1); save(); return }
    if (action === 'save') state.notice = `Save Results As… targets ${activeName()}. File saving is not connected in this mock.`
    if (action === 'messages-strip') { state.messages = !state.messages; keepScroll = true }
    if (action === 'dismiss') { state.notice = ''; keepScroll = true }
    normalize(); matches = searchMatches(); render(!keepScroll)
    if (action === 'pivot' || action === 'compare') app.querySelector('.vg-side[data-front="true"] select')?.focus({ preventScroll: true })
    else if (['close-view', 'close-group', 'close-comparison'].includes(action)) app.querySelector('.vg-view button[aria-selected="true"], .vg-group button[aria-selected="true"]')?.focus({ preventScroll: true })
    else app.querySelector(`button[data-action="${action}"]`)?.focus({ preventScroll: true })
    save()
  })
  app.addEventListener('change', event => {
    const field = event.target.dataset.field, value = event.target.value
    if (event.target.dataset.filterValue !== undefined) {
      const selected = new Set(state.filterDraft ?? []), item = event.target.dataset.filterValue
      if (event.target.checked) selected.add(item); else selected.delete(item)
      state.filterDraft = [...selected]; return
    }
    if (field === 'navigate') { const [id, kind] = value.split(':'); if (id === 'c') state.comparison = Number(kind); else { state.activeGroup = Number(id); activeGroup().active = kind; state.comparison = null }; state.panel = null }
    if (field === 'pivot-group' && state.panel?.kind === 'pivot') state.panel.group = value
    if (field === 'pivot-aggregate' && state.panel?.kind === 'pivot') { state.panel.aggregate = value; if (value !== 'Count' && state.panel.column === '(Rows)') state.panel.column = columns().find(column => ['high', 'Total', 'OrderId'].includes(column.name))?.name ?? columns()[0].name }
    if (field === 'pivot-column' && state.panel?.kind === 'pivot') state.panel.column = value
    if (field === 'compare-target' && state.panel?.kind === 'compare') state.panel.target = Number(value)
    render(field === 'navigate'); app.querySelector(`[data-field="${field}"]`)?.focus({ preventScroll: true }); save()
  })
  app.addEventListener('input', event => {
    if (event.target.dataset.field !== 'search') return
    state.search = event.target.value; state.match = 0; matches = searchMatches(); paintGrid()
    const count = app.querySelector('.vg-search-count'); if (count) count.textContent = state.search ? `${matches.length ? 1 : 0}/${matches.length}${matches.length >= 500 ? '+' : ''}` : ''
    save()
  })
  app.addEventListener('keydown', event => {
    if (event.key === 'Escape') { if (state.menu || state.panel) { state.menu = null; state.panel = null; render(false) }; return }
    if (event.target.dataset.field === 'search' && event.key === 'Enter') { event.preventDefault(); moveMatch(event.shiftKey ? -1 : 1); save() }
  })
  app.addEventListener('contextmenu', event => {
    if (!event.target.closest('.vg-scroller')) return
    event.preventDefault(); state.menu = 'actions'; render(false)
  })
  window.addEventListener('openai:set_globals', event => {
    const next = event.detail?.globals?.widgetState
    if (next?.privateContent?.version !== 2 || JSON.stringify(next.privateContent) === lastPrivate) return
    restore(next); dataCache.clear(); normalize(); matches = searchMatches(); render()
  })
  render()
  let lastWidth = app.clientWidth
  const resize = new ResizeObserver(() => {
    if (app.clientWidth !== lastWidth) { lastWidth = app.clientWidth; render(false) }
  })
  resize.observe(app)
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: app, onChange: () => {
      const settings = JSON.stringify({ data: config.data, count: config.resultCount, runState: config.runState })
      if (settings !== lastSettings) {
        dataCache.clear(); state = fresh()
        if (config.data === 'Order data') state.groups.forEach(group => { group.views.pivot = { filter: null, group: 'Region', aggregate: 'Sum', column: 'Total', columnGroup: '(None)' } })
        if (config.runState === 'Empty') { state.groups = []; state.profile = false }
        lastSettings = settings
      }
      normalize(); matches = searchMatches(); render(false); save()
    } })
    tweak.addSelect(config, 'appearance', { label: 'Appearance', options: ['System', 'Dark', 'Light'] })
    tweak.addSlider(config, 'paneHeight', { label: 'Results pane height', min: 360, max: 680, step: 20, unit: 'px' })
    tweak.addSlider(config, 'rowHeight', { label: 'Grid row height', min: 20, max: 28, step: 2, unit: 'px' })
    tweak.addSelect(config, 'actions', { label: 'Result actions', options: ['Labeled buttons', 'Actions menu'] })
    tweak.addSelect(config, 'data', { label: 'Example data', options: ['Screenshot example', 'Order data'] })
    tweak.addSelect(config, 'resultCount', { label: 'Original result count', options: ['2', '6', '12'] })
    tweak.addSelect(config, 'runState', { label: 'Query state', options: ['Completed', 'Running', 'Empty', 'Backend lost'] })
    tweak.addToggle(config, 'showCounts', { label: 'Row counts on result tabs' })
  }
})()
