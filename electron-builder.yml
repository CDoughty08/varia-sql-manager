appId: com.varia.sqlmanager
productName: Varia SQL Manager
afterPack: build/after-pack.cjs
beforePack: build/sqltools-service-check.cjs
directories:
  output: dist
files:
  - out/**/*
extraResources:
  - from: artifacts/release-backend
    to: backend
artifactName: Varia-SQL-Manager-${version}-${os}-${arch}.${ext}
win:
  # zip: the application as an archive, which an installed copy unpacks beside itself to update (docs/updates.md).
  target: [nsis, portable, zip]
  extraResources:
    - from: artifacts/sqltools-service/win-${arch}
      to: sqltools-service
    # The update helper (backend/Varia.Updater, published by package.yml): it stages and swaps in a release.
    - from: artifacts/updater
      to: updater
      filter: ['Varia.Updater.exe']
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  artifactName: Varia-SQL-Manager-${version}-Windows-x64-Setup.${ext}
portable:
  artifactName: Varia-SQL-Manager-${version}-Windows-x64-Portable.${ext}
mac:
  target: [dmg, zip]
  identity: null
  extraResources:
    - from: artifacts/sqltools-service/osx-${arch}
      to: sqltools-service
linux:
  target: AppImage
  extraResources:
    - from: artifacts/sqltools-service/linux-${arch}
      to: sqltools-service
  category: Development
  # electron-builder's default desktop entry runs AppRun --no-sandbox; main refuses to run without the sandbox.
  executableArgs: []
