name: CI

on:
  # Any base branch, so pull requests stacked on another open pull request are tested too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regression-suite:
        description: Focused Electron regressions (none runs the full CI suite)
        type: choice
        options: [none, dialogs, results, all]
        default: none

concurrency:
  # A new push supersedes a pull request's earlier run; every main commit and manual run gets its own complete run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  linux:
    name: Linux (live SQL Server, Electron smoke)
    if: github.event_name != 'workflow_dispatch' || inputs.regression-suite == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # A fixed development password is fine here: the container is created for this job, holds no data, and is discarded with the runner.
          MSSQL_SA_PASSWORD: 'Varia_Dev_Pw1!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
      # Live tests may create and drop a uniquely named scratch database (graph tables cannot be temporary).
      VARIA_TEST_SQL_SCRATCH: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci
      - name: Type check, .NET checks (offline and live), vitest, production build
        run: npm run check
      - name: Integrated authentication without a Kerberos ticket
        # Linux connects with integrated authentication through GSSAPI (SqlClient's managed SNI). With no ticket, the backend
        # must say to run kinit (AUTH_KERBEROS) with the failure's details, not refuse the mode or show SqlClient's bare
        # "Cannot generate SSPI context.". The cache named here never exists; the suite fails rather than skips if it cannot run.
        env:
          KRB5CCNAME: FILE:/tmp/varia-no-kerberos-ticket
          VARIA_TEST_KERBEROS_NO_TICKET: '1'
        run: |
          dpkg -s libgssapi-krb5-2 > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libgssapi-krb5-2; }
          npx vitest run tests/kerberos-live.test.ts
      - name: Prepare the Electron sandbox and display
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Chromium's sandbox needs them because
        # npm's chrome-sandbox helper is not setuid root. The smoke tests launch with chromiumSandbox (scripts/*-smoke.mjs),
        # so the runner user gets the real sandbox instead of Playwright's Linux default of --no-sandbox.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Electron smoke tests
        timeout-minutes: 25
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:smoke
      - name: Scripting smoke test on a 1024x768 display
        # Windows runners have a 1024x768 display, and Script As dialogs and nested submenus must fit it everywhere.
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1024x768x24" node scripts/scripting-smoke.mjs
      - name: IPC benchmarks
        # The IPC and results grid benchmarks. Floors (tests/bench/floors.json) are enforced here only; the table goes to
        # the job summary.
        timeout-minutes: 15
        run: |
          npm run bench
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run bench:e2e -- --live
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run bench:grid -- --live
          node scripts/check-bench.mjs --enforce
      - name: Results grid smoke test on a 1024x768 display
        # Windows runners have a 1024x768 display; the grid, its strips and the toolbar must work and fit there too.
        timeout-minutes: 8
        run: xvfb-run -a -s "-screen 0 1024x768x24" node scripts/results-smoke.mjs
      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-linux
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload IPC benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux
          path: artifacts/bench/
          if-no-files-found: ignore
          retention-days: 30

  desktop:
    name: ${{ matrix.os }}
    # Windows minutes bill at 2x and macOS at 10x, so draft pull requests run only the Linux job.
    if: (github.event_name != 'workflow_dispatch' || inputs.regression-suite == 'none') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci
      - name: Type check, offline .NET checks, vitest, production build
        run: npm run check
      - name: Electron smoke tests
        # The smoke suites assert Windows/Linux window chrome (controls overlay, hidden menu bar, Ctrl shortcuts), so on
        # macOS they fail at the first check; they run there once its native menu bar and Cmd shortcuts are covered.
        if: runner.os != 'macOS'
        timeout-minutes: 20
        run: npm run test:smoke
      - name: IPC benchmarks (report only)
        # The IPC and results grid benchmarks. Shared Windows and macOS runners vary too much for floors; the end-to-end
        # runs follow the smoke tests' platforms.
        timeout-minutes: 15
        shell: bash
        run: |
          npm run bench
          if [ "$RUNNER_OS" != macOS ]; then npm run bench:e2e; npm run bench:grid; fi
          node scripts/check-bench.mjs
      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload IPC benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: artifacts/bench/
          if-no-files-found: ignore
          retention-days: 30

  regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.regression-suite != 'none'
    uses: ./.github/workflows/ci-regressions.yml
    with:
      suite: ${{ inputs.regression-suite }}
