name: CI

on:
  # Any base branch, so pull requests stacked on another open pull request are tested too.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regression-suite:
        description: Suite (none runs full CI; docs runs documentation; all runs Electron suites)
        type: choice
        options: [none, docs, dialogs, results, tail, all, activity]
        default: none

concurrency:
  # Every main push runs full CI, so a newer push can safely replace the earlier run, even after a docs-only merge.
  # PR updates also supersede their earlier runs; manual runs have unique groups.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

# After the scope check, every validation job starts at once and builds what it needs itself: the checks, the live SQL Server checks, the smoke shards and
# the benchmarks run side by side, so a failure in one hides nothing in the others and the run takes as long as its
# longest job. Every code-changing pull request runs every platform, drafts included: the repository is public, so runners cost nothing.
# What a public repository does pay in is concurrency (20 jobs at once across the account, 5 of them macOS). A code-changing PR
# runs 14 jobs: 12 validation jobs plus scope and result. Three smoke shards per platform and two live jobs (the second running
# groups 2/3 and 3/3 concurrently against two SQL containers) keep every job within budget while freeing runner slots; no job repeats
# another's work. Report-only work stays off pull requests: Linux's 1024x768 repeats of suites the
# Windows shards already run at that size run on main only, and the desktop benchmarks run daily (bench-desktop.yml).
# Scope detection and the final required result add two short Linux jobs.
# docs/ci.md measures all of this and holds the rules.
jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          sparse-checkout: scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - name: Classify the complete change
        id: scope
        timeout-minutes: 1
        env:
          REGRESSION_SUITE: ${{ inputs.regression-suite }}
        run: node scripts/ci-scope.mjs

  docs:
    name: Documentation checks
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Keep all source-only tests, including generated docs, README and published changelog validation.
      # These need neither Electron's binary nor a .NET build or SQL Server.
      - name: Validate documentation and source contracts
        timeout-minutes: 5
        run: npx vitest run --exclude tests/backend-sidecar.test.ts --exclude 'tests/*-live.test.ts'

  check:
    name: Check (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check, offline .NET checks, vitest, production build
        id: check
        timeout-minutes: 20
        # tsc and electron-vite build are OS-independent (Linux's case-sensitive paths are strictest; Smoke and Release also
        # build on Windows/macOS). VARIA_CHECK_SCOPE=os runs every OS, main-process, FS, process, ICU and sidecar check on
        # Windows and macOS while avoiding repeating pure JS/React/docs-lint and pure in-memory managed .NET suites that Linux
        # already proved on the same commit.
        env:
          VARIA_CHECK_SKIP: ${{ matrix.os != 'ubuntu-24.04' && 'typecheck,build' || '' }}
          VARIA_CHECK_SCOPE: ${{ matrix.os != 'ubuntu-24.04' && 'os' || '' }}
        run: npm run check

  live:
    name: Live SQL Server checks (Linux ${{ matrix.slot == 1 && '1/3' || '2-3/3' }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # LiveGroups.cs splits the live .NET suites into 3 balanced groups (LiveGroups.CiGroups), each against a SQL Server
        # container of its own. Slot 1 runs group 1/3 plus the Node/language/BigQuery/Kerberos live checks; slot 2 builds once
        # and runs groups 2/3 and 3/3 side by side against two SQL containers (ports 1433 and 1434), removing a full job slot.
        slot: [1, 2]
    runs-on: ubuntu-24.04
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 60
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      # A fixed development password is fine here: the container is created for this job, holds no data, and is discarded with the runner.
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
      # Live tests may create and drop a uniquely named scratch database (graph tables cannot be temporary).
      VARIA_TEST_SQL_SCRATCH: '1'
      # Only this disposable container records New Login's and Create Catalog's batches in an Extended Events session, to prove
      # neither password reaches any recorded field (wave 5 decision 14); a developer's server runs it only when its owner asks.
      VARIA_TEST_SQL_XE: '1'
      # The Agent live suites require SQL Server Agent and fail if it never comes up.
      VARIA_TEST_SQL_AGENT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start SQL Server container(s) in the background
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.slot }}" = "1" ]; then
            node scripts/ci-docker.mjs start-sql --name varia-sql --port 1433 --agent --detach
            node scripts/ci-docker.mjs start-bigquery --detach
          else
            node scripts/ci-docker.mjs start-sql --name varia-sql-2 --port 1433 --name varia-sql-3 --port 1434 --agent --memory-mb 3072 --detach
          fi
      # Only slot 1 runs node (live vitest, bundled SQL Tools Service and Kerberos); slot 2 runs only dotnet.
      - uses: actions/setup-node@v7
        if: matrix.slot == 1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
        if: matrix.slot == 1
      - name: Build the Release backend tests
        timeout-minutes: 5
        run: dotnet build backend/Varia.Backend.Tests/Varia.Backend.Tests.csproj --configuration Release --nologo -v q
      - name: Wait for SQL Server container(s)
        timeout-minutes: 4
        run: |
          if [ "${{ matrix.slot }}" = "1" ]; then
            node scripts/ci-docker.mjs wait-sql --name varia-sql
          else
            node scripts/ci-docker.mjs wait-sql --name varia-sql-2 --name varia-sql-3
          fi
      - name: Live .NET checks against SQL Server
        id: test
        timeout-minutes: 20
        run: |
          if [ "${{ matrix.slot }}" = "1" ]; then
            dotnet run --no-build --project backend/Varia.Backend.Tests/Varia.Backend.Tests.csproj --configuration Release -- --live-group 1/3
          else
            node scripts/ci-live-pair.mjs 2/3@1433 3/3@1434
          fi
      - name: Live vitest suites against SQL Server
        # Only the vitest files that use SQL Server (tests/*-live.test.ts); Check runs the others. After a failed group too:
        # the Release backend they start was built either way.
        if: matrix.slot == 1 && (success() || failure())
        timeout-minutes: 5
        run: npx vitest run tests/*-live.test.ts
      - name: Bundled SQL language service against SQL Server
        # Runs after other checks fail too, provided their Release build exists; the SQL container is disposable.
        if: matrix.slot == 1 && (success() || failure()) && hashFiles('backend/Varia.Backend.Tests/bin/Release/net11.0/Varia.Backend.Tests.dll') != ''
        timeout-minutes: 5
        run: |
          node scripts/prepare-sqltools-service.mjs --rid linux-x64
          dotnet run --no-build --project backend/Varia.Backend.Tests/Varia.Backend.Tests.csproj --configuration Release -- --sql-language-live
      - name: BigQuery against its emulator
        # BigQuery in emulator mode against goccy/bigquery-emulator 0.8.1, pinned by digest (docs/bigquery.md, Testing):
        # anonymous credentials, so no Google project or credential is ever involved. Its gRPC port (9060) serves the Storage
        # Read checks. The checks wait for it to answer. Runs after other checks fail too, provided their Release build exists.
        if: matrix.slot == 1 && (success() || failure()) && hashFiles('backend/Varia.Backend.Tests/bin/Release/net11.0/Varia.Backend.Tests.dll') != ''
        timeout-minutes: 5
        env:
          VARIA_TEST_BIGQUERY_ENDPOINT: http://localhost:9050
          VARIA_TEST_BIGQUERY_STORAGE_ENDPOINT: http://localhost:9060
        run: |
          node scripts/ci-docker.mjs wait-bigquery
          dotnet run --no-build --project backend/Varia.Backend.Tests/Varia.Backend.Tests.csproj --configuration Release -- --bigquery-emulator-live
      - name: Integrated authentication without a Kerberos ticket
        # Linux connects with integrated authentication through GSSAPI (SqlClient's managed SNI). With no ticket, the backend
        # must say to run kinit (AUTH_KERBEROS) with the failure's details, not refuse the mode or show SqlClient's bare
        # "Cannot generate SSPI context.". The cache named here never exists; the suite fails rather than skips if it cannot run.
        # It runs after a failed check too: the Release backend it starts was built either way.
        if: matrix.slot == 1 && (success() || failure())
        timeout-minutes: 5
        env:
          KRB5CCNAME: FILE:/tmp/varia-no-kerberos-ticket
          VARIA_TEST_KERBEROS_NO_TICKET: '1'
        run: |
          dpkg -s libgssapi-krb5-2 > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libgssapi-krb5-2; }
          npx vitest run tests/kerberos-live.test.ts

  smoke-linux:
    name: Smoke (Linux ${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # scripts/smoke-shards.mjs splits test:smoke by each platform's measured times; the count here is the one in its command
        # below, and tests/ci-workflow.test.ts keeps every shard within its budget.
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 75
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
      VARIA_TEST_SQL_SCRATCH: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start SQL Server container in the background
        timeout-minutes: 5
        run: node scripts/ci-docker.mjs start-sql --name varia-sql --port 1433 --agent --detach
      - name: Start the BigQuery emulator
        # The connections suite's BigQuery phase drives the Connect dialog against the emulator BQ-1 pins by digest (anonymous
        # credentials, never a Google project). Start it detached only in the shard that runs connections-smoke.mjs, so its
        # pull overlaps setup and builds.
        id: bigquery
        timeout-minutes: 3
        run: |
          if node scripts/smoke-shards.mjs --has-suite scripts/connections-smoke.mjs ${{ matrix.shard }}/3; then
            node scripts/ci-docker.mjs start-bigquery --detach
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the Release backend
        id: build
        timeout-minutes: 10
        env:
          # Only shard 3 runs language-services-live-smoke.mjs; the other shards do not launch the bundled SQL Tools Service.
          VARIA_CHECK_SKIP: ${{ matrix.shard != 3 && 'sqltools' || '' }}
        run: npm run build:smoke
      - name: Prepare the Electron sandbox and display
        id: display
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Chromium's sandbox needs them because
        # npm's chrome-sandbox helper is not setuid root. The smoke tests launch with chromiumSandbox (scripts/*-smoke.mjs),
        # so the runner user gets the real sandbox instead of Playwright's Linux default of --no-sandbox.
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Wait for SQL Server container
        timeout-minutes: 4
        run: |
          node scripts/ci-docker.mjs wait-sql --name varia-sql
          node scripts/ci-docker.mjs wait-bigquery
      - name: Electron smoke tests
        timeout-minutes: 25
        env:
          VARIA_TEST_BIGQUERY_ENDPOINT: http://localhost:9050
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/smoke-shards.mjs ${{ matrix.shard }}/3
      - name: Live SQL language widgets and window focus
        if: matrix.shard == 3 && (success() || failure()) && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/language-services-live-smoke.mjs
      - name: Scripting smoke test on a 1024x768 display
        # Windows runners have a 1024x768 display, and Script As dialogs and nested submenus must fit it everywhere. The Windows
        # shards run this suite at that size on every pull request, so Linux repeats it on main only. After a smoke failure
        # too, so one run reports both.
        if: matrix.shard == 2 && github.event_name == 'push' && (success() || failure()) && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1024x768x24" node scripts/scripting-smoke.mjs
      - name: Results grid smoke test on a 1024x768 display
        # Windows runners have a 1024x768 display; the grid, its strips and the toolbar must work and fit there too (on main
        # only, as above).
        if: matrix.shard == 2 && github.event_name == 'push' && (success() || failure()) && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        timeout-minutes: 8
        run: xvfb-run -a -s "-screen 0 1024x768x24" node scripts/results-smoke.mjs
      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-linux-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  smoke-windows:
    name: Smoke (Windows ${{ matrix.shard }}/3)
    # The smoke suites assert Windows/Linux window chrome (controls overlay, hidden menu bar, Ctrl shortcuts), so on macOS
    # they fail at the first check; they run there once its native menu bar and Cmd shortcuts are covered.
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the Release backend
        id: build
        timeout-minutes: 10
        env:
          VARIA_CHECK_SKIP: sqltools
        run: npm run build:smoke
      - name: Electron smoke tests
        timeout-minutes: 25
        run: node scripts/smoke-shards.mjs ${{ matrix.shard }}/3
      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-windows-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  bench-linux:
    name: Benchmarks (Linux)
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 50
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start SQL Server container in the background
        timeout-minutes: 5
        run: node scripts/ci-docker.mjs start-sql --name varia-sql --port 1433 --detach
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the Release backend
        id: build
        timeout-minutes: 10
        env:
          VARIA_CHECK_SKIP: sqltools
        run: npm run build:smoke
      - name: Prepare the Electron sandbox and display
        id: display
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Publish the ReadyToRun backend
        # As package.yml publishes it for a release, so the node bench can check it is precompiled and time its start.
        timeout-minutes: 5
        run: dotnet publish backend/Varia.Backend/Varia.Backend.csproj -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o artifacts/bench-backend
      - name: Wait for SQL Server container
        timeout-minutes: 4
        run: node scripts/ci-docker.mjs wait-sql --name varia-sql
      - name: IPC benchmarks
        # Floors are enforced on Linux only; the table goes to the job summary.
        timeout-minutes: 15
        env:
          VARIA_BENCH_BACKEND: artifacts/bench-backend/Varia.Backend
        run: |
          npm run bench
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run bench:e2e -- --live
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run bench:grid -- --live
          node scripts/check-bench.mjs --enforce
      - name: Upload IPC benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux
          path: artifacts/bench/
          if-no-files-found: ignore
          retention-days: 30

  regressions:
    needs: scope
    if: needs.scope.outputs.mode == 'regressions'
    uses: ./.github/workflows/ci-regressions.yml
    with:
      suite: ${{ inputs.regression-suite }}

  result:
    # Manual partial suites must never share the required PR check's name.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI result' || 'CI result' }}
    if: always()
    needs: [scope, docs, check, live, smoke-linux, smoke-windows, bench-linux, regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-result.mjs
          sparse-checkout-cone-mode: false
      - name: Require every selected job to pass
        timeout-minutes: 1
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
