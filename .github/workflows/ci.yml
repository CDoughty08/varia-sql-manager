name: CI

on:
  # Any base branch, so pull requests stacked on another open pull request are tested too.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regression-suite:
        description: Focused regressions (none runs full CI; all runs Electron suites)
        type: choice
        options: [none, dialogs, results, tail, all, activity]
        default: none

concurrency:
  # A new push supersedes the earlier run of its pull request, or of main: each pull request already tested its merge with main,
  # and main pushes often come minutes apart (30 of 73 within 20 minutes), so a superseded main run mostly repeats that work.
  # The newest main commit always gets a complete run. Manual runs are never cancelled.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

# After the scope check, every validation job starts at once and builds what it needs itself: the checks, the live SQL Server checks, the smoke shards and
# the benchmarks run side by side, so a failure in one hides nothing in the others and the run takes as long as its
# longest job. Every code-changing pull request runs every platform, drafts included: the repository is public, so runners cost nothing.
# What a public repository does pay in is concurrency (20 jobs at once across the account, 5 of them macOS), so a pull request
# runs 13 jobs: a third Windows smoke shard keeps language-service coverage within the per-shard time budget; no job repeats
# another's work. Report-only work stays off pull requests: Linux's 1024x768 repeats of suites the
# Windows shards already run at that size run on main only, and the desktop benchmarks run daily (bench-desktop.yml).
# Scope detection and the final required result add two short Linux jobs.
# docs/ci.md measures all of this and holds the rules.
jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify the complete change
        id: scope
        timeout-minutes: 1
        env:
          REGRESSION_SUITE: ${{ inputs.regression-suite }}
        run: node scripts/ci-scope.mjs

  docs:
    name: Documentation checks
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Keep all source-only tests, including generated docs, README and published changelog validation.
      # These need neither Electron's binary nor a .NET build or SQL Server.
      - name: Validate documentation and source contracts
        timeout-minutes: 5
        run: npx vitest run --exclude tests/backend-sidecar.test.ts --exclude 'tests/*-live.test.ts'

  check:
    name: Check (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check, offline .NET checks, vitest, production build
        id: check
        timeout-minutes: 20
        # tsc reads only sources and installed types, the same everywhere; Linux's case-sensitive paths make its run the strictest.
        env:
          VARIA_CHECK_SKIP: ${{ matrix.os != 'ubuntu-24.04' && 'typecheck' || '' }}
        run: npm run check

  live:
    name: Live SQL Server checks (Linux ${{ matrix.group }}/3)
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # LiveGroups.cs splits the live .NET suites by measured time, each group against a server of its own; the count here
        # is LiveGroups.CiGroups. Check (ubuntu) runs the offline .NET checks and the rest of vitest.
        group: [1, 2, 3]
    runs-on: ubuntu-24.04
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 40
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # A fixed development password is fine here: the container is created for this job, holds no data, and is discarded with the runner.
          MSSQL_SA_PASSWORD: 'Varia_Dev_Pw1!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
      # Live tests may create and drop a uniquely named scratch database (graph tables cannot be temporary).
      VARIA_TEST_SQL_SCRATCH: '1'
      # Only this disposable container records New Login's and Create Catalog's batches in an Extended Events session, to prove
      # neither password reaches any recorded field (wave 5 decision 14); a developer's server runs it only when its owner asks.
      VARIA_TEST_SQL_XE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only group 1 runs node (live vitest, bundled SQL Tools Service and Kerberos); the others run only dotnet.
      - uses: actions/setup-node@v7
        if: matrix.group == 1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
        if: matrix.group == 1
      - name: Live .NET checks against SQL Server
        id: test
        # All the live .NET suites took 11 minutes in one job on PR #96's run; each group prints its suites' times.
        timeout-minutes: 20
        run: dotnet run --project backend/Varia.Backend.Tests/Varia.Backend.Tests.csproj --configuration Release -- --live-group ${{ matrix.group }}/3
      - name: Live vitest suites against SQL Server
        # Only the vitest files that use SQL Server (tests/*-live.test.ts); Check runs the others. After a failed group too:
        # the Release backend they start was built either way.
        if: matrix.group == 1 && (success() || failure())
        timeout-minutes: 5
        run: npx vitest run tests/*-live.test.ts
      - name: Bundled SQL language service against SQL Server
        # Runs after other checks fail too, provided their Release build exists; the SQL container is disposable.
        if: matrix.group == 1 && (success() || failure()) && hashFiles('backend/Varia.Backend.Tests/bin/Release/net10.0/Varia.Backend.Tests.dll') != ''
        timeout-minutes: 5
        run: |
          node scripts/prepare-sqltools-service.mjs --rid linux-x64
          dotnet run --no-build --project backend/Varia.Backend.Tests/Varia.Backend.Tests.csproj --configuration Release -- --sql-language-live
      - name: Integrated authentication without a Kerberos ticket
        # Linux connects with integrated authentication through GSSAPI (SqlClient's managed SNI). With no ticket, the backend
        # must say to run kinit (AUTH_KERBEROS) with the failure's details, not refuse the mode or show SqlClient's bare
        # "Cannot generate SSPI context.". The cache named here never exists; the suite fails rather than skips if it cannot run.
        # It runs after a failed check too: the Release backend it starts was built either way.
        if: matrix.group == 1 && (success() || failure())
        timeout-minutes: 5
        env:
          KRB5CCNAME: FILE:/tmp/varia-no-kerberos-ticket
          VARIA_TEST_KERBEROS_NO_TICKET: '1'
        run: |
          dpkg -s libgssapi-krb5-2 > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libgssapi-krb5-2; }
          npx vitest run tests/kerberos-live.test.ts

  smoke-linux:
    name: Smoke (Linux ${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # scripts/smoke-shards.mjs splits test:smoke by each platform's measured times; the count here is the one in its command
        # below, and tests/ci-workflow.test.ts keeps every shard within its budget.
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 60
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Varia_Dev_Pw1!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
      VARIA_TEST_SQL_SCRATCH: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the Release backend
        id: build
        timeout-minutes: 10
        run: npm run build:smoke
      - name: Prepare the Electron sandbox and display
        id: display
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Chromium's sandbox needs them because
        # npm's chrome-sandbox helper is not setuid root. The smoke tests launch with chromiumSandbox (scripts/*-smoke.mjs),
        # so the runner user gets the real sandbox instead of Playwright's Linux default of --no-sandbox.
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Electron smoke tests
        timeout-minutes: 25
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/smoke-shards.mjs ${{ matrix.shard }}/3
      - name: Live SQL language widgets and window focus
        if: matrix.shard == 3 && (success() || failure()) && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/language-services-live-smoke.mjs
      - name: Scripting smoke test on a 1024x768 display
        # Windows runners have a 1024x768 display, and Script As dialogs and nested submenus must fit it everywhere. The Windows
        # shards run this suite at that size on every pull request, so Linux repeats it on main only. After a smoke failure
        # too, so one run reports both.
        if: matrix.shard == 2 && github.event_name == 'push' && (success() || failure()) && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1024x768x24" node scripts/scripting-smoke.mjs
      - name: Results grid smoke test on a 1024x768 display
        # Windows runners have a 1024x768 display; the grid, its strips and the toolbar must work and fit there too (on main
        # only, as above).
        if: matrix.shard == 2 && github.event_name == 'push' && (success() || failure()) && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        timeout-minutes: 8
        run: xvfb-run -a -s "-screen 0 1024x768x24" node scripts/results-smoke.mjs
      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-linux-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  smoke-windows:
    name: Smoke (Windows ${{ matrix.shard }}/3)
    # The smoke suites assert Windows/Linux window chrome (controls overlay, hidden menu bar, Ctrl shortcuts), so on macOS
    # they fail at the first check; they run there once its native menu bar and Cmd shortcuts are covered.
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the Release backend
        id: build
        timeout-minutes: 10
        run: npm run build:smoke
      - name: Electron smoke tests
        timeout-minutes: 25
        run: node scripts/smoke-shards.mjs ${{ matrix.shard }}/3
      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-windows-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  bench-linux:
    name: Benchmarks (Linux)
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    # Room for every timed step below (tests/ci-workflow.test.ts) plus the setup before them.
    timeout-minutes: 40
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Varia_Dev_Pw1!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the Release backend
        id: build
        timeout-minutes: 10
        run: npm run build:smoke
      - name: Prepare the Electron sandbox and display
        id: display
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Publish the ReadyToRun backend
        # As package.yml publishes it for a release, so the node bench can check it is precompiled and time its start.
        timeout-minutes: 5
        run: dotnet publish backend/Varia.Backend/Varia.Backend.csproj -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o artifacts/bench-backend
      - name: IPC benchmarks
        # Floors are enforced on Linux only; the table goes to the job summary.
        timeout-minutes: 15
        env:
          VARIA_BENCH_BACKEND: artifacts/bench-backend/Varia.Backend
        run: |
          npm run bench
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run bench:e2e -- --live
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run bench:grid -- --live
          node scripts/check-bench.mjs --enforce
      - name: Upload IPC benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux
          path: artifacts/bench/
          if-no-files-found: ignore
          retention-days: 30

  regressions:
    needs: scope
    if: needs.scope.outputs.mode == 'regressions'
    uses: ./.github/workflows/ci-regressions.yml
    with:
      suite: ${{ inputs.regression-suite }}

  result:
    name: CI result
    if: always()
    needs: [scope, docs, check, live, smoke-linux, smoke-windows, bench-linux, regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every selected job to pass
        timeout-minutes: 1
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
