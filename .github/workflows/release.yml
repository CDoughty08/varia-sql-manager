name: Release builds

# Packaging (installers, the packaged and portable smoke tests, Electron fuses and asar integrity read back) is the slowest
# and most macOS-heavy work in CI: about 21 runner-minutes, 13 of them on the 5 macOS slots, for each push. It used to run on
# every pull request push, where it caught nothing CI did not, and its jobs queued every run behind the 20-job limit
# (docs/ci.md). It runs on main pushes except documentation-only changes, on tags and by hand, and
# on pull requests only when they change what packaging reads. Intel macOS, twice as slow as arm64 on a scarcer runner,
# packages for tags and manual runs, and once a week on main alone, so an x64-only break shows before a tag it would block.
# GitHub matches a pull request's paths against its first 3,000 changed files only, so a larger pull request (a big stacked
# branch, or a merge of main) can skip Release builds silently: run them by hand (workflow_dispatch) when it touches packaging.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/package.yml
      - electron-builder.yml
      - electron.vite.config.ts
      - build/**
      - package-lock.json
      - global.json
      - backend/Varia.Backend/Varia.Backend.csproj
      - backend/Varia.Updater/**
      - src/main/app-protocol.ts
      - src/main/backend/spawn-spec.ts
      - src/main/backend/sqltools-runtime.ts
      - src/main/update-install.ts
      - src/main/update-staging.ts
      - scripts/packaged-smoke.mjs
      - scripts/packaged-contents.mjs
      - scripts/prepare-sqltools-service.mjs
      - scripts/prepare-electron.mjs
      - scripts/portable-smoke.mjs
      - scripts/appimage-check.mjs
      - scripts/windows-installer-smoke.ps1
      - scripts/update-manifest.mjs
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  # A new push supersedes a pull request's or main's earlier packaging; tags and manual runs always finish.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Packaging scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify the complete main push
        id: scope
        timeout-minutes: 1
        run: node scripts/ci-scope.mjs

  build:
    name: Package ${{ matrix.rid }}
    # PRs, tags and manual runs skip scope; only main pushes can omit packaging for docs.
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.scope.result == 'skipped' || (needs.scope.result == 'success' && needs.scope.outputs.mode == 'full')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            target: --win nsis portable zip --x64
            executable: dist/win-unpacked/Varia SQL Manager.exe
            asset: |
              dist/*.exe
              dist/*.zip
          - runner: ubuntu-24.04
            rid: linux-x64
            target: --linux AppImage --x64
            executable: dist/linux-unpacked/varia-sql-manager
            asset: dist/*.AppImage
          - runner: macos-15
            rid: osx-arm64
            target: --mac dmg zip --arm64
            executable: dist/mac-arm64/Varia SQL Manager.app/Contents/MacOS/Varia SQL Manager
            asset: |
              dist/*.dmg
              dist/*.zip
    uses: ./.github/workflows/package.yml
    with:
      runner: ${{ matrix.runner }}
      rid: ${{ matrix.rid }}
      target: ${{ matrix.target }}
      executable: ${{ matrix.executable }}
      asset: ${{ matrix.asset }}

  build-intel:
    name: Package osx-x64
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    uses: ./.github/workflows/package.yml
    with:
      runner: macos-15-intel
      rid: osx-x64
      target: --mac dmg zip --x64
      executable: dist/mac/Varia SQL Manager.app/Contents/MacOS/Varia SQL Manager
      asset: |
        dist/*.dmg
        dist/*.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-intel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      # The update manifests (the one builds up to 0.7.0 read, and the current one): each file's size and SHA-512, which
      # Varia's updater checks before installing.
      - name: Write update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/update-manifest.mjs release-assets "$RELEASE_TAG"
      - name: Prepare curated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/release-notes.mjs "$RELEASE_TAG" release-notes.md
      - name: Create release with curated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
