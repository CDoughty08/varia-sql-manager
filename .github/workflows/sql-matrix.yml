name: SQL Server matrix

# The .NET checks (offline, live, and the Object Explorer and Script As scratch databases) against every SQL Server
# version that has a Linux image. Manual runs only, so it costs no scheduled minutes; ci.yml already covers SQL Server
# 2022 on every pull request. SQL Server 2016 has no Linux image: the offline checks render and lint its band, the
# target-130 goldens script for it, and the owner checks it in SSMS. Script As compares each case with
# tests/fixtures/scripting/golden/16, or with the overlay golden/14 (2017), 15 (2019) or 17 (2025) where that version
# scripts differently; "Rewrite script goldens" regenerates the varia goldens and uploads them for review.
on:
  workflow_dispatch:
    inputs:
      update-goldens:
        description: Rewrite script goldens (VARIA_UPDATE_SCRIPT_GOLDENS) and upload them
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  backend:
    name: SQL Server ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['2017', '2019', '2022', '2025']
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest
        env:
          ACCEPT_EULA: 'Y'
          # A fixed development password is fine here: the container is created for this job, holds no data, and is discarded with the runner.
          MSSQL_SA_PASSWORD: 'Varia_Dev_Pw1!'
        ports:
          - 1433:1433
        # The 2019 and later images ship mssql-tools18 (which needs -C for the self-signed certificate); 2017 ships only mssql-tools.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      VARIA_TEST_SQL_SERVER: localhost
      VARIA_TEST_SQL_USER: sa
      VARIA_TEST_SQL_PASSWORD: 'Varia_Dev_Pw1!'
      # The container is disposable, so the Object Explorer checks may create and drop their marked scratch databases.
      VARIA_TEST_SQL_SCRATCH: '1'
      VARIA_UPDATE_SCRIPT_GOLDENS: ${{ inputs.update-goldens && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/Varia.Backend/packages.lock.json
      - name: .NET checks (offline, live, and scratch database)
        run: npm run backend:test
      - name: Upload Script As performance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scripting-perf-${{ matrix.version }}
          path: artifacts/scripting-perf.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload rewritten script goldens
        if: always() && inputs.update-goldens
        uses: actions/upload-artifact@v7
        with:
          name: scripting-goldens-${{ matrix.version }}
          path: tests/fixtures/scripting/golden/
          retention-days: 7
