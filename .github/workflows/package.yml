name: Package

# One platform's packaging for Release builds (release.yml): electron-builder's installers, the packaged and portable smoke
# tests (Electron fuses and asar integrity read back), on Linux the AppImage itself (scripts/appimage-check.mjs) and, on
# Windows, the installer. Only release.yml calls it.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      rid:
        type: string
        required: true
      target:
        type: string
        required: true
      executable:
        type: string
        required: true
      asset:
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  package:
    name: Package ${{ inputs.rid }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + v) throw new Error('Tag must match package.json version: v' + v)"
      - run: npm ci --no-audit --no-fund
      # CI typechecks every pull request and main commit (on Linux, where it is strictest); a tag is the one build CI never saw.
      - name: Type check
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run typecheck
      - name: Build application
        run: npx electron-vite build
      - name: Publish self-contained backend
        run: dotnet publish backend/Varia.Backend/Varia.Backend.csproj -c Release -r ${{ inputs.rid }} --self-contained true -o artifacts/release-backend
      - name: Package application
        id: package
        run: npm run package -- ${{ inputs.target }}
      - name: Check release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = switch ('${{ inputs.rid }}') {
            'win-x64' { @("dist/Varia-SQL-Manager-$version-Windows-x64-Setup.exe", "dist/Varia-SQL-Manager-$version-Windows-x64-Portable.exe") }
            'linux-x64' { @("dist/Varia-SQL-Manager-$version-linux-x86_64.AppImage") }
            'osx-arm64' { @("dist/Varia-SQL-Manager-$version-mac-arm64.dmg", "dist/Varia-SQL-Manager-$version-mac-arm64.zip") }
            'osx-x64' { @("dist/Varia-SQL-Manager-$version-mac-x64.dmg", "dist/Varia-SQL-Manager-$version-mac-x64.zip") }
          }
          foreach ($file in $expected) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" } }
      # The packaged names must be ones the update manifest recognises, or this platform's copies could never update.
      - name: Check update manifest
        shell: bash
        run: node scripts/update-manifest.mjs dist "$(node -p "require('./package.json').version")"
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Smoke test packaged application
        shell: bash
        env:
          VARIA_PACKAGED_EXECUTABLE: ${{ inputs.executable }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/packaged-smoke.mjs
          else
            node scripts/packaged-smoke.mjs
          fi
      # The AppImage itself, which the smoke test above (linux-unpacked) never runs: its runtime, squashfs, generated AppRun
      # and bundled files. Inspect extracts it, reads back the fuses and runs AppRun with the search paths unset, empty and set.
      - name: Inspect AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/appimage-check.mjs inspect "dist/Varia-SQL-Manager-$(node -p "require('./package.json').version")-linux-x86_64.AppImage"
      # APPIMAGE_EXTRACT_AND_RUN: the runtime unpacks itself instead of mounting through FUSE, which the runner may lack.
      - name: Smoke test AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VARIA_PACKAGED_EXECUTABLE="dist/Varia-SQL-Manager-$(node -p "require('./package.json').version")-linux-x86_64.AppImage" xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/packaged-smoke.mjs
      # Where unprivileged user namespaces are restricted (stock Ubuntu 23.10+), AppRun adds --no-sandbox; main must refuse to
      # start rather than run the renderer unsandboxed. The restriction is lifted again whatever the outcome.
      - name: AppImage refuses to run without the sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          status=0
          xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/appimage-check.mjs refusal "dist/Varia-SQL-Manager-$(node -p "require('./package.json').version")-linux-x86_64.AppImage" || status=$?
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          exit $status
      - name: Smoke test Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:VARIA_PORTABLE_EXECUTABLE = "dist/Varia-SQL-Manager-$version-Windows-x64-Portable.exe"
          node scripts/portable-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test Windows installer
        if: (success() || failure()) && runner.os == 'Windows' && steps.package.outcome == 'success'
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      # Only a tag's release job (and a manual run, to fetch a build by hand) uses the installers.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.rid }}
          path: ${{ inputs.asset }}
          if-no-files-found: error
          retention-days: 7
