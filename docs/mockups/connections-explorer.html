<div id="connection-explorer-preview" aria-label="Connection and explorer design">
  <div class="ce-scenarios">
    <label for="ce-scene">Preview state</label>
    <select id="ce-scene">
      <option value="connected">Connected</option>
      <option value="reconnecting">Reload · reconnecting</option>
      <option value="reload">Reload · reconnect failed</option>
      <option value="credentials">Reload · credentials required</option>
      <option value="disconnected">Disconnected by you</option>
      <option value="lost">Connection lost</option>
      <option value="running">Running query</option>
    </select>
  </div>
  <div class="ce-window" aria-label="Varia connection and Object Explorer proposal">
    <div class="ce-titlebar"><strong>Varia</strong><span>File</span><span>Edit</span><span>View</span><span>Query</span><button type="button" data-action="options">Tools · Options</button><span>Help</span></div>
    <div class="ce-shell">
      <aside class="ce-explorer" aria-label="Object Explorer">
        <div class="ce-panehead"><strong>Object Explorer</strong><span id="ce-count"></span></div>
        <div class="ce-explorer-tools" aria-label="Object Explorer toolbar">
          <button type="button" data-action="picker"><i data-lucide="plug" aria-hidden="true"></i><span>Connect…</span></button>
          <button type="button" data-action="disconnect" data-tooltip="Disconnect selected server" aria-label="Disconnect selected server"><i data-lucide="unplug" aria-hidden="true"></i><span class="ce-tool-label">Disconnect</span></button>
          <button type="button" data-action="remove" data-tooltip="Disconnect and remove selected server from Object Explorer" aria-label="Disconnect and remove selected server from Object Explorer"><i data-lucide="circle-x" aria-hidden="true"></i><span class="ce-tool-label">Remove</span></button>
        </div>
        <div id="ce-roots"></div>
        <div id="ce-context" class="ce-menu" hidden></div>
        <div class="ce-explorer-foot"><span id="ce-explorer-state"></span></div>
      </aside>
      <main class="ce-workbench">
        <div class="ce-querybar">
          <button type="button" class="ce-primary" data-action="execute"><i data-lucide="play" aria-hidden="true"></i>Execute <kbd>F5</kbd></button>
          <button type="button" data-action="reconnect" id="ce-query-reconnect" hidden><i data-lucide="plug" aria-hidden="true"></i>Reconnect</button>
          <div class="ce-target"><span class="ce-env">PRODUCTION</span><span id="ce-server-picker"></span><i data-lucide="chevron-down" aria-hidden="true"></i><span class="ce-db">Sales</span></div>
        </div>
        <div id="ce-tabs" class="ce-tabs" aria-label="Query tabs"></div>
        <div id="ce-notice" class="ce-notice" role="status" hidden></div>
        <div class="ce-editor" aria-label="SQL editor preview">
          <div class="ce-code"><span class="ce-number">1</span><code><b>SELECT</b> TOP (100) *</code></div>
          <div class="ce-code"><span class="ce-number">2</span><code><b>FROM</b> dbo.Orders</code></div>
          <div class="ce-code"><span class="ce-number">3</span><code><b>ORDER BY</b> OrderDate <b>DESC</b>;</code></div>
        </div>
        <div class="ce-results"><div class="ce-result-head"><strong>Results</strong><span>Messages</span><span id="ce-results-label"></span></div><div id="ce-result-body"></div></div>
        <div id="ce-query-status" class="ce-query-status"></div>
      </main>
    </div>
    <div id="ce-status" class="ce-bottom" role="status" aria-live="polite">Ready</div>
    <div id="ce-overlay" class="ce-overlay" hidden></div>
  </div>
</div>
<style>

@media(pointer:coarse) { #connection-explorer-preview button { min-height:44px } #connection-explorer-preview .ce-root-state button,#connection-explorer-preview .ce-tab-line button { min-height:44px } #connection-explorer-preview select,#connection-explorer-preview input { font-size:16px } }

<script>
(() => {
  const root = document.getElementById('connection-explorer-preview')
  const q = id => root.querySelector('#' + id)
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`
  const appearance = { identities: true, toolbarLabels: true }
  const saved = window.openai?.widgetState
  let scene = saved?.modelContent?.scene || 'disconnected'
  if (![...q('ce-scene').options].some(option => option.value === scene)) scene = 'connected'
  let entries, tabs, selected, activeTab, notice, results, retainedResults, pendingRemove = false
  let globalReconnect = saved?.modelContent?.globalReconnect ?? true
  const policies = { prod: saved?.modelContent?.connectionReconnect || 'inherit', reader: 'inherit' }
  const names = { prod: 'alex', reader: 'report_reader', deployment: 'deployment_admin' }
  const overlay = q('ce-overlay')
  function save() {
    window.openai?.setWidgetState?.({ modelContent: { scene, globalReconnect, connectionReconnect: policies.prod }, privateContent: { identities: appearance.identities, toolbarLabels: appearance.toolbarLabels } }).catch(() => {})
  }
  function applyAppearance() {
    root.classList.toggle('ce-hide-identities', !appearance.identities)
    root.classList.toggle('ce-compact-tools', !appearance.toolbarLabels)
  }
  function initialize(value) {
    scene = value
    entries = [{ id:'prod', state:'connected', reason:'', visible:true }, { id:'reader', state:'connected', reason:'', visible:true }]
    tabs = [{ id:1, name:'Sales review.sql', entry:'prod', dirty:true }, { id:2, name:'Reconciliation.sql', entry:'prod', dirty:false }, { id:3, name:'Daily report.sql', entry:'reader', dirty:false }]
    selected = 'prod'; activeTab = 1; notice = ''; results = true; retainedResults = false
    if (scene !== 'connected' && scene !== 'running') {
      entries.forEach(entry => entry.state = scene === 'reconnecting' ? 'connecting' : 'disconnected')
      if (scene === 'disconnected' || scene === 'lost') entries[1].state = 'connected'
      entries[0].reason = scene === 'reconnecting' ? 'Reconnecting…' : scene === 'reload' ? 'Reconnect failed · timed out' : scene === 'credentials' ? 'Credentials required' : scene === 'lost' ? 'Connection lost' : 'Disconnected'
      entries[1].reason = 'Disconnected'
      if (scene === 'reconnecting') entries[1].reason = 'Reconnecting…'
      results = scene === 'disconnected' || scene === 'lost'
      retainedResults = results
      notice = scene === 'reconnecting' ? 'Reconnecting to 2 previously connected servers…' : scene === 'reload' ? 'Automatic reconnect failed for sql-prod-01. Your queries remain open.' : scene === 'credentials' ? 'sql-prod-01 needs credentials. Sign in when you are ready.' : scene === 'lost' ? 'Connection lost. Queries were not retried.' : ''
    }
    if (scene === 'running') notice = 'Sales review.sql is running.'
    q('ce-scene').value = scene
    closeOverlay(); render()
  }
  const entryBy = id => entries.find(entry => entry.id === id)
  const selectedEntry = () => entryBy(selected)
  const active = () => tabs.find(tab => tab.id === activeTab)
  const isConnected = id => entryBy(id)?.state === 'connected'
  const tabState = tab => isConnected(tab.entry) ? 'PRODUCTION · SID —' : 'sql-prod-01 · Disconnected'
  function render() {
    applyAppearance()
    const visible = entries.filter(entry => entry.visible)
    q('ce-count').textContent = `${visible.length} connections`
    q('ce-roots').innerHTML = visible.map(entry => `<div class="ce-root ${selected === entry.id ? 'ce-selected' : ''}" data-entry="${entry.id}">
      <div class="ce-root-line"><button class="ce-root-name" type="button" data-select="${entry.id}" aria-pressed="${selected === entry.id}">${icon(isConnected(entry.id) ? 'chevron-down' : 'chevron-right')}${icon('server')}<strong>sql-prod-01</strong><span class="ce-prod-tag">PROD</span></button><button type="button" data-menu="${entry.id}" aria-label="Actions for sql-prod-01, ${names[entry.id]}">${icon('ellipsis')}</button></div>
      <div class="ce-root-detail">SQL login · ${names[entry.id]} · Sales · ${entry.id === 'reader' ? 'Read only' : 'Read/write'}</div>
      <div class="ce-root-state"><span class="ce-dot ${isConnected(entry.id) ? '' : 'ce-off'}"></span><span>${isConnected(entry.id) ? 'Connected' : entry.reason || 'Disconnected'}</span>${isConnected(entry.id) ? '' : entry.state === 'connecting' ? `<button type="button" data-cancel-entry="${entry.id}">Cancel</button>` : `<button type="button" data-reconnect="${entry.id}">${scene === 'credentials' && entry.id === 'prod' ? 'Sign in…' : 'Reconnect'}</button>`}</div>
      ${isConnected(entry.id) ? `<div class="ce-folders"><div class="ce-folder">${icon('chevron-right')}${icon('folder')}Databases</div><div class="ce-folder">${icon('chevron-right')}${icon('folder')}Security</div><div class="ce-folder">${icon('chevron-right')}${icon('folder')}Server Objects</div></div>` : ''}</div>`).join('') || '<div class="ce-results-empty">No servers in Object Explorer.</div>'
    q('ce-explorer-state').textContent = `${visible.filter(entry => isConnected(entry.id)).length} connected · ${visible.filter(entry => !isConnected(entry.id)).length} disconnected`
    q('ce-tabs').innerHTML = tabs.map(tab => `<div class="ce-tab ${activeTab === tab.id ? 'ce-tab-active' : ''}"><div class="ce-tab-line">${icon('database')}<button type="button" data-tab="${tab.id}">${tab.name}</button>${tab.dirty ? '<span aria-label="Unsaved changes">●</span>' : ''}</div><div class="ce-tab-sub">${tabState(tab)}</div></div>`).join('')
    const tab = active(), connected = !!tab && isConnected(tab.entry)
    q('ce-server-picker').textContent = tab ? `sql-prod-01${connected ? '' : ' · Disconnected'}` : 'Disconnected'
    q('ce-query-reconnect').hidden = !tab || connected
    root.querySelector('[data-action="execute"]').disabled = !connected
    root.querySelector('[data-action="disconnect"]').disabled = !selectedEntry()?.visible || !isConnected(selected)
    const removeButton = root.querySelector('[data-action="remove"]')
    removeButton.disabled = !selectedEntry()?.visible
    removeButton.setAttribute('aria-label', isConnected(selected) ? 'Disconnect and remove selected server from Object Explorer' : 'Remove selected server from Object Explorer')
    removeButton.setAttribute('data-tooltip', isConnected(selected) ? 'Disconnect and remove from Object Explorer' : 'Remove from Object Explorer')
    q('ce-notice').hidden = !notice
    q('ce-notice').textContent = notice
    q('ce-results-label').textContent = results ? retainedResults ? 'Retained results · previous session' : 'Completed · 2 rows' : ''
    q('ce-result-body').innerHTML = results ? '<table aria-label="Retained query results"><thead><tr><th>OrderId</th><th>OrderDate</th><th>Total</th></tr></thead><tbody><tr><td>10421</td><td>2026-11-12</td><td>920.00</td></tr><tr><td>10420</td><td>2026-11-12</td><td>156.00</td></tr></tbody></table>' : '<div class="ce-results-empty">No results in this session.</div>'
    q('ce-query-status').textContent = tab ? `sql-prod-01 · ${connected ? 'Connected' : 'Disconnected'} | ${names[tab.entry]} | Sales | SID —` : 'No query selected'
    q('ce-status').textContent = tabs.length ? 'Ready' : 'Queries closed'
    if (globalThis.lucide) lucide.createIcons({ attrs: { width:16, height:16 } })
  }
  function closeMenu() { q('ce-context').hidden = true }
  function closeOverlay() { overlay.hidden = true; overlay.innerHTML = ''; closeMenu() }
  function showDialog(title, body, footer, kind) {
    closeMenu(); overlay.hidden = false
    overlay.innerHTML = `<section class="ce-dialog" role="dialog" aria-modal="true" aria-labelledby="ce-dialog-title"><h2 id="ce-dialog-title">${title}</h2>${body}<div class="ce-dialog-footer">${footer}</div></section>`
    const cancel = overlay.querySelector('[data-action="cancel"]')
    ;(cancel || overlay.querySelector('button,input,select'))?.focus()
  }
  const cancelButton = '<button type="button" data-action="cancel">Cancel</button>'
  function openPicker(reconnectId) {
    if (reconnectId) selected = reconnectId
    const target = reconnectId || selected
    showDialog(reconnectId ? 'Reconnect to sql-prod-01' : 'Connect to Server', `
      <div class="ce-picker-entry">${icon('server')}<strong>sql-prod-01</strong><span class="ce-prod-tag">PRODUCTION</span><span class="ce-dim">${isConnected(target) ? 'Already in Object Explorer' : 'Disconnected'}</span></div>
      <div class="ce-dialog-row"><label for="ce-login">Authentication</label><select id="ce-login"><option value="prod" ${target === 'prod' ? 'selected' : ''}>SQL Server · alex</option><option value="reader" ${target === 'reader' ? 'selected' : ''}>SQL Server · report_reader</option><option value="deployment" ${target === 'deployment' ? 'selected' : ''}>SQL Server · deployment_admin</option></select></div>
      <div class="ce-dialog-row"><label>Database</label><span>Sales</span></div>
      <div class="ce-dialog-row"><label>Connection settings</label><span id="ce-picker-settings">Encrypt Mandatory · Read/write</span></div>
      <div id="ce-credentials" ${scene === 'credentials' ? '' : 'hidden'}><div class="ce-dialog-row"><label for="ce-password">Password</label><input id="ce-password" type="password" placeholder="Enter a sample password" autocomplete="off"></div><label class="ce-inlinecheck ce-dim" style="margin-top:9px"><input type="checkbox">Remember password using OS-protected storage</label></div>
      <div class="ce-dialog-row"><label for="ce-auto">Reconnect on startup</label><select id="ce-auto"><option value="inherit">Use global default (On)</option><option value="on">On</option><option value="off">Off</option></select></div>
      <div class="ce-dialog-note" id="ce-match-note">${isConnected(target) ? 'This exact connection is already open. Its existing explorer tree will be selected.' : 'Reconnect this explorer entry. Its query tabs keep their individual databases.'}</div>`, `${cancelButton}<button class="ce-primary" type="button" data-action="connect-now">${isConnected(target) ? 'Use Existing Connection' : 'Reconnect'}</button>`, 'picker')
    q('ce-auto').value = policies[target] || 'inherit'
    q('ce-auto').options[0].textContent = `Use global default (${globalReconnect ? 'On' : 'Off'})`
    updatePicker()
  }
  function updatePicker() {
    const id = q('ce-login').value
    q('ce-auto').value = policies[id] || 'inherit'
    q('ce-picker-settings').textContent = `Encrypt Mandatory · ${id === 'reader' ? 'Read only' : 'Read/write'}`
    const existing = entryBy(id)
    q('ce-match-note').textContent = existing ? isConnected(id) ? 'This exact connection is already open. Its existing explorer tree will be selected.' : 'Reconnect this explorer entry. Its query tabs keep their individual databases.' : 'Different credentials create a separate connection, even on the same server.'
    overlay.querySelector('[data-action="connect-now"]').textContent = existing ? isConnected(id) ? 'Use Existing Connection' : 'Reconnect' : 'Connect'
    overlay.querySelector('[data-action="connect-now"]').disabled = !q('ce-credentials').hidden && !q('ce-password').value
  }
  function reconnect(id) {
    selected = id
    if (scene === 'credentials' && id === 'prod') { openPicker(id); return }
    const entry = entryBy(id)
    if (entry) { entry.state = 'connected'; entry.reason = ''; entry.visible = true }
    notice = 'Reconnected to sql-prod-01. Queries are ready; nothing has been executed.'
    closeOverlay(); render(); save()
  }
  function disconnect(remove) {
    const attached = tabs.filter(tab => tab.entry === selected)
    pendingRemove = remove
    if (!attached.length) { completeDisconnect(false); return }
    showDialog(`${remove ? 'Disconnect and remove' : 'Disconnect from'} sql-prod-01?`, `
      <p>${attached.length} query tabs use this connection (${names[selected]} · Sales).</p>
      <ul class="ce-doclist">${attached.map(tab => `<li>${tab.name}${tab.dirty ? ' · unsaved' : ''}</li>`).join('')}</ul>
      ${scene === 'running' && selected === 'prod' ? '<p class="ce-warning">1 query is running. Disconnecting will cancel it. Its outcome may be uncertain.</p>' : ''}
      <p class="ce-dim">${remove ? 'The server will leave Object Explorer. Saved connection profiles remain.' : 'The server will remain collapsed in Object Explorer.'} Keeping tabs preserves their text, database and available results.</p>`, `${cancelButton}<button type="button" data-action="disconnect-close">Disconnect and Close Tabs…</button><button class="ce-primary" type="button" data-action="disconnect-keep">Disconnect and Keep Tabs</button>`, 'disconnect')
  }
  function completeDisconnect(closeTabs) {
    const entry = selectedEntry()
    if (entry) { entry.state = 'disconnected'; entry.reason = 'Disconnected'; if (pendingRemove) entry.visible = false }
    if (results) retainedResults = true
    if (closeTabs) { tabs = tabs.filter(tab => tab.entry !== selected); activeTab = tabs[0]?.id; results = false }
    notice = pendingRemove ? 'Removed from Object Explorer. The saved connection profile is unchanged.' : 'Disconnected. Reconnect from the server row, query toolbar or connection picker.'
    closeOverlay(); render(); save()
  }
  function closeTabsChoice() {
    const dirty = tabs.filter(tab => tab.entry === selected && tab.dirty)
    if (!dirty.length) { completeDisconnect(true); return }
    showDialog('Save changes before closing query tabs?', `<p>${dirty.map(tab => tab.name).join(', ')} has unsaved changes.</p><p class="ce-dim">Cancel leaves the connection and all query tabs open.</p>`, `${cancelButton}<button type="button" data-action="discard-close">Don’t Save and Close</button><button class="ce-primary" type="button" data-action="save-close">Save and Close</button>`, 'save')
  }
  function options() {
    showDialog('Options · Environment · Connections', `<label class="ce-inlinecheck"><input id="ce-global-auto" type="checkbox" ${globalReconnect ? 'checked' : ''}><span>Automatically reconnect previously connected servers on startup and reload</span></label><p class="ce-dim">Individual connections can use this default or override it. Servers you explicitly disconnected stay disconnected. Missing credentials and sign-in failures leave the server available to reconnect.</p><p class="ce-dim">Queries are never executed automatically.</p>`, `${cancelButton}<button class="ce-primary" type="button" data-action="save-options">OK</button>`, 'options')
  }
  root.addEventListener('change', event => {
    if (event.target.id === 'ce-scene') { initialize(event.target.value); save() }
    if (event.target.id === 'ce-login') updatePicker()
  })
  root.addEventListener('input', event => {
    if (event.target.id === 'ce-password') overlay.querySelector('[data-action="connect-now"]').disabled = !event.target.value
  })
  root.addEventListener('click', event => {
    const button = event.target.closest('button')
    if (!button) return
    if (button.dataset.select) { selected = button.dataset.select; closeMenu(); render(); return }
    if (button.dataset.tab) { activeTab = Number(button.dataset.tab); render(); return }
    if (button.dataset.reconnect) { reconnect(button.dataset.reconnect); return }
    if (button.dataset.cancelEntry) {
      const entry = entryBy(button.dataset.cancelEntry)
      entry.state = 'disconnected'; entry.reason = 'Reconnect cancelled'
      notice = 'Reconnect cancelled. This server stays disconnected.'
      render(); save(); return
    }
    if (button.dataset.menu) {
      selected = button.dataset.menu; render()
      const connected = isConnected(selected)
      q('ce-context').innerHTML = `${connected ? '<button type="button" data-action="disconnect">Disconnect…</button><button type="button" data-action="remove">Disconnect and Remove from Object Explorer…</button>' : '<button type="button" data-action="reconnect-selected">Reconnect</button><button type="button" data-action="remove">Remove from Object Explorer</button>'}<hr><button type="button" data-action="details">Connection Settings…</button><button type="button" data-action="dismiss-menu">Close menu</button>`
      q('ce-context').hidden = false; q('ce-context').querySelector('button').focus(); return
    }
    switch (button.dataset.action) {
      case 'picker': openPicker(); break
      case 'details': openPicker(selected); break
      case 'dismiss-menu': closeMenu(); break
      case 'cancel': closeOverlay(); break
      case 'disconnect': disconnect(false); break
      case 'remove': if (isConnected(selected)) disconnect(true); else { pendingRemove = true; completeDisconnect(false) } break
      case 'disconnect-keep': completeDisconnect(false); break
      case 'disconnect-close': closeTabsChoice(); break
      case 'discard-close': case 'save-close': completeDisconnect(true); break
      case 'reconnect-selected': reconnect(selected); break
      case 'reconnect': if (active()) reconnect(active().entry); break
      case 'options': options(); break
      case 'save-options': globalReconnect = q('ce-global-auto').checked; closeOverlay(); save(); break
      case 'connect-now': {
        let id = q('ce-login').value
        policies[id] = q('ce-auto').value
        if (!entryBy(id)) entries.push({ id, state:'disconnected', visible:true, reason:'' })
        const already = isConnected(id)
        selected = id; const entry = entryBy(id); entry.state = 'connected'; entry.visible = true
        closeOverlay(); notice = already ? 'Existing connection selected. No duplicate explorer tree was added.' : 'Connected to sql-prod-01. Queries have not been executed.'; render(); save(); break
      }
      case 'execute': notice = 'Query execution preview · no SQL was sent.'; render(); break
    }
  })
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape') { closeOverlay(); closeMenu() }
    if (event.key === 'Tab' && !overlay.hidden) {
      const focusable = [...overlay.querySelectorAll('button:not(:disabled), input, select')].filter(element => !element.closest('[hidden]'))
      const first = focusable[0], last = focusable[focusable.length - 1]
      if (event.shiftKey && document.activeElement === first) { last?.focus(); event.preventDefault() }
      if (!event.shiftKey && document.activeElement === last) { first?.focus(); event.preventDefault() }
    }
  })
  window.addEventListener('openai:set_globals', event => {
    const updated = event.detail?.globals?.widgetState
    if (updated?.modelContent?.scene && [...q('ce-scene').options].some(option => option.value === updated.modelContent.scene)) initialize(updated.modelContent.scene)
  })
  initialize(scene)
  if (saved?.privateContent) Object.assign(appearance, saved.privateContent)
  applyAppearance()
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container:root, onChange:() => { applyAppearance(); save() } })
    tweak.addToggle(appearance, 'identities', { label:'Show account and connection settings' })
    tweak.addToggle(appearance, 'toolbarLabels', { label:'Show toolbar action labels' })
  }
})()
</script>
