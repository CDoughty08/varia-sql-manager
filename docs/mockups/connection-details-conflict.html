<div id="connection-details-conflict" class="viz-carousel viz-dotted-background" aria-label="Existing connection details review designs">
  <section data-variant="Confirmation dialog" aria-label="Confirmation dialog proposal">
    <div class="cd-stage" id="cd-confirmation" aria-label="Connection conflict confirmation"></div>
  </section>
  <section data-variant="Review in picker" aria-label="Review inside the connection picker proposal" hidden>
    <div class="cd-stage" id="cd-inline" aria-label="Connection picker conflict review"></div>
  </section>
</div>
<style>
#connection-details-conflict { --cd-bg:light-dark(#fff,#20232b); --cd-pane:light-dark(#f4f5f9,#17191f); --cd-text:light-dark(#272a36,#e0e2ec); --cd-dim:light-dark(#626879,#abb0c0); --cd-line:light-dark(#daddE7,#383c47); --cd-iris:light-dark(#5952bc,#b9b2ff); --cd-iris-ink:light-dark(#fff,#201a38); --cd-tint:light-dark(#efedff,#302c47); --cd-hover:light-dark(#e9eaf1,#30343f); --cd-prod:light-dark(#96344b,#f0a8bb); --cd-prod-bg:light-dark(#f9e3e9,#472c37); --cd-green:light-dark(#28744e,#8ad3af); --cd-purple:light-dark(#7059b9,#b5a2ff); --cd-blue:light-dark(#3774b6,#8cbded); font-family:system-ui,sans-serif; font-size:13px; line-height:1.5; color:var(--cd-text) }
#connection-details-conflict * { box-sizing:border-box }
#connection-details-conflict [hidden] { display:none!important }
#connection-details-conflict .cd-stage { min-height:770px; padding:54px 20px 28px; display:flex; align-items:flex-start; justify-content:center }
#connection-details-conflict .cd-surface { width:610px; max-width:100%; border:1px solid var(--cd-line); background:var(--cd-bg); border-radius:8px; box-shadow:0 9px 30px light-dark(#1615261a,#00000040); overflow:clip }
#connection-details-conflict .cd-body { padding:22px; display:grid; gap:16px }
#connection-details-conflict h2 { margin:0; font-size:18px; line-height:1.35; font-weight:600 }
#connection-details-conflict p { margin:0 }
#connection-details-conflict strong { font-weight:600 }
#connection-details-conflict svg { width:16px; height:16px; flex-shrink:0 }
#connection-details-conflict .cd-heading { display:flex; gap:10px; align-items:center }
#connection-details-conflict .cd-heading svg { color:var(--cd-iris) }
#connection-details-conflict .cd-identity { display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding:10px 12px; background:var(--cd-pane); border:1px solid var(--cd-line); border-radius:5px; font-size:12px }
#connection-details-conflict .cd-identity span + span:before { content:'·'; padding-right:7px; color:var(--cd-dim) }
#connection-details-conflict .cd-same { color:var(--cd-dim); font-size:12px; margin-top:4px }
#connection-details-conflict table { border-collapse:collapse; width:100%; table-layout:fixed; font-size:12px }
#connection-details-conflict th { text-align:left; font-weight:500; color:var(--cd-dim); padding:0 8px 9px; width:32% }
#connection-details-conflict th:first-child { width:25%; padding-left:0 }
#connection-details-conflict td { border-top:1px solid var(--cd-line); padding:10px 8px; vertical-align:top; overflow-wrap:anywhere }
#connection-details-conflict td:first-child { color:var(--cd-dim); padding-left:0 }
#connection-details-conflict td:last-child,#connection-details-conflict th:last-child { padding-right:0 }
#connection-details-conflict .cd-tag { display:inline-flex; align-items:center; padding:1px 6px; border-radius:3px; color:var(--cd-prod); background:var(--cd-prod-bg); font-size:11px; font-weight:600; max-width:100% }
#connection-details-conflict .cd-color { display:inline-flex; align-items:center; gap:6px }
#connection-details-conflict .cd-swatch { width:10px; height:10px; border-radius:50%; background:var(--cd-purple); flex-shrink:0 }
#connection-details-conflict .cd-blue { background:var(--cd-blue) }
#connection-details-conflict .cd-effect { border-left:2px solid var(--cd-iris); padding:0 0 0 11px; color:var(--cd-dim); font-size:12px }
#connection-details-conflict .cd-footer { padding:14px 20px; display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; border-top:1px solid var(--cd-line); background:var(--cd-pane) }
#connection-details-conflict button { display:inline-flex; align-items:center; justify-content:center; gap:7px; font:inherit; font-size:12px; min-height:32px; border:1px solid var(--cd-line); border-radius:4px; padding:6px 10px; background:var(--cd-bg); color:var(--cd-text); cursor:var(--cursor-interaction,pointer); text-align:left; max-width:100% }
#connection-details-conflict button:hover { background:var(--cd-hover) }
#connection-details-conflict button.cd-primary { background:var(--cd-iris); color:var(--cd-iris-ink); border-color:transparent }
#connection-details-conflict button.cd-quiet { background:transparent; border-color:transparent }
#connection-details-conflict .cd-match { background:var(--cd-tint); padding:12px; border-radius:5px; display:grid; gap:8px }
#connection-details-conflict .cd-picker-label { color:var(--cd-dim); font-size:11px }
#connection-details-conflict .cd-source { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--cd-pane); border:1px solid var(--cd-line); border-radius:5px }
#connection-details-conflict .cd-source-name { display:flex; gap:8px; align-items:center }
#connection-details-conflict .cd-caret { color:var(--cd-dim) }
#connection-details-conflict details summary { cursor:var(--cursor-interaction,pointer); color:var(--cd-iris); font-size:12px; padding-bottom:10px }
#connection-details-conflict .cd-titlebar { background:var(--cd-pane); display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--cd-line); font-size:12px }
#connection-details-conflict .cd-done-root { display:flex; flex-wrap:wrap; align-items:center; gap:8px }
#connection-details-conflict .cd-connected { color:var(--cd-green); font-size:12px; display:flex; align-items:center; gap:6px }
#connection-details-conflict .cd-query { display:grid; gap:2px; border-top:1px solid var(--cd-line); padding:10px 0; font-size:12px }
#connection-details-conflict .cd-query small { color:var(--cd-dim); font-size:11px }
#connection-details-conflict .cd-result { color:var(--cd-dim); font-size:12px; border-left:2px solid var(--cd-green); padding-left:11px }
#connection-details-conflict .cd-silent { color:var(--cd-dim); font-size:12px }
@media(max-width:480px) { #connection-details-conflict .cd-stage { padding:54px 8px 20px; min-height:1000px } #connection-details-conflict .cd-body { padding:16px; gap:14px } #connection-details-conflict .cd-footer { padding:12px 14px; justify-content:flex-start } #connection-details-conflict h2 { font-size:16px } #connection-details-conflict td { padding:9px 5px } #connection-details-conflict th { padding:0 5px 8px } #connection-details-conflict th:first-child { width:33% } #connection-details-conflict th:nth-child(2) { width:34% } #connection-details-conflict th:last-child { width:33% } }
@media(pointer:coarse) { #connection-details-conflict button,#connection-details-conflict summary { min-height:44px } }
</style>
<script>
(() => {
  const root = document.getElementById('connection-details-conflict')
  const baseline = { name:'Production reporting', color:'Purple', environment:'Production', reconnect:'Off' }
  const scenarios = {
    important: { name:'Reporting', color:'Blue', environment:'None', reconnect:'On' },
    labels: { name:'Reporting', color:'Blue', environment:'Production', reconnect:'Off' },
    exact: { ...baseline }
  }
  const scenarioOptions = [{ label:'Environment and reconnect changes', value:'important' }, { label:'Name and color only', value:'labels' }, { label:'Exact match', value:'exact' }]
  const saved = window.openai?.widgetState?.modelContent?.reviews || {}
  const models = ['confirmation','inline'].map(id => ({ id, scenario:scenarios[saved[id]?.scenario] ? saved[id].scenario : 'important', action:'', current:{ ...baseline } }))
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`
  const escape = value => String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[character])
  function save() {
    const reviews = Object.fromEntries(models.map(model => [model.id, { scenario:model.scenario, action:model.action }]))
    window.openai?.setWidgetState?.({ modelContent:{ reviews } }).catch(() => {})
  }
  function display(key, value) {
    if (key === 'environment' && value !== 'None') return `<span class="cd-tag">${escape(value)}</span>`
    if (key === 'color') return `<span class="cd-color"><span class="cd-swatch ${value === 'Blue' ? 'cd-blue' : ''}"></span>${escape(value)}</span>`
    return escape(value)
  }
  function differenceRows(model) {
    const selected = scenarios[model.scenario]
    const labels = { name:'Name', environment:'Environment', color:'Color', reconnect:'Startup reconnect' }
    return Object.keys(labels).filter(key => model.current[key] !== selected[key]).map(key => `<tr><td>${labels[key]}</td><td>${display(key,model.current[key])}</td><td>${display(key,selected[key])}</td></tr>`).join('')
  }
  function table(model) {
    return `<table aria-label="Changed connection details"><thead><tr><th>Detail</th><th>Current</th><th>Selected</th></tr></thead><tbody>${differenceRows(model)}</tbody></table>`
  }
  function effects(model) {
    const incoming = scenarios[model.scenario]
    const consequences = []
    if (model.current.environment !== incoming.environment) consequences.push('The Production badge will be removed from this entry and its 2 query tabs.')
    if (model.current.reconnect !== incoming.reconnect) consequences.push('Automatic reconnect will be enabled for future startup and reload.')
    return consequences.length ? `<div class="cd-effect">${consequences.map(text => `<p>${text}</p>`).join('')}</div>` : ''
  }
  function buttons(exact = false) {
    return `<button type="button" data-action="cancel" class="cd-quiet">Cancel</button>${exact ? '' : '<button type="button" data-action="keep">Keep Current Details</button>'}<button type="button" class="cd-primary" data-action="${exact ? 'keep' : 'apply'}">${exact ? 'Use Existing Connection' : 'Use Selected Details'}</button>`
  }
  function identity() { return `<div class="cd-identity">${icon('server')}<span>sql-prod-01</span><span>Sales</span><span>SQL login · alex</span></div>` }
  function outcome(model) {
    const current = model.current
    const status = model.action === 'apply' ? 'Existing connection selected. Selected details applied.' : model.action === 'cancel' ? 'Selection cancelled. Current details kept.' : 'Existing connection selected. Current details kept.'
    return `<div class="cd-surface"><div class="cd-titlebar"><strong>Object Explorer</strong><button type="button" data-action="choose">${icon('plug')}Connect…</button></div><div class="cd-body"><div class="cd-done-root">${display('color', current.color)}<strong>${escape(current.name)}</strong>${current.environment === 'None' ? '' : display('environment',current.environment)}</div>${identity()}<div class="cd-connected">${icon('circle-check')}Connected · 1 Explorer entry</div><p class="cd-silent">Startup reconnect: ${escape(current.reconnect)}</p><div><div class="cd-query"><strong>Sales review.sql</strong><small>${escape(current.name)} · ${current.environment === 'None' ? '' : escape(current.environment) + ' · '}SID 72</small></div><div class="cd-query"><strong>Reconciliation.sql</strong><small>${escape(current.name)} · ${current.environment === 'None' ? '' : escape(current.environment) + ' · '}SID 78</small></div></div><p class="cd-result" role="status" aria-live="polite">${status}</p>${model.action === 'apply' ? '<div><button type="button" data-action="undo">Undo detail changes</button></div>' : ''}</div></div>`
  }
  function render(model) {
    const stage = root.querySelector('#cd-' + model.id)
    if (model.action) { stage.innerHTML = outcome(model) }
    else {
      const selected = scenarios[model.scenario]
      const exact = !differenceRows(model)
      const separateDialog = model.id === 'confirmation' && !exact
      if (separateDialog) {
        stage.innerHTML = `<div class="cd-surface" role="dialog" aria-labelledby="cd-confirm-title"><div class="cd-body"><div class="cd-heading">${icon('layers-2')}<h2 id="cd-confirm-title">Use selected connection details?</h2></div><p><strong>${escape(model.current.name)}</strong> is already open in Object Explorer. <strong>${escape(selected.name)}</strong> uses the same server, database, account and connection settings.</p>${identity()}${table(model)}${effects(model)}<p class="cd-silent">The connection and SQL sessions stay open. The selected details will apply to Explorer and its attached query tabs.</p></div><div class="cd-footer">${buttons()}</div></div>`
      } else {
        stage.innerHTML = `<div class="cd-surface"><div class="cd-body"><h2>Connect to Server</h2><div><p class="cd-picker-label">Selected saved connection</p><div class="cd-source"><span class="cd-source-name">${icon('bookmark')}<strong>${escape(selected.name)}</strong></span><span class="cd-caret">${icon('chevron-down')}</span></div></div>${identity()}<div class="cd-match"><strong>Already open as ${escape(model.current.name)}</strong><p class="cd-silent">${exact ? 'This connection and its details match the existing entry.' : model.scenario === 'labels' ? 'Use this name and color for the existing entry. Its sessions stay open.' : 'Choose which details to use for the existing Explorer entry and its 2 attached query tabs.'}</p></div>${exact ? '' : model.id === 'inline' ? `<details open><summary>Review changed details</summary>${table(model)}</details>${effects(model)}` : table(model)}<p class="cd-silent">${exact ? 'Selecting it will focus the existing tree.' : 'Saved profiles and favorites keep their own details.'}</p></div><div class="cd-footer">${buttons(exact)}</div></div>`
      }
    }
    if (globalThis.lucide) lucide.createIcons({ attrs:{ width:16,height:16 } })
  }
  function reset(model) { model.action = ''; model.current = { ...baseline }; render(model) }
  root.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]')
    if (!button) return
    const model = models.find(candidate => button.closest('#cd-' + candidate.id))
    if (!model) return
    const action = button.dataset.action
    if (action === 'choose') model.action = ''
    else if (action === 'undo') { model.current = { ...baseline }; model.action = 'keep' }
    else { model.action = action; if (action === 'apply') model.current = { ...scenarios[model.scenario] } }
    render(model); save()
  })
  root.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return
    const model = models.find(candidate => event.target.closest('#cd-' + candidate.id))
    if (model && !model.action) { model.action = 'cancel'; render(model); save() }
  })
  window.addEventListener('openai:set_globals', event => {
    const updated = event.detail?.globals?.widgetState?.modelContent?.reviews
    if (!updated) return
    for (const model of models) if (scenarios[updated[model.id]?.scenario]) { model.scenario = updated[model.id].scenario; reset(model) }
  })
  for (const model of models) {
    render(model)
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container:root.querySelector('#cd-' + model.id), onChange:() => { reset(model); save() } })
      tweak.addSelect(model,'scenario',{ label:'Selected connection differences',options:scenarioOptions })
    }
  }
})()
</script>
