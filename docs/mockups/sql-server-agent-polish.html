<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="compact" data-option="a" data-callouts="on">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Varia SQL Manager — SQL Server Agent UX &amp; Visual Polish Lab</title>
<style>
/* ============================================================================
   VARIA SQL MANAGER — CALM PRO DESIGN TOKENS
   Mirrors src/shared/theme/palette.ts & src/shared/theme/metrics.ts (WP-1–WP-6 & OP-0)
   ============================================================================ */
:root {
  --font-ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;

  /* Metrics — Compact (Default) */
  --h-header: 40px;
  --h-bar: 36px;
  --h-tab: 34px;
  --h-control: 26px;
  --h-row: 22px;
  --h-status: 24px;
  --rad-sm: 4px;
  --rad-lg: 8px;
  --rad-pill: 999px;
  --sp-0: 2px;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --ease: cubic-bezier(0.2, 0, 0, 1);

  /* Type Scale */
  --sz-xs: 11px; --ln-xs: 16px;
  --sz-sm: 12px; --ln-sm: 16px;
  --sz-md: 13px; --ln-md: 20px;
  --sz-lg: 15px; --ln-lg: 20px;
  --sz-xl: 20px; --ln-xl: 26px;

  /* Varia Dark Palette */
  --canvas: #16181d;
  --panel: #16181d;
  --sidebar: #111317;
  --chrome: #111317;
  --raised: #1c1f25;
  --overlay: #1d2026;
  --input: #101216;
  --hover: #262a32;
  --active: #30343e;
  --selection: #21273b;
  --selection-strong: #29314f;
  --accent-surface: #232842;

  --text: #d9dce3;
  --text-strong: #f5f6f8;
  --text-secondary: #bcc1cb;
  --text-tertiary: #a3a9b5;
  --text-muted: #9298a4;
  --text-accent: #bcc5ff;

  --border: #262a31;
  --border-subtle: #1f2228;
  --border-strong: #2e323a;
  --separator: #30343c;

  /* Approach B Calm Resting Borders (WP-1) */
  --control-border: #3a404d;
  --control-border-hover: #525a6c;
  --input-border: #3a404d;
  --legacy-border: #6a7184;
  --tonal-fill: rgba(255, 255, 255, 0.045);
  --tonal-fill-hover: rgba(255, 255, 255, 0.08);

  --accent: #8f9cff;
  --accent-hover: #a8b2ff;
  --on-accent: #0e1230;
  --focus: #8f9cff;

  --error: #f39a9a;
  --error-surface: #3a1d22;
  --error-surface-text: #f6bcc1;
  --warning: #e4bb6a;
  --warning-surface: #33291a;
  --warning-surface-text: #f0d49e;
  --success: #74d19c;
  --success-surface: rgba(116, 209, 156, 0.14);
  --success-text: #a6e8bf;
  --info-surface: rgba(110, 164, 234, 0.14);
  --info-text: #b7d3fa;

  --icon: #a3a9b5;
  --icon-muted: #7f8694;
  --icon-folder: #bfa878;
  --chart-blue: #3987e5;
  --chart-purple: #9085e9;
  --chart-yellow: #c98500;
  --chart-green: #199e70;

  --syn-kw: #93a4ff;
  --syn-str: #9fd4a9;
  --syn-cmt: #868e9b;
  --syn-num: #e8b97d;
  --syn-fn: #d4a9f2;

  --grid-alt: rgba(217, 220, 227, 0.02);
  --shadow-popover: 0 8px 24px rgba(0, 0, 0, 0.52);
  --shadow-dialog: 0 16px 48px rgba(0, 0, 0, 0.62);

  /* Lab Chrome */
  --lab-bg: #0b0d11;
  --lab-surface: #12151c;
  --lab-card: #161922;
  --lab-border: #232836;
  --callout-bg: rgba(143, 156, 255, 0.13);
  --callout-border: rgba(143, 156, 255, 0.42);
  --callout-bug-bg: rgba(243, 154, 154, 0.14);
  --callout-bug-border: rgba(243, 154, 154, 0.48);
}

[data-theme="light"] {
  --canvas: #ffffff;
  --panel: #ffffff;
  --sidebar: #f7f8fa;
  --chrome: #f7f8fa;
  --raised: #f1f3f6;
  --overlay: #ffffff;
  --input: #ffffff;
  --hover: #dfe2e7;
  --active: #d6dae0;
  --selection: #e7ebfc;
  --selection-strong: #d9e0fb;
  --accent-surface: #dde1f9;

  --text: #1c1f26;
  --text-strong: #0a0c10;
  --text-secondary: #3a404b;
  --text-tertiary: #4d5461;
  --text-muted: #5c6370;
  --text-accent: #3240b0;

  --border: #e3e6eb;
  --border-subtle: #eceef2;
  --border-strong: #d4d8df;
  --separator: #dcdfe5;

  --control-border: #c2c8d4;
  --control-border-hover: #9aa3b4;
  --input-border: #c2c8d4;
  --legacy-border: #878e9b;
  --tonal-fill: rgba(15, 23, 42, 0.04);
  --tonal-fill-hover: rgba(15, 23, 42, 0.075);

  --accent: #4453d0;
  --accent-hover: #3744b8;
  --on-accent: #ffffff;
  --focus: #4453d0;

  --error: #b42229;
  --error-surface: #fdecec;
  --error-surface-text: #8f1d24;
  --warning: #875800;
  --warning-surface: #fff5dc;
  --warning-surface-text: #6b4400;
  --success: #146f3b;
  --success-surface: rgba(20, 111, 59, 0.11);
  --success-text: #0f5a2f;
  --info-surface: rgba(37, 99, 168, 0.1);
  --info-text: #1c4e8a;

  --icon: #4d5461;
  --icon-muted: #6b7280;
  --icon-folder: #8a6d33;
  --chart-blue: #2a78d6;
  --chart-purple: #6250d6;
  --chart-yellow: #a87200;
  --chart-green: #12936a;

  --syn-kw: #3442c2;
  --syn-str: #1a6d3d;
  --syn-cmt: #6b7280;
  --syn-num: #9a5b13;
  --syn-fn: #7a3eb1;

  --grid-alt: rgba(15, 23, 42, 0.02);
  --shadow-popover: 0 8px 24px rgba(15, 23, 42, 0.14);
  --shadow-dialog: 0 16px 48px rgba(15, 23, 42, 0.22);

  --lab-bg: #eef0f5;
  --lab-surface: #ffffff;
  --lab-card: #f8f9fc;
  --lab-border: #d8dde6;
  --callout-bg: rgba(68, 83, 208, 0.09);
  --callout-border: rgba(68, 83, 208, 0.36);
  --callout-bug-bg: rgba(180, 34, 41, 0.09);
  --callout-bug-border: rgba(180, 34, 41, 0.38);
}

[data-density="comfortable"] {
  --h-header: 44px;
  --h-bar: 40px;
  --h-tab: 38px;
  --h-control: 28px;
  --h-row: 26px;
  --h-status: 26px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--lab-bg); color: var(--text); font-family: var(--font-ui); font-size: var(--sz-md); line-height: var(--ln-md); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }

/* Themed thin scrollbars (WP-1) */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(146, 152, 164, 0.28); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(146, 152, 164, 0.48); border: 2px solid transparent; background-clip: content-box; }

/* ============================================================================
   DESIGN LAB SHELL (Outer Presentation Chrome)
   ============================================================================ */
.lab-top {
  position: sticky; top: 0; z-index: 100;
  background: var(--lab-surface); border-bottom: 1px solid var(--lab-border);
  padding: 10px 20px; display: flex; flex-direction: column; gap: 8px;
}
.lab-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lab-brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.lab-brand-mark {
  width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.lab-brand h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-strong); line-height: 18px; }
.lab-brand span { font-size: 11px; color: var(--text-muted); display: block; line-height: 14px; }

.lab-seg {
  display: inline-flex; background: var(--lab-card); border: 1px solid var(--lab-border);
  border-radius: 6px; padding: 2px; gap: 2px;
}
.lab-seg button {
  height: 24px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent;
  color: var(--text-secondary); font-size: 11.5px; font-weight: 500; transition: background 80ms var(--ease);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.lab-seg button:hover { color: var(--text-strong); background: var(--tonal-fill); }
.lab-seg button.is-on { background: var(--selection-strong); color: var(--text-accent); font-weight: 600; }
.lab-seg button.is-on.is-baseline { background: var(--error-surface); color: var(--error-surface-text); }
.lab-seg button.is-on.is-opt-b { background: var(--success-surface); color: var(--success-text); }

.lab-panels {
  display: flex; align-items: center; gap: 4px; overflow-x: auto; padding-bottom: 2px;
}
.lab-panel-btn {
  height: 28px; padding: 0 11px; border-radius: 6px; border: 1px solid transparent;
  background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.lab-panel-btn:hover { background: var(--tonal-fill); color: var(--text-strong); }
.lab-panel-btn.is-on {
  background: var(--lab-card); border-color: var(--control-border); color: var(--text-strong); font-weight: 600;
  box-shadow: inset 0 -2px 0 var(--accent);
}
.lab-panel-badge {
  font-size: 10px; padding: 0 5px; height: 15px; border-radius: 99px;
  display: inline-flex; align-items: center; font-weight: 600;
  background: var(--error-surface); color: var(--error-surface-text);
}
.lab-panel-badge.polish { background: var(--selection); color: var(--text-accent); }

.lab-stage { max-width: 1460px; margin: 16px auto 40px; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }

/* Sub-controls & Context Strip above Window */
.lab-context {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 9px 14px; border-radius: 8px; background: var(--lab-surface); border: 1px solid var(--lab-border);
  font-size: 12px;
}
.lab-context-desc { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.lab-mode-tag {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap;
  background: var(--selection-strong); color: var(--text-accent);
}
.lab-mode-tag.is-baseline { background: var(--error-surface); color: var(--error-surface-text); }
.lab-mode-tag.is-opt-b { background: var(--success-surface); color: var(--success-text); }
.lab-context-text { color: var(--text-secondary); }
.lab-context-text strong { color: var(--text-strong); font-weight: 600; }
.lab-subtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Simulated Varia Workbench Window */
.varia-win {
  height: 670px; background: var(--canvas); border: 1px solid var(--border-strong);
  border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--shadow-dialog); position: relative;
}
.varia-tabstrip {
  height: 36px; flex: none; background: var(--chrome); border-bottom: 1px solid var(--border);
  display: flex; align-items: stretch; padding: 0 8px 0 0; gap: 0; user-select: none;
}
.varia-doctab {
  display: flex; align-items: center; gap: 7px; padding: 0 12px; border-right: 1px solid var(--border);
  font-size: 12px; color: var(--text-muted); max-width: 260px; white-space: nowrap;
}
.varia-doctab.is-active {
  background: var(--canvas); color: var(--text-strong); font-weight: 500;
  box-shadow: inset 0 2px 0 var(--accent);
}
.varia-doctab .env-pill {
  font-size: 10px; font-weight: 600; padding: 0 5px; height: 15px; border-radius: 3px;
  display: inline-flex; align-items: center; background: rgba(230, 103, 103, 0.16);
  color: #f6b2b2; border: 1px solid rgba(230, 103, 103, 0.36);
}
[data-theme="light"] .varia-doctab .env-pill { color: #a11c2b; background: rgba(196, 43, 60, 0.1); border-color: rgba(196, 43, 60, 0.32); }
.varia-doctab .dirty-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.varia-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.varia-status {
  height: var(--h-status); flex: none; background: var(--chrome); border-top: 1px solid var(--border);
  padding: 0 10px; display: flex; align-items: center; gap: 10px; font-size: var(--sz-xs); color: var(--text-muted);
}
.varia-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }
.varia-status .sep { width: 1px; height: 12px; background: var(--separator); }
.varia-status .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* Callout Banner (toggleable) */
.callout-strip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 12px; font-size: 11.5px; line-height: 16px;
  background: var(--callout-bg); border-bottom: 1px solid var(--callout-border); color: var(--text);
}
.callout-strip.is-bug { background: var(--callout-bug-bg); border-bottom-color: var(--callout-bug-border); }
.callout-strip strong { color: var(--text-strong); font-weight: 600; }
.callout-tag {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 1px 6px; border-radius: 3px; background: var(--accent); color: var(--on-accent);
}
.callout-strip.is-bug .callout-tag { background: var(--error); color: #1b0a0c; }
[data-callouts="off"] .callout-strip, [data-callouts="off"] .inline-callout { display: none !important; }
.inline-callout {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px;
  font-size: 10.5px; font-weight: 600; background: var(--callout-bug-bg); border: 1px solid var(--callout-bug-border);
  color: var(--error-surface-text); white-space: nowrap;
}
.inline-callout.is-win { background: var(--callout-bg); border-color: var(--callout-border); color: var(--text-accent); }

/* Decision Cards below Window */
.lab-decisions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1020px) { .lab-decisions { grid-template-columns: 1fr; } }
.lab-card {
  background: var(--lab-surface); border: 1px solid var(--lab-border); border-radius: 8px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.lab-card.is-picked { border-color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
.lab-card.is-picked-b { border-color: var(--success); box-shadow: inset 0 2px 0 var(--success); }
.lab-card.is-picked-base { border-color: var(--error); box-shadow: inset 0 2px 0 var(--error); }
.lab-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lab-card h3 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--text-strong); }
.lab-card ul { margin: 0; padding-left: 16px; font-size: 12px; color: var(--text-secondary); line-height: 18px; }
.lab-card li + li { margin-top: 3px; }
.lab-card li strong { color: var(--text-strong); font-weight: 600; }

/* ============================================================================
   CALM PRO SHARED UI PRIMITIVES (DocumentHeader, ObjectInspectorFrame, Kit)
   ============================================================================ */
.ic { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; }
.ic-sm { width: 12px; height: 12px; }

.doc-frame { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); }
.doc-header {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: var(--canvas); border-bottom: 1px solid var(--border);
}
.doc-header.no-border { border-bottom: 0; padding-bottom: 6px; }
.doc-heading { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.doc-crumbs { display: flex; align-items: center; gap: 4px; font-size: var(--sz-xs); color: var(--text-muted); width: 100%; line-height: 14px; }
.doc-title { margin: 0; font-size: var(--sz-lg); line-height: var(--ln-lg); font-weight: 600; color: var(--text-strong); }
.doc-subtitle { font-size: var(--sz-sm); color: var(--text-muted); }
.doc-actions { display: flex; align-items: center; gap: 6px; flex: none; }

/* Buttons (Approach B Calm Chrome) */
.v-btn {
  height: var(--h-control); padding: 0 9px; border-radius: var(--rad-sm);
  border: 1px solid var(--control-border); background: transparent; color: var(--text);
  font-size: var(--sz-sm); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  transition: background 80ms var(--ease), border-color 80ms var(--ease);
}
.v-btn:hover:not(:disabled) { background: var(--hover); border-color: var(--control-border-hover); color: var(--text-strong); }
.v-btn:disabled { opacity: 0.45; cursor: default; }
.v-btn.ghost { border-color: transparent; color: var(--text-secondary); }
.v-btn.ghost:hover:not(:disabled) { background: var(--tonal-fill-hover); border-color: transparent; color: var(--text-strong); }
.v-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.v-btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.v-btn.danger { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); }
.v-btn.danger:hover:not(:disabled) { background: var(--error-surface); border-color: var(--error); color: var(--error-surface-text); }
.v-btn.sm { height: 22px; padding: 0 7px; font-size: var(--sz-xs); }
.v-btn.icon-only { width: var(--h-control); padding: 0; justify-content: center; }
.v-btn.is-pressed { background: var(--selection-strong); border-color: var(--accent); color: var(--text-accent); }
.v-split { display: inline-flex; }
.v-split > .v-btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.v-split > .v-btn:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; padding: 0 5px; }
.v-sep { width: 1px; height: 16px; background: var(--separator); margin: 0 2px; flex: none; }
.v-link { border: 0; background: none; padding: 0; color: var(--text-accent); font-size: inherit; display: inline-flex; align-items: center; gap: 4px; }
.v-link:hover { text-decoration: underline; }

/* Inputs & Selects */
.v-input, .v-select, .v-textarea {
  height: var(--h-control); padding: 0 8px; border-radius: var(--rad-sm);
  border: 1px solid var(--input-border); background: var(--input); color: var(--text);
  font-size: var(--sz-sm); outline: none; min-width: 0;
}
.v-input:focus, .v-select:focus, .v-textarea:focus { border-color: var(--focus); }
.v-textarea { height: auto; padding: 6px 8px; line-height: 18px; resize: vertical; }
.v-input.is-changed, .v-select.is-changed { font-weight: 600; border-color: color-mix(in srgb, var(--accent) 55%, var(--input-border)); }
.v-search {
  display: inline-flex; align-items: center; gap: 6px; height: var(--h-control);
  padding: 0 8px; border: 1px solid var(--input-border); border-radius: var(--rad-sm);
  background: var(--input); color: var(--text-muted); font-size: var(--sz-sm);
}
.v-search input { border: 0; background: transparent; outline: none; color: var(--text); width: 100%; min-width: 0; }

/* Status Pills & Live Pill */
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px;
  border-radius: var(--rad-pill); font-size: var(--sz-xs); font-weight: 500; white-space: nowrap;
}
.pill.sm { height: 18px; padding: 0 6px; font-size: 10.5px; }
.pill.ok { background: var(--success-surface); color: var(--success-text); }
.pill.err { background: var(--error-surface); color: var(--error-surface-text); }
.pill.warn { background: var(--warning-surface); color: var(--warning-surface-text); }
.pill.run { background: var(--selection-strong); color: var(--text-accent); }
.pill.mut { background: var(--raised); color: var(--text-muted); border: 1px solid var(--border); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* Segmented Control */
.seg {
  display: inline-flex; height: var(--h-control); border: 1px solid var(--control-border);
  border-radius: var(--rad-sm); overflow: hidden; background: var(--input);
}
.seg button {
  border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--text-secondary);
  padding: 0 9px; font-size: var(--sz-sm); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); color: var(--text-strong); }
.seg button.is-on { background: var(--selection-strong); color: var(--text-accent); font-weight: 600; }
.seg .cnt { font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.seg button.is-on .cnt { color: var(--text-accent); opacity: 0.85; }

/* Switch (from Options / Table Properties) */
.v-switch {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--sz-sm); color: var(--text-secondary);
  border: 0; background: none; padding: 0;
}
.v-switch-track {
  width: 30px; height: 16px; border-radius: 99px; background: var(--active); border: 1px solid var(--control-border);
  position: relative; transition: background 100ms var(--ease); flex: none;
}
.v-switch-track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--text-secondary); transition: transform 100ms var(--ease);
}
.v-switch.is-on .v-switch-track { background: var(--accent); border-color: var(--accent); }
.v-switch.is-on .v-switch-track::after { transform: translateX(14px); background: var(--on-accent); }

/* Hero KPI Strip (ObjectInspectorFrame OP-0) */
.kpi-strip {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding: 2px 16px 10px; font-size: var(--sz-sm); background: var(--canvas);
}
.kpi-item { display: inline-flex; align-items: baseline; gap: 6px; }
.kpi-label { font-size: var(--sz-xs); color: var(--text-muted); }
.kpi-val { font-weight: 600; color: var(--text-strong); }
.kpi-val.err { color: var(--error); }
.kpi-val.ok { color: var(--success); }
.kpi-val.acc { color: var(--text-accent); }
.kpi-sub { font-size: var(--sz-xs); color: var(--text-muted); }

/* Horizontal Inspector Tabs (ObjectInspectorFrame OP-0) */
.insp-tabbar {
  flex: none; display: flex; align-items: stretch; gap: 2px; padding: 0 12px;
  height: var(--h-tab); background: var(--canvas); border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.insp-tab {
  border: 0; background: transparent; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--sz-sm); color: var(--text-secondary); border-bottom: 2px solid transparent;
  margin-bottom: -1px; white-space: nowrap;
}
.insp-tab:hover { color: var(--text-strong); background: var(--tonal-fill); }
.insp-tab.is-on { color: var(--text-strong); font-weight: 600; border-bottom-color: var(--accent); }
.insp-tab .cnt {
  font-size: 10.5px; padding: 0 5px; height: 16px; border-radius: 99px;
  background: var(--raised); color: var(--text-muted); display: inline-flex; align-items: center;
  font-variant-numeric: tabular-nums;
}
.insp-tab.is-on .cnt { background: var(--selection-strong); color: var(--text-accent); }
.insp-tab .mod-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.insp-tab .err-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--error); }
.insp-tab .kidx { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); opacity: 0.65; }

/* Inspector Split + Resizable Vitals Rail */
.insp-split { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.insp-flow { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 14px 16px 20px; }
.insp-fill { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.insp-vitals {
  flex: none; min-width: 0; background: var(--sidebar);
  display: flex; flex-direction: column; min-height: 0;
}
.insp-vitals-head {
  height: var(--h-bar); flex: none; padding: 0 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--sz-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary);
}
.insp-vitals-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.vitals-block-title {
  margin: 0 0 6px; font-size: var(--sz-xs); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--text-tertiary);
}

/* Unified Group Eyebrow Heading (TableProperties / Options parity) */
.group-eyebrow {
  margin: 14px 0 6px; font-size: var(--sz-xs); line-height: var(--ln-xs); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: space-between;
}
.group-eyebrow:first-child { margin-top: 0; }

/* Unified PropertyField Grid (Strict 160px Label Column, zero saw-tooth) */
.pf-list { display: flex; flex-direction: column; gap: 6px; }
.pf-row { display: grid; grid-template-columns: 160px minmax(0, 420px); align-items: center; column-gap: 12px; min-height: var(--h-control); }
.pf-row.wide { grid-template-columns: 160px minmax(0, 1fr); }
.pf-row.top { align-items: start; }
.pf-label { font-size: var(--sz-sm); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.pf-row.is-changed .pf-label { color: var(--text-strong); font-weight: 600; }
.pf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.pf-ctrl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pf-ctrl > .v-input, .pf-ctrl > .v-select, .pf-ctrl > .v-textarea { width: 100%; }
.pf-two { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px; width: 100%; }
.pf-note { grid-column: 2; font-size: var(--sz-xs); color: var(--text-muted); margin-top: 2px; line-height: 15px; }

/* Two-column ultra-dense form (Option B) */
.pf-2col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; }
.pf-2col .pf-row { grid-template-columns: 112px minmax(0, 1fr); }
.pf-2col .pf-span2 { grid-column: 1 / -1; }

/* FactGrid (OP-0 Click-to-Copy Key/Value Grid) */
.fact-grid { display: grid; grid-template-columns: 160px minmax(0, 1fr); margin: 0; font-size: var(--sz-sm); }
.fact-grid.compact { grid-template-columns: 92px minmax(0, 1fr); font-size: var(--sz-xs); }
.fact-grid dt, .fact-grid dd {
  margin: 0; padding: 4px 0; border-bottom: 1px solid var(--border-subtle); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fact-grid dt { color: var(--text-muted); padding-right: 10px; }
.fact-grid dd { color: var(--text); display: flex; align-items: center; gap: 6px; }
.fact-grid dt:nth-last-of-type(1), .fact-grid dd:last-of-type { border-bottom: 0; }

/* Calm Pro Data Table (replaces broken unstyled .properties-table on <table>) */
.v-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--sz-sm); border: 1px solid var(--border); border-radius: var(--rad-sm); overflow: hidden; }
.v-table th {
  text-align: left; font-weight: 600; font-size: var(--sz-xs); color: var(--text-tertiary);
  background: var(--raised); height: 24px; padding: 0 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
.v-table td {
  height: var(--h-row); padding: 3px 10px; border-bottom: 1px solid var(--border-subtle);
  color: var(--text); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.v-table tbody tr:last-child td { border-bottom: 0; }
.v-table tbody tr:hover td { background: var(--hover); }
.v-table tbody tr.is-sel td { background: var(--selection-strong); color: var(--text-strong); }
.v-table tbody tr.is-dim td { color: var(--text-muted); }
.v-table tbody tr.is-err td:first-child { box-shadow: inset 2px 0 0 var(--error); }
.v-table tbody tr.is-run td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.v-table th.num, .v-table td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.v-table.borderless { border: 0; border-radius: 0; }

/* Script Drawer Footer (closed compact strip) */
.script-bar {
  flex: none; height: 28px; padding: 0 12px; border-top: 1px solid var(--border);
  background: var(--chrome); display: flex; align-items: center; gap: 8px;
  font-size: var(--sz-xs); color: var(--text-muted);
}
.script-bar strong { color: var(--text-secondary); font-weight: 600; }

/* ============================================================================
   BASELINE (TODAY) SIMULATION HELPERS — Shows actual current codebase defects
   ============================================================================ */
.legacy-doc-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.legacy-nav {
  flex: 0 0 176px; border-right: 1px solid var(--border); padding: 8px 0;
  display: flex; flex-direction: column; background: var(--canvas);
}
.legacy-nav-item {
  height: 24px; padding: 0 12px; border: 0; background: transparent; text-align: left;
  font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between;
}
.legacy-nav-item.is-on { background: var(--selection); color: var(--text-strong); box-shadow: inset 2px 0 0 var(--accent); }
.legacy-sections { flex: 1; min-width: 0; overflow-y: auto; padding: 0 16px 20px; }
.legacy-sec { padding-top: 12px; }
.legacy-sec + .legacy-sec { margin-top: 12px; border-top: 1px solid var(--border); }
.legacy-sec h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--text-strong); }
.legacy-raw-table { border-collapse: separate; border-spacing: 2px; font-size: 12px; margin: 4px 0; }
.legacy-raw-table th { text-align: center; font-weight: 700; padding: 2px 6px; }
.legacy-raw-table td { padding: 2px 6px; }
.legacy-btn {
  height: 26px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--legacy-border);
  background: transparent; color: var(--text); font-size: 12px; display: inline-flex; align-items: center; gap: 5px;
}
.legacy-scroll-box {
  border: 1px solid var(--border); overflow-y: auto; border-radius: 4px;
}

/* ============================================================================
   PANEL-SPECIFIC LAYOUTS
   ============================================================================ */

/* Resizable Vertical Sash (mirrors ObjectInspectorFrame .inspector-vitals-sash) */
.v-sash {
  flex: none; width: 5px; margin: 0 -2px; position: relative; z-index: 6;
  cursor: col-resize; touch-action: none; user-select: none; outline: none;
}
.v-sash::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
  background: var(--border); transition: background 80ms var(--ease), width 80ms var(--ease), left 80ms var(--ease);
}
.v-sash:hover::after, .v-sash:focus-visible::after, .v-sash.is-dragging::after {
  background: var(--accent); width: 2px; left: 1.5px;
}
.sash-hud {
  position: fixed; z-index: 200; pointer-events: none;
  padding: 2px 7px; border-radius: 4px; background: var(--overlay);
  border: 1px solid var(--accent); color: var(--text-strong);
  font-family: var(--font-mono); font-size: 11px; box-shadow: var(--shadow-popover);
  display: none; white-space: nowrap;
}
.sash-hud.is-show { display: block; }

/* --- 1. JOB DOCUMENT: STEPS & HISTORY --- */
.steps-fill { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.steps-list-pane {
  flex: none; min-width: 0; background: var(--sidebar);
  display: flex; flex-direction: column; min-height: 0;
}
.steps-list-head {
  height: var(--h-bar); flex: none; padding: 0 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.steps-list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.step-card {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "no name badge" "no flow flow";
  gap: 3px 7px; padding: 6px 8px; border-radius: var(--rad-sm); border: 1px solid transparent;
  background: transparent; text-align: left; width: 100%;
}
.step-card:hover { background: var(--hover); }
.step-card.is-sel { background: var(--selection-strong); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.step-no {
  grid-area: no; width: 20px; height: 20px; border-radius: 4px; background: var(--raised);
  color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  display: grid; place-items: center; margin-top: 1px;
}
.step-card.is-sel .step-no { background: var(--accent); color: var(--on-accent); }
.step-name { grid-area: name; font-size: var(--sz-sm); font-weight: 500; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-badge { grid-area: badge; display: flex; gap: 4px; align-items: center; }
/* Balanced 3-column flow grid: fixed 44px type badge + two equal 1fr outcome columns so ✓ and ✗ align cleanly across all steps */
.step-flow {
  grid-area: flow; display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr);
  align-items: center; column-gap: 8px; font-size: 11px; line-height: 16px; color: var(--text-muted);
}
.step-flow.sched-meta { grid-template-columns: minmax(0, 1fr) auto; }
.step-flow .ok, .step-flow .bad {
  display: inline-flex; align-items: center; gap: 3px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.step-flow .ok { color: var(--success); }
.step-flow .bad { color: var(--error); }
.step-flow .glyph { flex: none; font-weight: 600; }
.step-flow .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-type-tag {
  font-family: var(--font-mono); font-size: 10px; line-height: 16px; height: 16px; width: 44px;
  text-align: center; border-radius: 3px; background: var(--raised); color: var(--text-tertiary);
  border: 1px solid var(--border-subtle); flex: none;
}

.step-edit-pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.step-edit-head {
  flex: none; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--canvas);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.step-edit-meta { flex: none; padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 6px; }
.step-cmd-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.step-cmd-bar {
  flex: none; height: 30px; padding: 0 14px; background: var(--raised); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; font-size: var(--sz-xs); color: var(--text-secondary);
}
.monaco-mock {
  flex: 1; min-height: 0; overflow: auto; background: var(--input); padding: 8px 0;
  font-family: var(--font-mono); font-size: 12px; line-height: 19px;
}
.monaco-line { display: flex; padding: 0 12px 0 0; }
.monaco-ln { width: 38px; text-align: right; padding-right: 12px; color: var(--icon-muted); user-select: none; flex: none; }
.monaco-code { white-space: pre; color: var(--text); }
.syn-kw { color: var(--syn-kw); font-weight: 500; }
.syn-str { color: var(--syn-str); }
.syn-cmt { color: var(--syn-cmt); font-style: italic; }
.syn-num { color: var(--syn-num); }
.syn-fn { color: var(--syn-fn); }
.step-edit-foot {
  flex: none; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--canvas);
  display: flex; flex-direction: column; gap: 6px;
}
.step-flow-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.step-flow-cell { display: flex; align-items: center; gap: 8px; font-size: var(--sz-xs); color: var(--text-secondary); }
.step-flow-cell .v-select { flex: 1; }

/* Job History Fill Layout */
.hist-top-bar {
  flex: none; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--raised);
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.spark-bars { display: flex; align-items: flex-end; gap: 3px; height: 26px; width: 170px; position: relative; }
.spark-bars::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 13px; border-top: 1px dashed var(--text-muted); opacity: 0.65;
}
.spark-bars i { flex: 1; border-radius: 1.5px 1.5px 0 0; background: var(--chart-blue); opacity: 0.8; }
.spark-bars i.is-fail { background: var(--error); opacity: 0.95; }
.hist-split { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.hist-runs-list { flex: none; min-width: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: var(--sidebar); }
.hist-run-item {
  border: 0; background: transparent; border-radius: var(--rad-sm); padding: 6px 8px; text-align: left;
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 6px; width: 100%;
}
.hist-run-item:hover { background: var(--hover); }
.hist-run-item.is-sel { background: var(--selection-strong); }
.hist-run-when { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-strong); }
.hist-run-dur { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); text-align: right; }
.hist-run-sub { grid-column: 2 / 4; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-detail-pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.hist-detail-top { flex: none; padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.hist-msg-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.hist-msg-head {
  flex: none; height: 30px; padding: 0 14px; background: var(--raised); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; font-size: var(--sz-xs);
}
.hist-msg-pre {
  flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 10px 14px;
  background: var(--input); font-family: var(--font-mono); font-size: 12px; line-height: 18px;
  white-space: pre-wrap; color: var(--text);
}

/* --- 2. JOB ACTIVITY MONITOR --- */
.jam-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 10px 16px 4px; flex: none; }
.jam-tile {
  border: 1px solid var(--border); border-radius: var(--rad-lg); background: var(--raised);
  padding: 8px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px;
}
.jam-tile:hover { border-color: var(--control-border-hover); }
.jam-tile.is-on { border-color: var(--accent); background: var(--selection); }
.jam-tile .tl { font-size: var(--sz-xs); color: var(--text-muted); }
.jam-tile .tv { font-size: var(--sz-xl); line-height: var(--ln-xl); font-weight: 600; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.jam-tile .tv.err { color: var(--error); }
.jam-tile .tv.acc { color: var(--accent); }
.jam-tile .tv.warn { color: var(--warning); }

/* Option B Ultra-Dense Unified KPI Filter Bar */
.jam-dense-bar {
  flex: none; min-height: var(--h-bar); padding: 6px 14px; border-bottom: 1px solid var(--border);
  background: var(--canvas); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.kpi-chip {
  height: var(--h-control); padding: 0 9px; border-radius: var(--rad-sm);
  border: 1px solid var(--border); background: var(--raised); color: var(--text-secondary);
  font-size: var(--sz-xs); display: inline-flex; align-items: center; gap: 6px;
}
.kpi-chip:hover { border-color: var(--control-border-hover); color: var(--text-strong); }
.kpi-chip.is-on { background: var(--selection-strong); border-color: var(--accent); color: var(--text-accent); font-weight: 600; }
.kpi-chip b { font-family: var(--font-mono); font-size: 12px; color: var(--text-strong); }
.kpi-chip.err b { color: var(--error); }
.kpi-chip.acc b { color: var(--accent); }
.kpi-chip.warn b { color: var(--warning); }

.jam-toolbar {
  flex: none; padding: 6px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border-subtle);
}
.jam-sel-bar {
  flex: none; padding: 5px 16px; background: var(--selection); border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  display: flex; align-items: center; gap: 6px; font-size: var(--sz-sm);
}
.jam-grid-wrap { flex: 1; min-height: 0; overflow: auto; }
.jam-drawer {
  flex: none; height: 176px; border-top: 2px solid var(--border-strong); background: var(--canvas);
  display: flex; flex-direction: column; min-height: 0;
}
.jam-drawer-head {
  flex: none; height: 30px; padding: 0 12px; background: var(--raised); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; font-size: var(--sz-xs);
}
.jam-drawer-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }

/* --- 3. LOG FILE VIEWER --- */
.lfv-layout { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.lfv-rail {
  flex: none; min-width: 0; background: var(--sidebar);
  display: flex; flex-direction: column; min-height: 0;
}
.lfv-rail-top { flex: none; padding: 8px; border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 6px; }
.lfv-rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0; }
.lfv-group-hdr {
  padding: 4px 10px; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--text-tertiary); display: flex; align-items: center; justify-content: space-between;
}
.lfv-src {
  height: var(--h-row); padding: 0 10px; display: flex; align-items: center; gap: 7px;
  font-size: var(--sz-sm); color: var(--text); cursor: pointer;
}
.lfv-src:hover { background: var(--hover); }
.lfv-src.indent { padding-left: 24px; }
.lfv-src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.lfv-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.lfv-bottom {
  flex: none; height: 212px; border-top: 2px solid var(--border-strong);
  display: flex; min-height: 0; overflow: hidden;
}

/* --- 4. SCHEDULES & TIMELINE --- */
.sched-split { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.sched-grid-pane { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
.sched-detail-pane {
  flex: none; min-width: 0; background: var(--sidebar);
  display: flex; flex-direction: column; min-height: 0;
}
.sched-detail-head {
  flex: none; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--canvas);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.sched-detail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.sched-sentence {
  padding: 8px 10px; border-radius: var(--rad-sm); background: var(--selection);

  font-size: var(--sz-sm); color: var(--text-strong); line-height: 17px;
}
.sched-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sched-card {
  padding: 8px 10px; border-radius: var(--rad-sm); border: 1px solid var(--border); background: var(--canvas);
  display: flex; flex-direction: column; gap: 4px;
}
.sched-card h4 { margin: 0 0 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); display: flex; justify-content: space-between; }

.tl-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.tl-grid { flex: 1; min-height: 0; overflow-y: auto; background: var(--canvas); }

.tl-row.head { height: 24px; background: var(--raised); position: sticky; top: 0; z-index: 2; border-bottom-color: var(--border); font-size: var(--sz-xs); color: var(--text-tertiary); }
.tl-name { flex: 0 0 270px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--border); font-size: var(--sz-sm); overflow: hidden; }
.tl-name b { font-weight: 500; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-name small { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
.tl-lane { flex: 1; position: relative; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(12.5% - 1px), var(--border-subtle) calc(12.5% - 1px), var(--border-subtle) 12.5%); }
.tl-tick { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 5px; font-family: var(--font-mono); font-size: 10.5px; }
.tl-bar { position: absolute; top: 6px; height: 15px; border-radius: 3px; background: var(--chart-blue); opacity: 0.82; }
.tl-bar.ov { background: var(--warning); opacity: 1; }
.tl-bar.off { background: transparent; border: 1px dashed var(--text-muted); opacity: 0.7; }
.tl-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--error); z-index: 2; }
.tl-overlap-drawer {
  flex: none; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--warning-surface);

.ov-check {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) 156px; column-gap: 10px; row-gap: 2px;

.ov-check-icon { grid-row: span 2; align-self: start; padding-top: 2px; }
.ov-check-title { font-size: var(--sz-sm); font-weight: 600; color: var(--text-strong); }
.ov-check-detail { grid-column: 2; font-size: var(--sz-xs); color: var(--text-secondary); line-height: 17px; }
.ov-check-fix { grid-column: 3; grid-row: 1 / 3; display: flex; justify-content: flex-end; }
.ov-obj-chip {
  display: inline-flex; align-items: center; padding: 0 6px; height: 17px; border-radius: 4px;
  background: var(--raised); border: 1px solid var(--border); color: var(--text-accent);
  font-size: 11px; margin: 0 2px; vertical-align: baseline;
}
.ov-obj-chip:hover { border-color: var(--accent); background: var(--selection); }

/* --- 6. OPERATORS MATRIX --- */
.matrix-cell {
  width: 34px; height: 22px; border-radius: 4px; border: 1px solid transparent; background: transparent;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-muted);
  display: inline-grid; place-items: center;
}
.matrix-cell:hover { background: var(--hover); color: var(--text-strong); }
.matrix-cell.is-set { background: var(--selection); color: var(--text-accent); }
.matrix-cell.is-changed { border-color: var(--warning); background: var(--warning-surface); color: var(--warning-surface-text); }

/* --- 8. AGENT PROPERTIES MODAL --- */
.modal-scrim {
  flex: 1; min-height: 0; background: rgba(8, 10, 14, 0.56); display: grid; place-items: center; padding: 18px;
}
.modal-win {
  width: 760px; max-width: 100%; height: 550px; background: var(--overlay);
  border: 1px solid var(--control-border); border-radius: var(--rad-lg);
  box-shadow: var(--shadow-dialog); display: flex; flex-direction: column; overflow: hidden;
}
.modal-head {
  height: var(--h-header); padding: 0 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; color: var(--text-strong);
}
.modal-foot {
  padding: 10px 14px; border-top: 1px solid var(--border); background: var(--chrome);
  display: flex; align-items: center; gap: 8px; justify-content: flex-end;
}
.ratio-track { height: 7px; border-radius: 4px; background: var(--raised); overflow: hidden; display: flex; gap: 2px; }
.ratio-seg { height: 100%; border-radius: 2px; }

/* Warning banner */
.v-banner {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 16px;
  background: var(--warning-surface); color: var(--warning-surface-text);
  border-bottom: 1px solid color-mix(in srgb, var(--warning) 35%, transparent); font-size: var(--sz-sm);

/* Helper chip pills inside forms */
.op-chip {

}
.op-chip .m.is-on { background: var(--selection-strong); color: var(--text-accent); }

// ============================================================================
// INTERACTIVE SASH RESIZER (Pointer drag + Keyboard + Dbl-click reset + localStorage)
// ============================================================================
function clampRail(key, next, containerWidth) {
  const spec = RAIL_SPECS[key];
  const dynamicMax = containerWidth > 0 ? Math.max(spec.min, Math.min(spec.max, containerWidth - spec.minOther)) : spec.max;
  return Math.round(Math.min(dynamicMax, Math.max(spec.min, next)));
}

function wireSashes() {
  const hud = document.getElementById('sash-hud');
  const root = document.getElementById('varia-body');
  if (!root || typeof root.querySelectorAll !== 'function') return;
  root.querySelectorAll('[data-sash]').forEach(sash => {
    const key = sash.dataset.sash;
    const spec = RAIL_SPECS[key];
    const parent = sash.parentElement;
    const rail = parent && parent.querySelector(`[data-rail="${key}"]`);
    if (!spec || !rail) return;

    const applyWidth = (px, persist) => {
      const clamped = clampRail(key, px, parent.clientWidth);
      state.widths[key] = clamped;
      rail.style.width = clamped + 'px';
      sash.setAttribute('aria-valuenow', String(clamped));
      if (persist) saveRailWidths(state.widths);
      return clamped;
    };

    sash.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      sash.classList.add('is-dragging');
      sash.setPointerCapture(ev.pointerId);
      const startX = ev.clientX;
      const startW = rail.getBoundingClientRect().width || railW(key);
      let latest = startW;

      const showHud = (x, y, w) => {
        if (!hud) return;
        hud.textContent = `${w} px (min ${spec.min} · dbl-click resets)`;
        hud.style.left = Math.min(window.innerWidth - 220, x + 12) + 'px';
        hud.style.top = Math.max(8, y - 28) + 'px';
        hud.classList.add('is-show');
      };
      showHud(ev.clientX, ev.clientY, Math.round(startW));

      const onMove = mv => {
        const delta = mv.clientX - startX;
        const next = spec.side === 'left' ? startW + delta : startW - delta;
        latest = applyWidth(next, false);
        showHud(mv.clientX, mv.clientY, latest);
      };
      const onUp = () => {
        sash.classList.remove('is-dragging');
        if (hud) hud.classList.remove('is-show');
        sash.removeEventListener('pointermove', onMove);
        sash.removeEventListener('pointerup', onUp);
        sash.removeEventListener('pointercancel', onUp);
        saveRailWidths(state.widths);
      };
      sash.addEventListener('pointermove', onMove);
      sash.addEventListener('pointerup', onUp);
      sash.addEventListener('pointercancel', onUp);
    });

    sash.addEventListener('dblclick', () => {
      applyWidth(spec.def, true);
    });

    sash.addEventListener('keydown', ev => {
      if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
      const step = ev.shiftKey ? 24 : 12;
      if (ev.key === 'Home') { ev.preventDefault(); applyWidth(spec.def, true); return; }
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        const dir = ev.key === 'ArrowRight' ? 1 : -1;
        const delta = spec.side === 'left' ? dir * step : -dir * step;
        applyWidth(railW(key) + delta, true);
      }
    });
  });
}

// Wire top controls
