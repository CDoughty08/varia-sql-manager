<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="compact" data-borders="calm" data-mode="after" data-pins="off">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Varia SQL Manager — Workbench Polish Mock</title>
<style>
/* ============================================================================
   VARIA SQL MANAGER — CALM PRO TOKENS (mirrors src/shared/theme/palette.ts & metrics.ts)
   ============================================================================ */
:root {
  --font-ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;

  /* Metrics — Compact (default) */
  --h-header: 40px;
  --h-bar: 36px;
  --h-doc-tab: 40px;
  --h-control: 26px;
  --h-row: 22px;
  --h-status: 24px;
  --rad-sm: 4px;
  --rad-lg: 8px;
  --rad-pill: 999px;
  --ease: cubic-bezier(0.2, 0, 0, 1);

  /* Dark Palette (Varia Dark exact values) */
  --canvas: #16181d;
  --panel: #16181d;
  --sidebar: #111317;
  --chrome: #111317;
  --raised: #1c1f25;
  --overlay: #1d2026;
  --input: #101216;
  --hover: #262a32;
  --active: #30343e;
  --selection: #21273b;
  --selection-strong: #29314f;
  --accent-surface: #232842;
  --text-selection: #2f3b66;

  --text: #d9dce3;
  --text-strong: #f5f6f8;
  --text-secondary: #bcc1cb;
  --text-tertiary: #a3a9b5;
  --text-muted: #9298a4;
  --text-accent: #bcc5ff;

  --border: #262a31;
  --border-subtle: #1f2228;
  --border-strong: #2e323a;
  --separator: #30343c;

  /* Resting border calibration (overridden by data-borders) */
  --control-border: #3a404d;
  --control-border-hover: #525a6c;
  --input-border: #3a404d;
  --tonal-fill: rgba(255, 255, 255, 0.045);
  --tonal-fill-hover: rgba(255, 255, 255, 0.08);
  --tree-guide: #232730;

  --accent: #8f9cff;
  --accent-hover: #a8b2ff;
  --on-accent: #0e1230;
  --focus: #8f9cff;

  --error: #f39a9a;
  --error-surface: #3a1d22;
  --error-surface-text: #f6bcc1;
  --warning: #e4bb6a;
  --warning-surface: #33291a;
  --warning-surface-text: #f0d49e;
  --success: #74d19c;
  --success-surface: rgba(116, 209, 156, 0.14);
  --success-text: #a6e8bf;

  --icon: #a3a9b5;
  --icon-muted: #7f8694;
  --icon-folder: #bfa878;

  --red: #e66767;
  --red-pill-bg: rgba(230, 103, 103, 0.16);
  --red-pill-border: rgba(230, 103, 103, 0.38);
  --red-pill-text: #f6b2b2;
  --blue: #6ea4ea;
  --blue-pill-bg: rgba(110, 164, 234, 0.16);
  --blue-pill-border: rgba(110, 164, 234, 0.36);
  --blue-pill-text: #b7d3fa;
  --purple: #ab95ea;
  --chart-blue: #3987e5;
  --chart-purple: #9085e9;
  --chart-yellow: #c98500;
  --chart-green: #199e70;

  --syn-kw: #93a4ff;
  --syn-str: #9fd4a9;
  --syn-cmt: #868e9b;
  --syn-num: #e8b97d;
  --syn-fn: #d4a9f2;
  --syn-op: #9ea6b4;

  --grid-alt: rgba(217, 220, 227, 0.02);
  --shadow-popover: 0 8px 24px rgba(0, 0, 0, 0.52);
  --shadow-menu: 0 4px 12px rgba(0, 0, 0, 0.44);

  /* Outer lab page chrome */
  --lab-bg: #0b0d11;
  --lab-surface: #12151c;
  --lab-card: #161922;
  --lab-border: #232836;
}

[data-theme="light"] {
  --canvas: #ffffff;
  --panel: #ffffff;
  --sidebar: #f7f8fa;
  --chrome: #f7f8fa;
  --raised: #f1f3f6;
  --overlay: #ffffff;
  --input: #ffffff;
  --hover: #dfe2e7;
  --active: #d6dae0;
  --selection: #e7ebfc;
  --selection-strong: #d9e0fb;
  --accent-surface: #dde1f9;
  --text-selection: #c8d2fa;

  --text: #1c1f26;
  --text-strong: #0a0c10;
  --text-secondary: #3a404b;
  --text-tertiary: #4d5461;
  --text-muted: #5c6370;
  --text-accent: #3240b0;

  --border: #e3e6eb;
  --border-subtle: #eceef2;
  --border-strong: #d4d8df;
  --separator: #dcdfe5;

  --control-border: #c2c8d4;
  --control-border-hover: #9aa3b4;
  --input-border: #c2c8d4;
  --tonal-fill: rgba(15, 23, 42, 0.04);
  --tonal-fill-hover: rgba(15, 23, 42, 0.075);
  --tree-guide: #e2e5ec;

  --accent: #4453d0;
  --accent-hover: #3744b8;
  --on-accent: #ffffff;
  --focus: #4453d0;

  --error: #b42229;
  --error-surface: #fdecec;
  --error-surface-text: #8f1d24;
  --warning: #875800;
  --warning-surface: #fff5dc;
  --warning-surface-text: #6b4400;
  --success: #146f3b;
  --success-surface: rgba(20, 111, 59, 0.11);
  --success-text: #0f5a2f;

  --icon: #4d5461;
  --icon-muted: #6b7280;
  --icon-folder: #8a6d33;

  --red: #c42b3c;
  --red-pill-bg: rgba(196, 43, 60, 0.1);
  --red-pill-border: rgba(196, 43, 60, 0.34);
  --red-pill-text: #a11c2b;
  --blue: #2563a8;
  --blue-pill-bg: rgba(37, 99, 168, 0.1);
  --blue-pill-border: rgba(37, 99, 168, 0.32);
  --blue-pill-text: #1c4e8a;
  --purple: #7a4bbf;
  --chart-blue: #2a78d6;
  --chart-purple: #6250d6;
  --chart-yellow: #a87200;
  --chart-green: #12936a;

  --syn-kw: #3442c2;
  --syn-str: #2c7440;
  --syn-cmt: #636a76;
  --syn-num: #965700;
  --syn-fn: #8338b4;
  --syn-op: #575e6b;

  --grid-alt: rgba(28, 31, 38, 0.022);
  --shadow-popover: 0 8px 24px rgba(16, 24, 40, 0.15);
  --shadow-menu: 0 4px 12px rgba(16, 24, 40, 0.12);

  --lab-bg: #eef1f6;
  --lab-surface: #f8f9fc;
  --lab-card: #ffffff;
  --lab-border: #d8dde6;
}

/* Density override (mirrors metrics.ts comfortable) */
[data-density="comfortable"] {
  --h-header: 44px;
  --h-bar: 40px;
  --h-doc-tab: 44px;
  --h-control: 28px;
  --h-row: 26px;
  --h-status: 26px;
}

/* Border contrast calibration
   - wcag3 (Approach A): keeps input.border & button.border >= 3:1 (WCAG 1.4.11, passing tests/theme-contrast.test.ts),
     uses commandCenter.border at 45% alpha (registry.ts:53), and removes wireframe box borders from resting toolbars.
   - calm (Approach B): relaxes resting input/control borders below 3:1 (~1.6:1), keeping 3:1 on focus/hover.
   - current: today's full wireframe baseline (#6a7184 / #878e9b + boxed toolbar groups). */
[data-borders="wcag3"][data-theme="dark"] {
  --control-border: #646b7d;
  --control-border-hover: #7c8499;
  --input-border: #646b7d;
  --cmd-border: rgba(100, 107, 125, 0.45);
}
[data-borders="wcag3"][data-theme="light"] {
  --control-border: #878e9b;
  --control-border-hover: #6d7482;
  --input-border: #878e9b;
  --cmd-border: rgba(135, 142, 155, 0.45);
}
[data-borders="calm"][data-theme="dark"] {
  --control-border: #3a404d;
  --control-border-hover: #525a6c;
  --input-border: #3a404d;
  --cmd-border: #3a404d;
}
[data-borders="calm"][data-theme="light"] {
  --control-border: #c2c8d4;
  --control-border-hover: #9aa3b4;
  --input-border: #c2c8d4;
  --cmd-border: #c2c8d4;
}
[data-borders="current"][data-theme="dark"] {
  --control-border: #6b7286;
  --input-border: #6a7184;
  --cmd-border: rgba(107, 114, 134, 0.45);
  --tonal-fill: transparent;
}
[data-borders="current"][data-theme="light"] {
  --control-border: #878e9b;
  --input-border: #878e9b;
  --cmd-border: rgba(135, 142, 155, 0.45);
  --tonal-fill: transparent;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--text);
  background: var(--lab-bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; background: transparent; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: 0.42; }

/* Themed thin scrollbars (toggled off in baseline mode for comparison!) */
.themed-scroll ::-webkit-scrollbar,
.themed-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.themed-scroll ::-webkit-scrollbar-track,
.themed-scroll::-webkit-scrollbar-track { background: transparent; }
.themed-scroll ::-webkit-scrollbar-thumb,
.themed-scroll::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: content-box;
}
.themed-scroll ::-webkit-scrollbar-thumb:hover,
.themed-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-muted); border: 2px solid transparent; background-clip: content-box; }
.themed-scroll ::-webkit-scrollbar-corner { background: transparent; }

/* ============================================================================
   LAB SHELL (TOP CONTROL BAR + SCENARIO STRIP + STAGE + CONFIGURATOR)
   ============================================================================ */
.lab-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.lab-topbar {
  position: sticky; top: 0; z-index: 900;
  background: var(--lab-surface);
  border-bottom: 1px solid var(--lab-border);
  padding: 8px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
}

.lab-brand {
  display: flex; align-items: center; gap: 9px;
  margin-right: 4px;
}
.lab-brand-mark {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--accent-surface); color: var(--accent);
  display: grid; place-items: center;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
}
.lab-brand-title { font-weight: 600; font-size: 13px; color: var(--text-strong); letter-spacing: -0.01em; }
.lab-brand-sub { font-size: 11px; color: var(--text-muted); padding: 1px 6px; border-radius: 99px; background: var(--tonal-fill); border: 1px solid var(--lab-border); }

.lab-seg {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px; border-radius: 6px;
  background: var(--lab-bg);
  border: 1px solid var(--lab-border);
}
.lab-seg button {
  height: 24px; padding: 0 9px; border-radius: 4px;
  font-size: 11.5px; font-weight: 500; color: var(--text-muted);
  transition: background 90ms var(--ease), color 90ms var(--ease);
  white-space: nowrap;
}
.lab-seg button:hover { color: var(--text-strong); }
.lab-seg button.is-active {
  background: var(--selection-strong);
  color: var(--text-accent);
  font-weight: 600;
}

.lab-spacer { flex: 1; }

.lab-pill-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px; border-radius: 6px;
  font-size: 11.5px; font-weight: 500;
  background: var(--lab-card);
  border: 1px solid var(--lab-border);
  color: var(--text-secondary);
  transition: background 90ms var(--ease), border-color 90ms var(--ease), color 90ms var(--ease);
}
.lab-pill-btn:hover { background: var(--hover); color: var(--text-strong); }
.lab-pill-btn.is-on {
  background: var(--accent-surface);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--text-accent);
}

.lab-subbar {
  background: color-mix(in srgb, var(--lab-surface) 75%, var(--lab-bg));
  border-bottom: 1px solid var(--lab-border);
  padding: 6px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
}
.lab-subbar-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted);
}

.lab-telemetry {
  display: inline-flex; align-items: center; gap: 8px;
  margin-left: auto;
  font-size: 11.5px; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.tel-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
  background: var(--success-surface); color: var(--success-text);
}
.tel-badge.is-neutral { background: var(--tonal-fill); color: var(--text-secondary); border: 1px solid var(--lab-border); }

/* Main workspace + right configurator layout */
.lab-body {
  display: flex;
  flex: 1;
  min-height: 0;
  align-items: flex-start;
}

.lab-stage {
  flex: 1;
  min-width: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.stage-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
[data-mode="compare"] .stage-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (max-width: 1320px) {
  [data-mode="compare"] .stage-grid { grid-template-columns: 1fr; }
}
[data-mode="after"] .before-panel { display: none; }
[data-mode="before"] .after-panel { display: none; }

.stage-card {
  background: var(--lab-card);
  border: 1px solid var(--lab-border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
}
.stage-card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 12px;
  background: var(--lab-surface);
  border-bottom: 1px solid var(--lab-border);
  font-size: 11.5px; color: var(--text-secondary);
}
.stage-card-head strong { color: var(--text-strong); font-weight: 600; }
.stage-card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }

.before-img-wrap {
  background: #0d0f14;
  display: flex; align-items: center; justify-content: center;
  min-height: 540px;
  overflow: auto;
}
.before-img-wrap img {
  display: block; max-width: 100%; height: auto;
}

/* ============================================================================
   MOCK WORKBENCH FRAME
   ============================================================================ */
.wb-viewport {
  display: flex;
  justify-content: center;
  background: var(--lab-bg);
  padding: 10px;
  overflow-x: auto;
}
.wb-window {
  position: relative;
  width: 100%;
  max-width: 1380px;
  min-width: 960px;
  height: 700px;
  background: var(--canvas);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  transition: max-width 220ms var(--ease);
}
.wb-window.is-narrow {
  max-width: 980px;
  min-width: 920px;
}

/* --- 1. TITLE BAR --- */
.wb-titlebar {
  height: var(--h-header);
  flex-shrink: 0;
  background: var(--chrome);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 0 0 10px;
  gap: 8px;
  user-select: none;
}
.wb-tb-left { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.wb-brand-icon {
  width: 24px; height: 24px; display: grid; place-items: center;
  color: var(--accent); margin-right: 2px;
}
.wb-menus { display: flex; align-items: center; gap: 1px; }
.wb-menus button {
  height: 26px; padding: 0 7px; border-radius: var(--rad-sm);
  font-size: 12px; color: var(--text-secondary);
}
.wb-menus button:hover { background: var(--hover); color: var(--text-strong); }

.wb-tb-center {
  flex: 1; display: flex; justify-content: center; min-width: 140px;
}
.wb-cmd-centre {
  width: min(410px, 100%);
  height: var(--h-control);
  padding: 0 8px 0 10px;
  border-radius: var(--rad-sm);
  background: var(--input);
  border: 1px solid var(--cmd-border, var(--input-border));
  color: var(--text-muted);
  display: flex; align-items: center; gap: 7px;
  font-size: 12px;
  transition: border-color 90ms var(--ease), background 90ms var(--ease);
}
.wb-cmd-centre:hover { border-color: var(--control-border-hover); color: var(--text-secondary); }
.wb-cmd-centre span { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb-kbd {
  display: inline-flex; align-items: center; justify-content: center;
  height: 18px; padding: 0 5px; border-radius: 3px;
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 500;
  color: var(--text-muted);
  background: var(--tonal-fill);
  border: 1px solid var(--separator);
}

.wb-tb-actions {
  display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding-right: 4px;
}
.wb-tb-sep {
  width: 1px; height: 15px; background: var(--separator); margin: 0 4px;
}
.wb-tb-actions.is-ungrouped .wb-tb-sep { display: none; }

.wb-icon-btn {
  position: relative;
  width: 26px; height: 26px; border-radius: var(--rad-sm);
  display: inline-grid; place-items: center;
  color: var(--icon);
  transition: background 80ms var(--ease), color 80ms var(--ease);
}
.wb-icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text-strong); }
.wb-icon-btn.is-active { background: var(--selection); color: var(--text-accent); }
.wb-icon-btn .save-badge {
  position: absolute; top: 4px; right: 4px; width: 5px; height: 5px;
  border-radius: 50%; background: var(--accent);
}
.wb-tb-actions.is-ungrouped .save-badge { display: none; }

.wb-win-controls {
  display: flex; align-items: stretch; height: 100%; margin-left: 6px;
}
.wb-win-controls span {
  width: 40px; display: grid; place-items: center; color: var(--text-muted); font-size: 11px;
}
.wb-win-controls span:hover { background: var(--hover); color: var(--text-strong); }
.wb-win-controls span.win-close:hover { background: #c42b1c; color: #fff; }

/* --- 2. WORKBENCH BODY (OE + MAIN) --- */
.wb-main-split {
  flex: 1; min-height: 0;
  display: flex;
}

/* OBJECT EXPLORER */
.wb-oe {
  width: var(--oe-w, 260px);
  flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.wb-oe-header {
  height: var(--h-doc-tab);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 2px;
  padding: 0 6px 0 11px;
  border-bottom: 1px solid var(--border);
}
.wb-oe-title {
  flex: 1; min-width: 0;
  font-size: 11px; font-weight: 600;
  color: var(--text-tertiary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wb-oe-tools { display: flex; align-items: center; gap: 1px; }

/* Baseline 2-row wrapped OE header */
.wb-oe.oe-current .wb-oe-header {
  height: auto;
  display: grid;
  grid-template: "title menu" 30px "tools tools" 28px / 1fr auto;
  padding: 2px 6px 4px 10px;
  gap: 0;
}
.wb-oe.oe-current .wb-oe-title { grid-area: title; }
.wb-oe.oe-current .wb-oe-menu { grid-area: menu; }
.wb-oe.oe-current .wb-oe-tools { grid-area: tools; justify-content: flex-start; gap: 2px; }

.wb-oe-search-row {
  height: var(--h-bar);
  flex-shrink: 0;
  padding: 0 8px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px;
}
.wb-oe.oe-current .wb-oe-search-row {
  height: auto;
  padding: 7px 8px 6px;
  border-bottom-color: var(--border-subtle);
}
.wb-oe-search-box {
  flex: 1; min-width: 0;
  height: var(--h-control);
  display: flex; align-items: center; gap: 6px;
  padding: 0 6px 0 8px;
  border-radius: var(--rad-sm);
  background: var(--input);
  border: 1px solid var(--input-border);
  color: var(--text-muted);
}
.wb-oe-search-box:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.wb-oe-search-box input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font-size: 12px; color: var(--text);
}
.wb-oe-search-box input::placeholder { color: var(--text-muted); }

.wb-oe-tree-frame {
  position: relative;
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
}
.wb-oe-tree {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: 0;
  user-select: none;
}

/* Sticky Top/Bottom Pinned Server Bands (mirrors ExplorerPinnedBand + tree-model.ts) */
.oe-pin-band {
  position: absolute; left: 0; right: 8px; z-index: 6;
  overflow: clip;
  background: var(--sidebar);
  pointer-events: auto;
}
.oe-pin-band[data-edge="top"] { top: 0; box-shadow: 0 1px 0 var(--border); }
.oe-pin-band[data-edge="bottom"] { bottom: 0; box-shadow: 0 -1px 0 var(--border); }
.oe-pin-band:empty { display: none; box-shadow: none; }
.oe-pin-band > .oe-server-card,
.oe-pin-band > .oe-server-row-legacy {
  position: absolute; left: 0; right: 0;
}
.oe-pin-overflow {
  position: absolute; left: 0; right: 0; z-index: 2;
  overflow: clip;
  background: var(--chrome);
  border-bottom: 1px solid var(--border);
}
.oe-pin-band[data-edge="top"] > .oe-pin-overflow { top: 0; }
.oe-pin-band[data-edge="bottom"] > .oe-pin-overflow { bottom: 0; border-bottom: 0; border-top: 1px solid var(--border); }
.oe-pin-more-btn {
  width: 100%; height: 22px; padding: 0 10px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--text-muted);
  background: var(--chrome);
}
.oe-pin-more-btn:hover { background: var(--hover); color: var(--text-strong); }
.oe-pin-popover {
  position: absolute; left: 4px; right: 4px; z-index: 40;
  background: var(--overlay); border: 1px solid var(--control-border);
  border-radius: 6px; box-shadow: var(--shadow-popover);
  overflow: hidden; display: none;
}
.oe-pin-popover.is-open { display: block; }
.oe-pin-popover[data-edge="top"] { top: 24px; }
.oe-pin-popover[data-edge="bottom"] { bottom: 24px; }

/* Server Header Band (Flush 44px 2-line for exact 1:1 sticky handoff, zero margin/corner jump) */
.oe-server-card {
  position: relative;
  height: 44px;
  padding: 5px 8px 5px 6px;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--raised) 55%, var(--sidebar));
  display: flex; flex-direction: column; justify-content: center;
  cursor: pointer;
  transition: background 80ms var(--ease), border-color 80ms var(--ease);
}
.oe-server-card:hover { background: var(--hover); }
.oe-server-card.is-active-conn:not(.has-card-tint) {
  background: color-mix(in srgb, var(--accent-surface) 38%, var(--sidebar));
  border-top-color: color-mix(in srgb, var(--accent) 32%, var(--border));
  border-bottom-color: color-mix(in srgb, var(--accent) 32%, var(--border));
}
.oe-server-card.has-card-tint {
  background: linear-gradient(90deg, color-mix(in srgb, var(--card-accent) 9%, transparent) 0%, transparent 72%), color-mix(in srgb, var(--raised) 48%, var(--sidebar));
  border-top-color: color-mix(in srgb, var(--card-accent) 38%, var(--border));
  border-bottom-color: color-mix(in srgb, var(--card-accent) 26%, var(--border));
}
[data-theme="light"] .oe-server-card.has-card-tint {
  background: linear-gradient(90deg, color-mix(in srgb, var(--card-accent) 7%, transparent) 0%, transparent 72%), color-mix(in srgb, var(--canvas) 78%, var(--sidebar));
  border-top-color: color-mix(in srgb, var(--card-accent) 34%, var(--border));
  border-bottom-color: color-mix(in srgb, var(--card-accent) 24%, var(--border));
}
.oe-server-card.has-card-tint:hover {
  background: linear-gradient(90deg, color-mix(in srgb, var(--card-accent) 13%, transparent) 0%, transparent 76%), var(--hover);
}
.oe-server-rail {
  position: absolute; top: 0; bottom: 0; left: 0; width: 3px;
}
.oe-server-top {
  display: flex; align-items: center; gap: 5px; min-width: 0;
}
.oe-server-name {
  flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600;
  color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.oe-server-sub {
  display: flex; align-items: center; gap: 6px;
  margin-top: 3px; padding-left: 20px;
  font-size: 11px; color: var(--text-muted);
  min-width: 0;
}
.oe-server-host {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.oe-jobs-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 0 5px; height: 16px; border-radius: 99px;
  background: var(--selection); color: var(--text-accent);
  font-size: 10.5px; font-weight: 600; flex-shrink: 0;
}
.oe-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--success);
}
.oe-active-glyph { color: var(--accent); display: inline-grid; place-items: center; flex-shrink: 0; }

/* Baseline 1-line squished server row */
.oe-server-row-legacy {
  position: relative;
  height: 30px; padding: 0 6px 0 4px;
  display: flex; align-items: center; gap: 4px;
  cursor: pointer;
}
.oe-server-row-legacy:hover { background: var(--hover); }
.oe-server-row-legacy .oe-server-rail { top: 0; bottom: 0; border-radius: 0; }
.oe-server-row-legacy .oe-server-name {
  font-size: 12.5px; flex: 1 1 60px; max-width: 96px;
}
.oe-server-row-legacy .env-pill { max-width: 40px; justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; }

/* Tree Rows */
.oe-row {
  position: relative;
  height: var(--h-row);
  display: flex; align-items: center; gap: 4px;
  padding-right: 8px;
  font-size: 12.5px; color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}
.oe-row:hover { background: var(--hover); }
.oe-row.is-selected { background: var(--selection); color: var(--text-strong); }
.oe-row.is-system { color: var(--text-tertiary); }
.oe-row.is-system .oe-folder-ic { opacity: 0.65; }
.oe-indent-cell {
  position: relative;
  display: inline-block;
  width: 14px; height: 100%; flex-shrink: 0;
}
.has-guides .oe-indent-cell::before {
  content: "";
  position: absolute; left: 7px; top: 0; bottom: 0;
  width: 1px; background: var(--tree-guide);
}
.oe-chev {
  width: 14px; height: 14px; display: grid; place-items: center;
  color: var(--icon-muted); flex-shrink: 0;
}
.oe-ic { width: 15px; height: 15px; display: grid; place-items: center; color: var(--icon); flex-shrink: 0; }
.oe-folder-ic { color: var(--icon-folder); }
.oe-lbl { flex: 0 0 auto; max-width: 68%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.oe-row.is-db .oe-lbl, .oe-row.is-table .oe-lbl { font-weight: 500; color: var(--text-strong); }
.oe-col-meta {
  flex: 1 1 0; min-width: 0;
  font-size: 11px; color: var(--text-muted); margin-left: 4px;
  overflow: hidden; text-overflow: ellipsis;
}
.oe-pk-badge {
  display: inline-flex; align-items: center; height: 14px; padding: 0 4px;
  border-radius: 3px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em;
  background: var(--warning-surface); color: var(--warning);
  margin-left: 2px; flex-shrink: 0;
}
.oe-count {
  margin-left: auto; font-size: 11px; color: var(--text-muted);
  font-variant-numeric: tabular-nums; padding-left: 6px;
}
.oe-status-txt {
  margin-left: auto; font-size: 11px; font-weight: 500; color: var(--success);
}

.wb-oe-footer {
  height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 10px;
  border-top: 1px solid var(--border-subtle);
  font-size: 11px; color: var(--text-muted);
  overflow: hidden; white-space: nowrap;
}
.wb-oe-footer .oe-foot-left { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.wb-oe-footer .oe-foot-right { flex-shrink: 0; }
.wb-oe.oe-current .wb-oe-footer .oe-foot-right { display: none; }

/* Splitter */
.wb-splitter-v {
  width: 4px; flex-shrink: 0; cursor: col-resize;
  background: transparent; position: relative; z-index: 5;
  margin-left: -2px; margin-right: -2px;
}
.wb-splitter-v:hover, .wb-splitter-v.is-dragging { background: var(--focus); opacity: 0.65; }

.wb-splitter-h {
  height: 5px; flex-shrink: 0; cursor: row-resize;
  background: var(--border); position: relative; z-index: 5;
  border-top: 1px solid transparent; border-bottom: 1px solid transparent;
}
.wb-splitter-h:hover, .wb-splitter-h.is-dragging { background: var(--focus); }

/* --- 3. RIGHT WORKSPACE (EDITOR + RESULTS) --- */
.wb-right {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
}

.wb-editor-pane {
  flex: 1 1 52%; min-height: 140px;
  display: flex; flex-direction: column;
  min-width: 0;
  background: var(--canvas);
}

/* Split editor groups container */
.wb-groups-row {
  flex: 1; min-height: 0; min-width: 0;
  display: flex;
}
.wb-editor-group {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
}
.wb-editor-group + .wb-editor-group {
  border-left: 1px solid var(--border-strong);
}

/* ENVIRONMENT PILLS */
.env-pill {
  display: inline-flex; align-items: center; justify-content: center;
  height: 16px; padding: 0 5px; border-radius: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
}
.env-pill.prod { background: var(--red-pill-bg); color: var(--red-pill-text); border: 1px solid var(--red-pill-border); }
.env-pill.staging { background: var(--blue-pill-bg); color: var(--blue-pill-text); border: 1px solid var(--blue-pill-border); }
.env-pill.neutral { background: var(--tonal-fill); color: var(--text-secondary); border: 1px solid var(--border-strong); }

/* DOCUMENT TAB STRIP */
.wb-tab-shelf {
  height: var(--h-doc-tab);
  background: var(--chrome);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: stretch;
  flex-shrink: 0;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.wb-tab-shelf::-webkit-scrollbar { display: none; }
.wb-tab-shelf.is-pinned-shelf {
  border-bottom: 1px solid var(--border-strong);
  background: color-mix(in srgb, var(--chrome) 70%, var(--raised));
}

.wb-tabs-list {
  display: flex; align-items: stretch; flex: 1; min-width: 0;
}
.wb-tab-pin-divider {
  width: 1px; background: var(--separator); margin: 6px 2px; flex-shrink: 0;
}

.wb-doc-tab {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px 0 10px;
  border-right: 1px solid var(--border);
  border-top: 2px solid transparent;
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  user-select: none;
  transition: background 80ms var(--ease), color 80ms var(--ease);
}
.wb-doc-tab:hover { background: var(--hover); color: var(--text); }
.wb-doc-tab.is-active {
  background: var(--canvas);
  color: var(--text-strong);
  transition: none;
}
.wb-doc-tab.is-pinned:not(.is-active) {
  background: color-mix(in srgb, var(--selection) 42%, var(--chrome));
}
.wb-doc-tab.accent-prod.is-active { border-top-color: var(--red); }
.wb-doc-tab.accent-staging.is-active { border-top-color: var(--blue); }
.wb-doc-tab.accent-default.is-active { border-top-color: var(--accent); }
.wb-doc-tab.accent-prod:not(.is-active) { border-top-color: color-mix(in srgb, var(--red) 45%, transparent); }
.wb-doc-tab.accent-staging:not(.is-active) { border-top-color: color-mix(in srgb, var(--blue) 45%, transparent); }

/* Tab Style Variants */
.tabs-2line-refined .wb-doc-tab { height: 100%; min-width: 148px; max-width: 210px; }
.tabs-1line-compact .wb-doc-tab { height: 100%; min-width: 120px; max-width: 225px; }
.tabs-2line-current .wb-doc-tab { height: 100%; width: 226px; }

.wb-tab-body {
  display: flex; flex-direction: column; justify-content: center;
  min-width: 0; flex: 1; gap: 2px;
}
.tabs-1line-compact .wb-tab-body {
  flex-direction: row; align-items: center; gap: 6px;
}
.wb-tab-title-row {
  display: flex; align-items: center; gap: 5px; min-width: 0;
}
.wb-tab-name {
  font-size: 12px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wb-doc-tab.is-active .wb-tab-name { font-weight: 600; }

.wb-tab-meta-row {
  display: flex; align-items: center; gap: 5px; min-width: 0;
  font-size: 10.5px; color: var(--text-muted);
}
.wb-tab-sid {
  font-size: 10.5px; font-variant-numeric: tabular-nums;
  color: var(--text-muted); white-space: nowrap;
}
.tabs-2line-current .wb-tab-sid {
  padding: 0 5px; border-radius: 3px; background: var(--active); color: var(--text-secondary);
}

.wb-tab-actions {
  display: flex; align-items: center; gap: 1px; flex-shrink: 0;
}
.wb-tab-act {
  width: 20px; height: 20px; border-radius: 3px;
  display: grid; place-items: center;
  color: var(--text-muted);
}
.wb-tab-act:hover { background: var(--active); color: var(--text-strong); }

/* Fixed Pin button slot (zero layout shift on hover); subtle at rest when unpinned, crisp when hovered or pinned */
.tabs-2line-refined .wb-doc-tab:not(.is-pinned) .act-pin,
.tabs-1line-compact .wb-doc-tab:not(.is-pinned) .act-pin {
  opacity: 0.52;
  transition: opacity 80ms var(--ease), background 80ms var(--ease), color 80ms var(--ease);
}
.tabs-2line-refined .wb-doc-tab:not(.is-pinned):hover .act-pin,
.tabs-1line-compact .wb-doc-tab:not(.is-pinned):hover .act-pin {
  opacity: 1;
}
.wb-doc-tab.is-pinned .act-pin { color: var(--text-accent); }

.wb-dirty-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
}
.wb-doc-tab.is-dirty .act-close .close-x { display: none; }
.wb-doc-tab.is-dirty:hover .act-close .close-x { display: inline-flex; }
.wb-doc-tab.is-dirty:hover .act-close .wb-dirty-dot { display: none; }

.wb-tab-strip-end {
  display: flex; align-items: center; gap: 2px; padding: 0 6px; flex-shrink: 0;
}

/* --- QUERY BAR --- */
.wb-querybar {
  position: relative;
  height: var(--h-bar);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px;
  background: var(--canvas);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.wb-querybar.has-conn-tint {
  background: linear-gradient(90deg, color-mix(in srgb, var(--qb-accent) 8%, transparent) 0%, transparent 48%), var(--canvas);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--qb-accent) 38%, transparent);
}
[data-theme="light"] .wb-querybar.has-conn-tint {
  background: linear-gradient(90deg, color-mix(in srgb, var(--qb-accent) 6.5%, transparent) 0%, transparent 48%), var(--canvas);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--qb-accent) 32%, transparent);
}

.wb-qb-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.wb-exec-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: var(--h-control); padding: 0 10px;
  border-radius: var(--rad-sm);
  background: var(--accent); color: var(--on-accent);
  font-size: 12px; font-weight: 600;
  transition: background 80ms var(--ease);
}
.wb-exec-btn:hover { background: var(--accent-hover); }
.wb-exec-btn.is-running {
  background: var(--error-surface); color: var(--error-surface-text);
  border: 1px solid color-mix(in srgb, var(--error) 45%, transparent);
}
.wb-exec-btn .exec-kbd {
  font-size: 10px; font-weight: 600; padding: 0 4px; height: 16px; line-height: 14px;
  border-radius: 3px; border: 1px solid color-mix(in srgb, currentColor 42%, transparent);
  opacity: 0.9;
}
.wb-exec-scope-pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: var(--h-control); padding: 0 7px;
  border-radius: var(--rad-sm);
  font-size: 11px; color: var(--text-muted);
  background: var(--tonal-fill);
  border: 1px solid transparent;
  cursor: pointer;
}
.wb-exec-scope-pill:hover { background: var(--tonal-fill-hover); color: var(--text); }
.wb-exec-scope-pill.is-selection {
  background: var(--warning-surface); color: var(--warning-surface-text);
  border-color: color-mix(in srgb, var(--warning) 35%, transparent);
  font-weight: 600;
}

.wb-qb-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: var(--h-control); padding: 0 8px;
  border-radius: var(--rad-sm);
  font-size: 12px; color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  transition: background 80ms var(--ease), color 80ms var(--ease);
  white-space: nowrap;
}
.wb-qb-btn:hover:not(:disabled) { background: var(--hover); color: var(--text-strong); }
.wb-qb-btn.is-tonal { background: var(--tonal-fill); border-color: var(--border); }
.wb-qb-btn.is-tonal:hover:not(:disabled) { background: var(--tonal-fill-hover); border-color: var(--control-border); }
.wb-qb-btn.is-pressed {
  background: var(--selection); color: var(--text-accent);
  border-color: color-mix(in srgb, var(--accent) 42%, transparent);
  font-weight: 500;
}
.wb-qb-btn.is-cancel-live {
  background: var(--error-surface); color: var(--error-surface-text);
  border-color: color-mix(in srgb, var(--error) 40%, transparent);
}
.wb-qb-sep { width: 1px; height: 16px; background: var(--separator); margin: 0 2px; }

/* Connection Pill */
.wb-conn-pill {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  height: var(--h-control);
  padding: 0 4px 0 8px;
  border-radius: var(--rad-sm);
  background: var(--input);
  border: 1px solid var(--input-border);
  min-width: 0; max-width: 440px;
}
.wb-conn-pill.has-conn-tint-pill {
  border-color: color-mix(in srgb, var(--qb-accent) 42%, var(--input-border));
}
.wb-conn-swatch { width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0; }
.wb-conn-select {
  border: 0; outline: 0; background: transparent;
  font-size: 12px; color: var(--text);
  padding: 0 2px; height: 22px; min-width: 60px; max-width: 195px;
  cursor: pointer; text-overflow: ellipsis;
}
.wb-conn-select option { background: var(--overlay); color: var(--text); }
.wb-conn-div { width: 1px; height: 14px; background: var(--separator); flex-shrink: 0; }

/* Dropdown Popovers inside workbench */
.wb-popover {
  position: absolute; z-index: 60;
  background: var(--overlay);
  border: 1px solid var(--control-border);
  border-radius: var(--rad-lg);
  box-shadow: var(--shadow-popover);
  padding: 5px;
  min-width: 215px;
  display: none;
}
.wb-popover.is-open { display: block; }
.wb-pop-hdr {
  padding: 4px 8px 5px;
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted);
}
.wb-pop-item {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px;
  font-size: 12px; color: var(--text); text-align: left;
}
.wb-pop-item:hover { background: var(--hover); color: var(--text-strong); }
.wb-pop-item.is-selected { background: var(--selection); color: var(--text-accent); font-weight: 500; }
.wb-pop-item .pop-sub { display: block; font-size: 10.5px; color: var(--text-muted); font-weight: 400; }
.wb-pop-item .pop-check { margin-left: auto; color: var(--accent); font-weight: 700; }
.wb-pop-sep { height: 1px; background: var(--border); margin: 4px 2px; }

/* --- SQL EDITOR SURFACE --- */
.wb-sql-editor {
  flex: 1; min-height: 0; overflow: auto;
  padding: 8px 0;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 19px;
  background: var(--canvas);
  position: relative;
}
.sql-line {
  display: flex; align-items: baseline; padding: 0 14px 0 0; min-height: 19px;
}
.sql-line.is-current { background: rgba(255, 255, 255, 0.025); }
[data-theme="light"] .sql-line.is-current { background: rgba(15, 23, 42, 0.03); }
.sql-line.is-sel .sql-code { background: var(--text-selection); border-radius: 2px; }
.sql-ln {
  width: 44px; padding-right: 14px; text-align: right; flex-shrink: 0;
  color: var(--text-muted); opacity: 0.62; font-size: 11.5px; user-select: none;
}
.sql-line.is-current .sql-ln { color: var(--text-secondary); opacity: 1; }
.sql-code { white-space: pre; }
.kw { color: var(--syn-kw); font-weight: 500; }
.fn { color: var(--syn-fn); }
.str { color: var(--syn-str); }
.num { color: var(--syn-num); }
.cmt { color: var(--syn-cmt); font-style: italic; }
.op { color: var(--syn-op); }

/* Non-Query Tab View (Activity Monitor / Search Objects preview) */
.wb-nonquery-view {
  flex: 1; min-height: 0; overflow: auto; padding: 14px 16px;
  background: var(--canvas); display: flex; flex-direction: column; gap: 12px;
}
.nq-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nq-title { font-size: 14px; font-weight: 600; color: var(--text-strong); display: flex; align-items: center; gap: 8px; }
.nq-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
.nq-kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nq-kpi {
  padding: 10px 12px; border-radius: 8px;
  background: var(--raised); border: 1px solid var(--border);
}
.nq-kpi.is-alert { border-left: 3px solid var(--error); background: color-mix(in srgb, var(--error-surface) 45%, var(--raised)); }
.nq-kpi-lbl { font-size: 11px; color: var(--text-muted); }
.nq-kpi-val { font-size: 20px; font-weight: 600; color: var(--text-strong); margin-top: 3px; font-variant-numeric: tabular-nums; }
.nq-kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* --- 4. RESULTS / OUTPUT PANE --- */
.wb-output-pane {
  flex: 1 1 48%; min-height: 150px;
  display: flex; flex-direction: column;
  background: var(--panel);
  min-width: 0;
  position: relative;
}

/* Output Toolbar (Bar 1) */
.wb-out-bar1 {
  height: var(--h-bar);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 0 6px 0 8px;
  background: var(--chrome);
  border-bottom: 1px solid var(--border);
  position: relative;
}

.out-views {
  display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0;
}
.out-views.is-boxed {
  padding: 1px; border: 1px solid var(--border); border-radius: var(--rad-sm);
}
.out-views.empty-bug {
  padding: 1px; border: 1px solid var(--control-border); border-radius: var(--rad-sm);
  width: 6px; height: 6px;
}
.out-view-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 8px; border-radius: var(--rad-sm);
  font-size: 12px; color: var(--text-muted);
}
.out-view-btn:hover { background: var(--hover); color: var(--text); }
.out-view-btn.is-active {
  background: var(--selection); color: var(--text-accent); font-weight: 600;
}
.out-badge {
  min-width: 16px; height: 16px; padding: 0 5px; border-radius: 99px;
  background: var(--active); color: var(--text-secondary);
  font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center;
}
.out-badge.is-err { background: var(--error-surface); color: var(--error); }

.out-div { width: 1px; height: 16px; background: var(--separator); flex-shrink: 0; }

.res-tools {
  display: flex; align-items: center; gap: 5px; min-width: 0; flex-shrink: 1;
}
.res-search {
  display: flex; align-items: center; gap: 4px;
  height: 24px; width: 175px; padding: 0 3px 0 7px;
  border-radius: var(--rad-sm);
  background: var(--input); border: 1px solid var(--input-border);
  color: var(--text-muted); flex-shrink: 1; min-width: 110px;
}
.res-search:focus-within { border-color: var(--focus); }
.res-search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font-size: 11.5px; color: var(--text);
}
.res-search input::placeholder { color: var(--text-muted); }

/* Segmented groups & icon groups */
.res-seg {
  display: inline-flex; align-items: center; gap: 1px; flex-shrink: 0;
}
.res-seg.is-boxed {
  padding: 1px; border: 1px solid var(--control-border); border-radius: var(--rad-sm);
}
.res-seg.is-calmed {
  padding: 1px; border: 1px solid var(--border); border-radius: var(--rad-sm);
  background: var(--tonal-fill);
}
.res-seg button {
  height: 20px; padding: 0 7px; border-radius: 3px;
  font-size: 11px; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 4px;
}
.res-seg button:hover { background: var(--hover); color: var(--text-strong); }
.res-seg button.is-on { background: var(--selection); color: var(--text-accent); font-weight: 600; }
.res-seg button.ic-only { padding: 0 5px; width: 24px; height: 22px; justify-content: center; }

.res-chip-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 7px; border-radius: var(--rad-sm);
  font-size: 11px; color: var(--text-muted);
  border: 1px solid transparent; flex-shrink: 0;
}
.res-chip-btn:hover { background: var(--hover); color: var(--text-strong); }
.res-chip-btn.is-nondefault {
  background: var(--selection); color: var(--text-accent);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  font-weight: 600;
}

.out-status {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 72px;
}
.out-status strong { color: var(--text); font-weight: 600; }
.out-status .st-ok { color: var(--success); display: inline-grid; place-items: center; }
.out-status .st-warn { color: var(--warning); display: inline-grid; place-items: center; }

/* Result Set Tabs (Bar 2) */
.wb-rt-bar2 {
  height: 29px; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 0 8px 0 6px;
  background: var(--chrome);
  border-bottom: 1px solid var(--border);
}
.rt-tabs-strip { display: flex; align-items: flex-end; gap: 2px; height: 100%; padding-top: 4px; }
.rt-tab {
  display: inline-flex; align-items: center; gap: 5px;
  height: 25px; padding: 0 6px 0 10px;
  border-radius: 4px 4px 0 0;
  border: 1px solid transparent; border-bottom: 0;
  font-size: 12px; color: var(--text-muted);
  cursor: pointer; user-select: none;
}
.rt-tab:hover { color: var(--text); background: var(--tonal-fill); }
.rt-tab.is-selected {
  background: var(--panel); color: var(--text-strong); font-weight: 600;
  border-color: var(--border);
  box-shadow: inset 0 2px 0 var(--accent);
}
.rt-tab-x { width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; opacity: 0.65; }
.rt-tab-x:hover { opacity: 1; background: var(--hover); }
.rt-pivot-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warning); }

.rt-inline-right {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.rt-save-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: var(--rad-sm);
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
  background: var(--tonal-fill); border: 1px solid var(--border);
}
.rt-save-btn:hover { background: var(--hover); color: var(--text-strong); border-color: var(--control-border); }

/* Result View Sub-strip (Bar 3 — conditional in 2-bar mode!) */
.wb-rt-bar3 {
  height: 28px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px;
  background: var(--panel);
  border-bottom: 1px solid var(--border-subtle);
  font-size: 11px; color: var(--text-muted);
}
.wb-rt-bar3.is-compact-3 { height: 24px; }
.rt-view-pill {
  height: 20px; padding: 0 8px; border-radius: 3px;
  font-size: 11.5px; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 5px;
}
.rt-view-pill:hover { background: var(--hover); color: var(--text); }
.rt-view-pill.is-selected { background: var(--selection); color: var(--text-accent); font-weight: 600; }

/* Results Main Body (Grid + Optional Side Drawer) */
.wb-results-body {
  flex: 1; min-height: 0; display: flex; min-width: 0;
}
.wb-grid-wrap {
  flex: 1; min-width: 0; overflow: auto;
  background: var(--panel);
}

.wb-grid {
  width: 100%; border-collapse: collapse;
  font-family: var(--font-mono); font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.wb-grid th {
  position: sticky; top: 0; z-index: 2;
  height: 24px; padding: 0 9px;
  text-align: left; font-weight: 500;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border-subtle);
  white-space: nowrap;
}
.wb-grid th.is-num-hdr, .wb-grid td.is-num { text-align: right; }
.wb-grid.align-legacy th.is-num-hdr, .wb-grid.align-legacy td.is-num { text-align: left; }

.col-name { font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
.col-type { font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; color: var(--text-muted); margin-left: 6px; opacity: 0.8; }
.wb-grid.align-legacy .col-name { font-weight: 500; color: var(--text-tertiary); }
.wb-grid.align-legacy .col-type { margin-left: 3px; opacity: 1; font-size: 11px; }

.wb-grid td {
  height: 22px; padding: 0 9px;
  border-bottom: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 240px;
}
.wb-grid tbody tr:nth-child(even) td { background: var(--grid-alt); }
.wb-grid tbody tr:hover td { background: var(--hover); }
.wb-grid tbody tr.is-cur-row td:not(.rn-cell) { background: color-mix(in srgb, var(--selection) 45%, transparent); }

/* Row Number Cell & Row-Size Gutter Bar */
.rn-cell {
  position: relative; width: 36px; min-width: 36px;
  text-align: right; color: var(--text-muted);
  background: var(--panel) !important;
  isolation: isolate;
  padding: 0 7px 0 5px !important;
  font-size: 11px;
}
.rn-bar {
  position: absolute; top: 0; bottom: 0; left: 0; z-index: -1;
  pointer-events: none;
}
/* Polished row size bar: subtle neutral-iris for normal, crisp amber ONLY for true outlier (>4KB) */
.rn-bar.is-normal { background: var(--chart-blue); opacity: 0.18; }
.rn-bar.is-outlier { background: var(--warning); opacity: 0.36; }
.rn-bar.is-outlier-edge {
  position: absolute; top: 0; bottom: 0; left: 0; width: 2.5px;
  background: var(--warning);
}
/* Legacy bug: ALL rows flagged amber! */
.grid-gutter-bug .rn-bar { background: var(--warning); opacity: 0.38; width: 96% !important; }
.grid-gutter-bug .rn-bar.is-outlier-edge { display: none; }

.cell-null {
  font-style: italic; font-size: 11px; color: var(--text-muted);
  padding: 0 4px; border-radius: 3px; background: var(--tonal-fill);
}
.cell-neg { color: var(--error); }
.wb-grid.align-legacy .cell-neg { color: inherit; }

/* Side Drawer (Column Profile / Pivot) */
.wb-side-drawer {
  width: 268px; flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--sidebar);
  display: flex; flex-direction: column; min-height: 0;
}
.drawer-head {
  height: 28px; padding: 0 8px 0 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  letter-spacing: 0.04em; text-transform: uppercase;
}
.drawer-body {
  flex: 1; min-height: 0; overflow-y: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.prof-card {
  padding: 8px 9px; border-radius: 6px;
  background: var(--canvas); border: 1px solid var(--border);
  font-size: 11px;
}
.prof-card-top { display: flex; justify-content: space-between; font-weight: 600; color: var(--text-strong); margin-bottom: 5px; }
.prof-card-top span:last-child { font-family: var(--font-mono); font-weight: 400; color: var(--text-muted); }
.prof-kv { display: flex; justify-content: space-between; color: var(--text-muted); line-height: 17px; }
.prof-kv strong { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.prof-bars { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 6px; }
.prof-bars i { flex: 1; border-radius: 1.5px 1.5px 0 0; background: var(--chart-blue); opacity: 0.78; }

.pivot-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-muted); }
.pivot-field label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
.pivot-field select {
  height: 26px; padding: 0 7px; border-radius: var(--rad-sm);
  background: var(--input); border: 1px solid var(--input-border);
  font-size: 12px; color: var(--text);
}
.pivot-foot {
  padding: 8px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end;
}

/* Messages view */
.wb-messages-view {
  flex: 1; padding: 10px 14px; overflow: auto;
  font-family: var(--font-mono); font-size: 12px; line-height: 18px;
}
.msg-err { color: var(--error); }
.msg-meta { color: var(--text-muted); margin-top: 8px; }

/* Empty Output State */
.wb-empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; color: var(--text-muted); padding: 20px; text-align: center;
}
.wb-empty-state strong { color: var(--text-secondary); font-size: 13px; }

/* --- 5. STATUS BAR --- */
.wb-statusbar {
  position: relative;
  height: var(--h-status); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px;
  background: var(--chrome);
  border-top: 2px solid var(--red);
  font-size: 11px; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  user-select: none;
}
.wb-statusbar.is-staging { border-top-color: var(--blue); }
.wb-statusbar.is-disconnected { border-top-color: var(--border); }
.wb-statusbar.is-executing {
  background: var(--accent-surface); color: var(--text-strong);
}

.sb-left, .sb-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sb-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sb-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 5px; border-radius: 3px;
  font-size: 11px; color: inherit;
}
.sb-btn:hover { background: var(--hover); color: var(--text-strong); }
.sb-btn.is-open { background: var(--selection-strong); color: var(--text-accent); }
.sb-pipe { opacity: 0.4; }
.sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.sb-group-sep { width: 1px; height: 12px; background: var(--separator); }

/* Memory Rings */
.mem-ring {
  width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0;
  background: conic-gradient(var(--ring-c) var(--ring-p), color-mix(in srgb, var(--ring-c) 24%, transparent) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.3px), #000 calc(100% - 1.8px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.3px), #000 calc(100% - 1.8px));
}

/* Memory Popover */
.wb-mem-popover {
  position: absolute; right: 10px; bottom: 28px; z-index: 80;
  width: 416px; max-height: 540px; overflow-y: auto;
  padding: 12px;
  background: var(--overlay);
  border: 1px solid var(--control-border);
  border-radius: var(--rad-lg);
  box-shadow: var(--shadow-popover);
  font-size: 12px; color: var(--text);
  display: none;
}
.wb-mem-popover.is-open { display: block; }
.mem-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mem-head h3 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--text-strong); }
.mem-sec { padding: 8px 0; border-top: 1px solid var(--border); }
.mem-row-hdr { display: flex; align-items: center; gap: 7px; }
.mem-row-hdr strong { font-size: 12px; color: var(--text-strong); }
.mem-row-hdr span { margin-left: auto; font-size: 11px; color: var(--text-muted); }
.mem-sub { display: flex; justify-content: space-between; padding-left: 19px; margin-top: 2px; font-size: 11.5px; color: var(--text-secondary); }
.mem-packed {
  display: inline-flex; align-items: center; gap: 6px; padding-left: 19px; margin-top: 4px;
  font-size: 11px; color: var(--text-muted);
}
.mem-chip-green {
  padding: 0 6px; height: 16px; border-radius: 99px;
  background: var(--success-surface); color: var(--success-text);
  font-weight: 600; font-size: 10.5px; display: inline-flex; align-items: center;
}
.mem-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
.mem-tile {
  padding: 7px 8px; border-radius: 6px;
  background: var(--raised); border: 1px solid var(--border);
}
.mem-tile small { display: block; font-size: 10.5px; color: var(--text-muted); }
.mem-tile b { display: block; font-size: 16px; font-weight: 600; color: var(--text-strong); margin: 2px 0; }
.mem-tile.is-saved b { color: var(--success); }

.mem-big-hdr {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted); margin: 10px 0 6px;
}
.mem-big-list { display: flex; flex-direction: column; gap: 5px; }
.mem-big-row {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 5px; border-radius: 4px; font-size: 11.5px;
}
.mem-big-row:hover { background: var(--hover); }
.mem-big-name {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden;
}
.mem-big-tab {
  color: var(--text-muted); flex: 0 1 auto; max-width: 42%; overflow: hidden; text-overflow: ellipsis;
}
.mem-big-res {
  color: var(--text); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.mem-big-list.is-legacy-bug .mem-big-tab { flex-shrink: 1000; max-width: 10px; }
.mem-state-pill {
  padding: 0 6px; height: 17px; border-radius: 99px; font-size: 10px; font-weight: 600;
  display: inline-flex; align-items: center; flex-shrink: 0;
}
.mem-state-pill.unpack { background: var(--warning-surface); color: var(--warning); }
.mem-state-pill.packed { background: color-mix(in srgb, var(--chart-purple) 20%, transparent); color: var(--purple); }
.mem-state-pill.raw { background: color-mix(in srgb, var(--chart-blue) 18%, transparent); color: var(--blue); }
.mem-free-btn {
  width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center;
  color: var(--text-muted); opacity: 0; transition: opacity 80ms var(--ease);
}
.mem-big-row:hover .mem-free-btn { opacity: 1; }
.mem-free-btn:hover { background: var(--error-surface); color: var(--error); }
.mem-big-list.is-legacy-bug .mem-free-btn { display: none; }

/* ============================================================================
   ANNOTATION PINS + CALLOUT DECK
   ============================================================================ */
.pin-badge {
  position: absolute; z-index: 50;
  width: 21px; height: 21px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  color: #fff;
  background: var(--accent);
  border: 2px solid var(--canvas);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  cursor: pointer;
  transition: transform 110ms var(--ease);
}
.pin-badge:hover, .pin-badge.is-hot { transform: scale(1.18); z-index: 55; }
.pin-badge.sev-p0 { background: #d9534f; }
.pin-badge.sev-new { background: #149669; }
[data-pins="off"] .pin-badge,
[data-pins="off"] .callout-deck { display: none; }

.callout-deck {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
  gap: 8px;
}
.callout-card {
  padding: 10px 11px; border-radius: 8px;
  background: var(--lab-card); border: 1px solid var(--lab-border);
  cursor: pointer;
  transition: border-color 90ms var(--ease), background 90ms var(--ease);
}
.callout-card:hover, .callout-card.is-hot {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent-surface) 22%, var(--lab-card));
}
.callout-top { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.callout-num {
  width: 19px; height: 19px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff;
  background: var(--accent);
}
.callout-num.sev-p0 { background: #d9534f; }
.callout-num.sev-new { background: #149669; }
.callout-title { font-size: 12px; font-weight: 600; color: var(--text-strong); flex: 1; }
.callout-tag {
  font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
  background: var(--tonal-fill); color: var(--text-muted); border: 1px solid var(--lab-border);
}
.callout-desc { font-size: 11.5px; line-height: 1.45; color: var(--text-muted); }

/* ============================================================================
   RIGHT CONFIGURATOR PANEL (10 SELECTABLE DESIGN AXES)
   ============================================================================ */
.lab-config {
  width: 348px;
  flex-shrink: 0;
  background: var(--lab-surface);
  border-left: 1px solid var(--lab-border);
  height: calc(100vh - 88px);
  position: sticky; top: 88px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.lab-config.is-collapsed { display: none; }
.cfg-head {
  padding: 11px 14px; border-bottom: 1px solid var(--lab-border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.cfg-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--text-strong); }
.cfg-body {
  flex: 1; overflow-y: auto; padding: 10px 14px 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.cfg-axis {
  padding: 9px 10px; border-radius: 8px;
  background: var(--lab-card); border: 1px solid var(--lab-border);
}
.cfg-axis-top {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin-bottom: 6px;
}
.cfg-axis-title { font-size: 11.5px; font-weight: 600; color: var(--text-strong); }
.cfg-axis-tag {
  font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 99px;
  text-transform: uppercase; letter-spacing: 0.04em;
}

  function computeReclaimedPx() {
    let saved = 0;
    const o = state.opts;
    if (o.tabStyle === 'refined2') saved += 4;
    if (o.tabStyle === 'compact1') saved += 10;
    if (o.pinnedLayout === 'inline') saved += (o.tabStyle === 'compact1' ? 34 : 40);
    if (o.resultsGrid === 'smart2bar') saved += 28;
    else if (o.resultsGrid === 'compact3bar') saved += 4;
    return saved;
  }
