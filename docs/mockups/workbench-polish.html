                <div class="oe-row" data-act="toggleOe" data-node="cols">${indent(5)}<span class="oe-chev">${state.oeExpanded.cols ? ICONS.chevDown : ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Columns</span><span class="oe-count">4</span></div>
                ${colsHtml}
                <div class="oe-row">${indent(5)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Keys</span></div>
                <div class="oe-row">${indent(5)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Indexes</span></div>
              ` : ''}
              ${rowMatch('dbo.OrderItems') ? `<div class="oe-row is-table">${indent(4)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.table}</span><span class="oe-lbl">${state.oeSchemaGroup ? 'OrderItems' : 'dbo.OrderItems'}</span></div>` : ''}
              ${rowMatch('dbo.Customers') ? `<div class="oe-row is-table">${indent(4)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.table}</span><span class="oe-lbl">${state.oeSchemaGroup ? 'Customers' : 'dbo.Customers'}</span></div>` : ''}
              ${rowMatch('dbo.Shipments') ? `<div class="oe-row is-table">${indent(4)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.table}</span><span class="oe-lbl">${state.oeSchemaGroup ? 'Shipments' : 'dbo.Shipments'}</span></div>` : ''}
            ` : ''}
            ${rowMatch('Views') ? `<div class="oe-row">${indent(3)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Views</span><span class="oe-count">6</span></div>` : ''}
            ${rowMatch('Programmability') ? `<div class="oe-row">${indent(3)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Programmability</span></div>` : ''}
          ` : ''}
          ${rowMatch('AnalyticsWarehouse') ? `<div class="oe-row is-db">${indent(2)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.db}</span><span class="oe-lbl">AnalyticsWarehouse</span></div>` : ''}
        ` : ''}
        ${rowMatch('Security') ? `<div class="oe-row">${indent(1)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Security</span></div>` : ''}
        ${rowMatch('SQL Server Agent') ? `<div class="oe-row">${indent(1)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.pulse}</span><span class="oe-lbl">SQL Server Agent</span><span class="oe-status-txt">Running</span></div>` : ''}
      ` : '';

      const stgChildren = state.oeExpanded.stg ? `
        <div class="oe-row">${indent(1)}<span class="oe-chev">${ICONS.chevDown}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Databases</span><span class="oe-count">3</span></div>
        <div class="oe-row is-db">${indent(2)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.db}</span><span class="oe-lbl">AnalyticsStg</span></div>
        <div class="oe-row is-db">${indent(2)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic">${ICONS.db}</span><span class="oe-lbl">BillingStg</span></div>
        <div class="oe-row">${indent(1)}<span class="oe-chev">${ICONS.chevRight}</span><span class="oe-ic oe-folder-ic">${ICONS.folderOpen}</span><span class="oe-lbl">Security</span></div>
      ` : '';

      treeHtml = renderServerBand(OE_SERVERS[0]) + children
        + renderServerBand(OE_SERVERS[1]) + stgChildren
        + renderServerBand(OE_SERVERS[2])
        + renderServerBand(OE_SERVERS[3])
        + renderServerBand(OE_SERVERS[4]);
    }

    return `
      <aside class="wb-oe ${isCurrent ? 'oe-current' : ''}" style="--oe-w:${state.oeWidth}px;">
        <div class="wb-oe-header">
          <span class="wb-oe-title">Object Explorer</span>
          ${headerTools}
          <button type="button" class="wb-icon-btn wb-oe-menu" title="Object Explorer options">${ICONS.more}</button>
        </div>
        ${!isEmpty ? `
          <div class="wb-oe-search-row">
            <div class="wb-oe-search-box">
              ${ICONS.search}
              <input type="text" id="oeSearchInput" value="${state.oeFilter}" placeholder="Search objects…" aria-label="Search objects" />
            </div>
            ${isInline ? `
              <button type="button" class="wb-icon-btn" title="Filter selected folder">${ICONS.filter}</button>
              <button type="button" class="wb-icon-btn ${state.oeSchemaGroup ? 'is-active' : ''}" data-act="toggleSchema" title="Group by Schema">${ICONS.schema}</button>
            ` : ''}
          </div>` : ''}
        <div class="wb-oe-tree-frame">
          <div class="oe-pin-band" id="oePinTop" data-edge="top"></div>
          <div class="wb-oe-tree ${guides}" id="oeTreeScroll">${treeHtml}</div>
          <div class="oe-pin-band" id="oePinBottom" data-edge="bottom"></div>
          <div class="oe-pin-popover" id="oePinPopTop" data-edge="top"></div>
          <div class="oe-pin-popover" id="oePinPopBottom" data-edge="bottom"></div>
        </div>
        <div class="wb-oe-footer">
          <span class="oe-foot-left">${isEmpty ? 'Windows & SQL authentication' : 'dbo.Orders · Updated 2s ago'}</span>
          ${!isEmpty ? `<span class="oe-foot-right">5 servers</span>` : ''}
        </div>
      </aside>`;
  }

  function renderSingleTab(tab, activeId) {
    const o = state.opts;
    const isAct = tab.id === activeId;
    const accentCls = tab.env === 'prod' ? 'accent-prod' : tab.env === 'staging' ? 'accent-staging' : 'accent-default';
    const isCurrent = o.tabStyle === 'current2';
    const isCompact = o.tabStyle === 'compact1';
    const showEmptyDash = isCurrent && tab.kind === 'sql' && !tab.sid;
    const sidHtml = tab.sid
      ? `<span class="wb-tab-sid">${tab.sid}</span>`
      : (showEmptyDash ? `<span class="wb-tab-sid">—</span>` : '');
    const envHtml = tab.env
      ? `<span class="env-pill ${tab.env}">${tab.env === 'prod' ? 'PROD' : 'STAGING'}</span>`
      : '';
    const hasMeta = !!(envHtml || sidHtml);

    return `
      <div class="wb-doc-tab ${accentCls} ${isAct ? 'is-active' : ''} ${tab.pinned ? 'is-pinned' : ''} ${tab.dirty ? 'is-dirty' : ''}" data-act="openTab" data-tab="${tab.id}">
        <span class="oe-ic" style="color:${isAct ? 'var(--text-accent)' : 'var(--icon)'};">${tab.kind === 'activity' ? ICONS.pulse : ICONS.doc}</span>
        <div class="wb-tab-body">
          ${isCompact ? `
            ${envHtml}
            <span class="wb-tab-name" title="${tab.name}">${tab.name}</span>
            ${tab.sid ? `<span class="wb-tab-sid">${tab.sid}</span>` : ''}
          ` : `
            <div class="wb-tab-title-row"><span class="wb-tab-name" title="${tab.name}">${tab.name}</span></div>
            ${hasMeta ? `<div class="wb-tab-meta-row">${envHtml}${sidHtml}</div>` : ''}
          `}
        </div>
        <div class="wb-tab-actions">
          ${tab.kind === 'sql' ? `<button type="button" class="wb-tab-act act-pin" data-act="togglePin" data-tab="${tab.id}" title="${tab.pinned ? 'Unpin' : 'Pin'} tab">${tab.pinned ? ICONS.pinned : ICONS.pin}</button>` : ''}
          <button type="button" class="wb-tab-act act-close" title="Close ${tab.name}">
            ${tab.dirty ? `<span class="wb-dirty-dot"></span><span class="close-x">${ICONS.close}</span>` : ICONS.close}
          </button>
        </div>
      </div>`;
  }

  function renderTabBar(tabs, activeId) {
    const o = state.opts;
    const cls = o.tabStyle === 'compact1' ? 'tabs-1line-compact' : o.tabStyle === 'current2' ? 'tabs-2line-current' : 'tabs-2line-refined';
    const pinned = tabs.filter(t => t.pinned);
    const unpinned = tabs.filter(t => !t.pinned);

    if (o.pinnedLayout === 'shelf' && pinned.length > 0 && unpinned.length > 0) {
      return `
        <div class="wb-tab-shelf is-pinned-shelf ${cls}">
          <div class="wb-tabs-list">${pinned.map(t => renderSingleTab(t, activeId)).join('')}</div>
          <div class="wb-tab-strip-end" style="font-size:10px;color:var(--text-muted);padding-right:10px;">Pinned shelf</div>
        </div>
        <div class="wb-tab-shelf ${cls}">
          <div class="wb-tabs-list">${unpinned.map(t => renderSingleTab(t, activeId)).join('')}</div>
          <div class="wb-tab-strip-end">
            <button type="button" class="wb-icon-btn" title="New Query">${ICONS.add}</button>
            <button type="button" class="wb-icon-btn" title="Editor group menu">${ICONS.more}</button>
          </div>
        </div>`;
    }

    return `
      <div class="wb-tab-shelf ${cls}">
        <div class="wb-tabs-list">
          ${pinned.map(t => renderSingleTab(t, activeId)).join('')}
          ${pinned.length && unpinned.length ? `<span class="wb-tab-pin-divider"></span>` : ''}
          ${unpinned.map(t => renderSingleTab(t, activeId)).join('')}
        </div>
        <div class="wb-tab-strip-end">
          <button type="button" class="wb-icon-btn" title="New Query">${ICONS.add}</button>
          <button type="button" class="wb-icon-btn" title="Editor group menu">${ICONS.more}</button>
        </div>
      </div>`;
  }

  function renderQueryBar(tab, compactGroup = false) {
    const o = state.opts;
    const isEmpty = state.scenario === 'empty';
    const isNarrow = state.scenario === 'narrow' || compactGroup;
    const isProd = !isEmpty && tab.env === 'prod';
    const connAccent = isEmpty ? '' : isProd ? 'var(--red)' : tab.env === 'staging' ? 'var(--blue)' : '';
    const connTint = !!connAccent && o.prodGuard === 'subtle';
    const running = state.executing;
    const sel = state.selectionActive;
    const planActive = state.actualPlan || state.livePlan;
    const planLabel = state.actualPlan && state.livePlan ? 'Actual + Live' : state.actualPlan ? 'Actual Plan' : state.livePlan ? 'Live Plan' : 'Plan';

    let execCluster = '';
    if (o.queryBarStyle === 'unified') {
      execCluster = `
        ${running ? `
          <button type="button" class="wb-exec-btn is-running" data-act="cancelExec">
            ${ICONS.stop}<span>Cancel</span><span class="exec-kbd">${state.execElapsed}s</span>
          </button>
        ` : `
          <button type="button" class="wb-exec-btn" data-act="runExec">
            ${ICONS.play}<span>${sel ? 'Run Selection' : 'Execute'}</span>${!isNarrow ? `<span class="exec-kbd">F5</span>` : ''}
          </button>
        `}
        ${!isNarrow ? `
          <button type="button" class="wb-exec-scope-pill ${sel ? 'is-selection' : ''}" data-act="toggleSel" title="Toggle simulated line selection">
            ${sel ? 'Lines 4–9' : 'All'}
          </button>` : ''}
        <span class="wb-qb-sep"></span>
        <div style="position:relative;">
          <button type="button" class="wb-qb-btn is-tonal ${planActive ? 'is-pressed' : ''}" data-act="togglePop" data-pop="plan">
            ${state.livePlan ? ICONS.planLive : ICONS.planActual}
            ${!compactGroup ? `<span>${planLabel}</span>` : ''}
            ${ICONS.chevDown}
          </button>
          <div class="wb-popover ${state.openPopover === 'plan' && !compactGroup ? 'is-open' : ''}" style="top:30px;left:0;">
            <div class="wb-pop-hdr">Execution Plan Options</div>
            <button type="button" class="wb-pop-item ${state.actualPlan ? 'is-selected' : ''}" data-act="toggleActual">
              ${ICONS.planActual}
              <div>Include Actual Plan<span class="pop-sub">Ctrl+M · Captures runtime stats</span></div>
              ${state.actualPlan ? '<span class="pop-check">✓</span>' : ''}
            </button>
            <button type="button" class="wb-pop-item ${state.livePlan ? 'is-selected' : ''}" data-act="toggleLive">
              ${ICONS.planLive}
              <div>Include Live Plan<span class="pop-sub">Streams operator progress live</span></div>
              ${state.livePlan ? '<span class="pop-check">✓</span>' : ''}
            </button>
            <div class="wb-pop-sep"></div>
            <button type="button" class="wb-pop-item" data-act="toast" data-msg="Estimated Execution Plan compiled (Ctrl+L)">
              ${ICONS.planEst}
              <div>Display Estimated Plan<span class="pop-sub">Ctrl+L · Compile without executing</span></div>
            </button>
          </div>
        </div>
        <button type="button" class="wb-qb-btn ${state.clientStats ? 'is-pressed' : ''}" data-act="toggleStats" title="Include Client Statistics">
          ${ICONS.stats}${!isNarrow ? '<span>Client Stats</span>' : ''}
        </button>`;
    } else if (o.queryBarStyle === 'distinct') {
      execCluster = `
        <button type="button" class="wb-exec-btn" data-act="runExec" ${running ? 'disabled' : ''}>
          ${ICONS.play}<span>Execute</span>${!isNarrow ? '<span class="exec-kbd">F5</span>' : ''}
        </button>
        ${!isNarrow ? `<button type="button" class="wb-exec-scope-pill ${sel ? 'is-selection' : ''}" data-act="toggleSel">${sel ? 'Lines 4–9' : 'Entire query'}</button>` : ''}
        <button type="button" class="wb-qb-btn ${running ? 'is-cancel-live' : ''}" ${running ? 'data-act="cancelExec"' : 'disabled'} title="Cancel Executing Query">
          ${ICONS.stop}${running ? '<span>Cancel</span>' : ''}
        </button>
        <span class="wb-qb-sep"></span>
        <button type="button" class="wb-qb-btn ${state.actualPlan ? 'is-pressed' : ''}" data-act="toggleActual" title="Include Actual Plan (distinct icon!)">${ICONS.planActual}${!isNarrow ? '<span>Actual</span>' : ''}</button>
        <button type="button" class="wb-qb-btn ${state.livePlan ? 'is-pressed' : ''}" data-act="toggleLive" title="Include Live Plan (distinct icon!)">${ICONS.planLive}${!isNarrow ? '<span>Live</span>' : ''}</button>
        <button type="button" class="wb-qb-btn" data-act="toast" data-msg="Estimated Plan (distinct icon!)" title="Estimated Execution Plan">${ICONS.planEst}${!isNarrow ? '<span>Est.</span>' : ''}</button>
        <button type="button" class="wb-qb-btn ${state.clientStats ? 'is-pressed' : ''}" data-act="toggleStats" title="Client Statistics">${ICONS.stats}${!isNarrow ? '<span>Stats</span>' : ''}</button>`;
    } else {
      // CURRENT BASELINE — shows 3 identical plan icons at narrow width!
      execCluster = `
        <button type="button" class="wb-exec-btn" data-act="runExec" ${running ? 'disabled' : ''}>
          ${ICONS.play}<span>Execute</span>${!isNarrow ? '<span class="exec-kbd">F5</span>' : ''}
        </button>
        ${!isNarrow ? `<span style="font-size:11px;color:var(--text-muted);padding:0 3px;">${sel ? 'Lines 4–9' : 'Entire query'}</span>` : ''}
        <button type="button" class="wb-qb-btn" ${running ? 'data-act="cancelExec"' : 'disabled'}>${ICONS.stop}<span>Cancel</span></button>
        <button type="button" class="wb-qb-btn ${state.actualPlan ? 'is-pressed' : ''}" data-act="toggleActual" title="Actual Plan">${ICONS.plan}${!isNarrow ? '<span>Actual Plan</span>' : ''}</button>
        <button type="button" class="wb-qb-btn ${state.livePlan ? 'is-pressed' : ''}" data-act="toggleLive" title="Live Plan">${ICONS.plan}${!isNarrow ? '<span>Live Plan</span>' : ''}</button>
        <button type="button" class="wb-qb-btn" data-act="toast" data-msg="Estimated Plan" title="Estimated Plan">${ICONS.plan}${!isNarrow ? '<span>Estimated Plan</span>' : ''}</button>
        <button type="button" class="wb-qb-btn ${state.clientStats ? 'is-pressed' : ''}" data-act="toggleStats" title="Client Statistics">${ICONS.stats}${!isNarrow ? '<span>Client Statistics</span>' : ''}</button>`;
    }

    const serverLabel = isEmpty ? 'Disconnected'
      : o.queryBarStyle === 'current'
        ? `${tab.server} (${tab.host.slice(0, 14)}…)`
        : tab.server;

    return `
      <div class="wb-querybar ${connTint ? 'has-conn-tint' : ''}" ${connAccent ? `style="--qb-accent:${connAccent};"` : ''}>
        <div class="wb-qb-actions">${execCluster}</div>
        <div class="wb-conn-pill ${connTint ? 'has-conn-tint-pill' : ''}">
          ${!isEmpty ? `<span class="wb-conn-swatch" style="background:${isProd ? 'var(--red)' : 'var(--blue)'};"></span>` : ''}
          ${!isEmpty && tab.env ? `<span class="env-pill ${tab.env}">${isProd ? 'PROD' : 'STAGING'}</span>` : ''}
          <select class="wb-conn-select" aria-label="Query server" title="${isEmpty ? 'Disconnected' : tab.server + ' (' + tab.host + ')'}">
            <option selected>${serverLabel}</option>
            ${!isEmpty ? `<option>${isProd ? 'Staging Analytics' : 'Production ERP'}</option>` : ''}
          </select>
          <span class="wb-conn-div"></span>
          <span class="oe-ic" style="width:13px;">${ICONS.db}</span>
          <select class="wb-conn-select" style="max-width:118px;" aria-label="Query database" data-act="changeDb">
            ${tab.env === 'staging' ? `
              <option selected>AnalyticsStg</option>
              <option>master</option>
            ` : `
              <option ${state.activeDb === 'AppData' ? 'selected' : ''}>AppData</option>
              <option ${state.activeDb === 'master' ? 'selected' : ''}>master</option>
              <option ${state.activeDb === 'AnalyticsWarehouse' ? 'selected' : ''}>AnalyticsWarehouse</option>
            `}
          </select>
        </div>
      </div>`;
  }

  function renderSqlEditor(tab) {
    const isEmpty = state.scenario === 'empty';
    const sel = state.selectionActive;
    const lines = isEmpty ? [
      `<span class="cmt">-- Connect this query to a server and press F5 to execute.</span>`,
      `<span class="cmt">-- A #Name comment names the result set that follows it.</span>`,
      ``,
      `<span class="cmt">/* #Name="Sample Query" */</span>`,
      `<span class="kw">SELECT</span>`,
      `    <span class="fn">@@SERVERNAME</span> <span class="kw">AS</span> server_name,`,
      `    <span class="fn">DB_NAME</span>()    <span class="kw">AS</span> database_name,`,
      `    <span class="fn">SYSDATETIME</span>() <span class="kw">AS</span> server_time;`
    ] : tab.id === 'q2' ? [
      `<span class="cmt">-- Staging reconciliation check against AnalyticsStg</span>`,
      `<span class="kw">SELECT TOP</span> (<span class="num">50</span>)`,
      `    s.BatchId, s.OrderCount, s.VarianceUsd`,
      `<span class="kw">FROM</span> staging.DailyReconciliation <span class="kw">AS</span> s`,
      `<span class="kw">WHERE</span> s.VarianceUsd <span class="op">&lt;&gt;</span> <span class="num">0</span>`,
      `<span class="kw">ORDER BY</span> s.BatchId <span class="kw">DESC</span>;`
    ] : [
      `<span class="cmt">/* #Name="Active Orders" */</span>`,
      `<span class="cmt">-- Active order telemetry &amp; backlog summary (${tab.server})</span>`,
      `<span class="kw">SELECT TOP</span> (<span class="num">100</span>)`,
      `    o.OrderId, o.CustomerName, o.OrderStatus,`,
      `    o.TotalAmount, o.CreatedAt, o.PayloadNote`,
      `<span class="kw">FROM</span> dbo.Orders <span class="kw">AS</span> o`,
      `<span class="kw">WHERE</span> o.CreatedAt <span class="op">&gt;=</span> <span class="fn">DATEADD</span>(<span class="kw">DAY</span>, <span class="op">-</span><span class="num">30</span>, <span class="fn">SYSUTCDATETIME</span>())`,
      `  <span class="kw">AND</span> o.OrderStatus <span class="kw">IN</span> (<span class="str">'Shipped'</span>, <span class="str">'Processing'</span>, <span class="str">'Flagged'</span>, <span class="str">'Refund'</span>)`,
      `<span class="kw">ORDER BY</span> o.OrderId <span class="kw">DESC</span>;`
    ];

    return `
      <div class="wb-sql-editor">
        ${lines.map((code, idx) => {
          const ln = idx + 1;
          const isSel = sel && ln >= 4 && ln <= 9;
          const isCur = !sel && ln === 9;
          return `<div class="sql-line ${isSel ? 'is-sel' : ''} ${isCur ? 'is-current' : ''}"><span class="sql-ln">${ln}</span><span class="sql-code">${code}</span></div>`;
        }).join('')}
      </div>`;
  }

  function renderActivityView() {
    return `
      <div class="wb-nonquery-view">
        <div class="nq-header">
          <div class="nq-title">
            <span>Production ERP › Activity Monitor</span>
            <span class="env-pill prod">PROD</span>
            <span class="nq-live-dot"></span>
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);">Live · every 1s</span>
          </div>
          <div style="font-size:11px;color:var(--text-accent);background:var(--accent-surface);padding:3px 9px;border-radius:99px;">
            ${state.opts.tabOrder === 'tabsAbove'
              ? 'Notice: Tab strip stayed rock-solid at Y=40px (no 36px jump!)'
              : 'Notice: Tab strip jumped UP 36px when QueryBar disappeared!'}
          </div>
        </div>
        <div class="nq-kpi-grid">
          <div class="nq-kpi"><div class="nq-kpi-lbl">% Processor Time</div><div class="nq-kpi-val">54.4%</div><div class="nq-kpi-sub">Scheduler delay 5 ms</div></div>
          <div class="nq-kpi"><div class="nq-kpi-lbl">Batch Requests/sec</div><div class="nq-kpi-val">999/s</div><div class="nq-kpi-sub">Compilations 12/s</div></div>
          <div class="nq-kpi is-alert"><div class="nq-kpi-lbl" style="color:var(--error);">Blocked Sessions</div><div class="nq-kpi-val">2</div><div class="nq-kpi-sub">Longest block 41,200 ms</div></div>
          <div class="nq-kpi"><div class="nq-kpi-lbl">Database I/O</div><div class="nq-kpi-val">4 MB/s</div><div class="nq-kpi-sub">Read latency 4 ms</div></div>
        </div>
        <div style="font-size:11.5px;color:var(--text-muted);padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--raised);">
          Click <strong>SQLQuery1.sql</strong> in the tab bar above to switch back and watch the tab strip stability live.
        </div>
      </div>`;
  }

  function renderOutputPane() {
    const o = state.opts;
    const isEmpty = state.scenario === 'empty';
    const isNarrow = state.scenario === 'narrow';
    const rs = RESULT_SETS[state.selectedResult];
    const showPivotView = rs.hasPivot && state.selectedResultView === 'pivot';
    const rows = showPivotView ? rs.pivotData : rs.data;
    const isProg = o.resultsBar1 === 'progressive';
    const isCurrBar1 = o.resultsBar1 === 'current';
    const isSmart2 = o.resultsGrid === 'smart2bar';
    const isCurrGrid = o.resultsGrid === 'current';
    const showBar3 = !isEmpty && state.outputView === 'results' && (!isSmart2 || rs.hasPivot);

    // Bar 1
    let viewsHtml = '';
    if (isEmpty) {

              <div class="prof-kv"><span>NULLs</span><strong>0</strong></div>

  function renderStatusBar() {
    const o = state.opts;
    const isEmpty = state.scenario === 'empty';
    const isCurrent = o.statusMemory === 'current';
    const curTab = TABS.find(t => t.id === state.activeTab) || TABS[0];
    const isStaging = !isEmpty && curTab.env === 'staging';
    const totalMb = 32 + state.memItems.reduce((a, m) => a + parseInt(m.stored, 10), 0);

    const barCls = state.executing ? 'is-executing' : isEmpty ? 'is-disconnected' : isStaging ? 'is-staging' : '';

    const leftHtml = isCurrent ? `
      <div class="sb-left">
        <span class="sb-item"><span class="sb-dot"></span>Ready</span>
        ${!isEmpty && curTab.env ? `<span class="env-pill ${curTab.env}">${curTab.env === 'prod' ? 'PROD' : 'STAGING'}</span>` : ''}
        <span class="sb-item">${ICONS.plug} ${isEmpty ? 'Disconnected.' : `Connected. ${curTab.server} (16.0) <span class="sb-pipe">|</span> sa (51) <span class="sb-pipe">|</span> ${state.activeDb}`}</span>
      </div>` : `
      <div class="sb-left">
        ${!isEmpty && curTab.env ? `<span class="env-pill ${curTab.env}">${curTab.env === 'prod' ? 'PROD' : 'STAGING'}</span>` : ''}
        <span class="sb-item">
          <span class="sb-dot" style="${isEmpty ? 'background:var(--text-muted);' : ''}"></span>
          ${state.executing ? `<strong>Executing query…</strong> (${state.execElapsed}s)` : isEmpty ? 'Disconnected' : `<strong>${curTab.server}</strong> <span style="opacity:.7">· ${state.activeDb} · sa (51)</span>`}
        </span>
      </div>`;

    const rightHtml = isCurrent ? `
      <div class="sb-right">
        <span class="sb-item">Ln 9 Col 28 Ch 28</span>
        <span class="sb-pipe">|</span><span>INS</span>
        <span class="sb-pipe">|</span><span>CRLF</span>
        <span class="sb-pipe">|</span><span>UTF-8</span>
        <span class="sb-pipe">|</span><span>IntelliSense off</span>
        <span class="sb-pipe">|</span><span>SQL analysis paused</span>
        <button type="button" class="sb-btn ${state.openPopover === 'memory' ? 'is-open' : ''}" data-act="togglePop" data-pop="memory">
          <span class="mem-ring" style="--ring-c:var(--chart-blue);--ring-p:12%;"></span>
          <span class="mem-ring" style="--ring-c:var(--chart-purple);--ring-p:${Math.min(95, Math.round(totalMb/2.5))}%;"></span>
          <span>Memory</span>
        </button>
      </div>` : `
      <div class="sb-right">
        <button type="button" class="sb-btn" data-act="toast" data-msg="Go to Line (Ctrl+G)">Ln 9, Col 28</button>
        <span class="sb-group-sep"></span>
        <span class="sb-item">UTF-8 · CRLF</span>
        <span class="sb-group-sep"></span>
        <button type="button" class="sb-btn" data-act="toast" data-msg="SQL IntelliSense & Analysis settings">${ICONS.sparkle} SQL: Paused</button>
        <span class="sb-group-sep"></span>
        <button type="button" class="sb-btn ${state.openPopover === 'memory' ? 'is-open' : ''}" data-act="togglePop" data-pop="memory" title="Backend memory budget (click for Nerd metrics & quick-free)">
          <span class="mem-ring" style="--ring-c:var(--chart-blue);--ring-p:14%;"></span>
          <span class="mem-ring" style="--ring-c:var(--chart-purple);--ring-p:${Math.min(95, Math.round((totalMb-32)/2.56))}%;"></span>
          <span>${isEmpty ? '32 MB' : `${totalMb} MB`}</span>
        </button>
      </div>`;

    const resMb = state.memItems.reduce((a, m) => a + parseInt(m.stored, 10), 0);
    const memPopover = `
      <div class="wb-mem-popover ${state.openPopover === 'memory' ? 'is-open' : ''}">
        <div class="mem-head">
          <h3>Memory usage</h3>
          <span style="font-size:11px;color:var(--text-muted);">SQL backend</span>
        </div>
        <div class="mem-sec">
          <div class="mem-row-hdr">
            <span class="mem-ring" style="--ring-c:var(--chart-blue);--ring-p:6%;"></span>
            <strong>Search Indexer</strong>
            <span>6% · Normal</span>
          </div>
          <div class="mem-sub"><span>32 MB / 512 MB</span><span style="color:var(--text-muted);">480 MB left</span></div>
        </div>
        <div class="mem-sec">
          <div class="mem-row-hdr">
            <span class="mem-ring" style="--ring-c:var(--chart-purple);--ring-p:${Math.round(resMb/2.56)}%;"></span>
            <strong>Results</strong>
            <span>${Math.round(resMb/2.56)}% · Normal</span>
          </div>
          <div class="mem-sub"><span>${resMb} MB / 256 MB</span><span style="color:var(--text-muted);">${256 - resMb} MB left</span></div>
          <div class="mem-packed"><span class="mem-chip-green">−108 MB packed</span> 223 MB of rows held in ${resMb} MB</div>
          <div class="mem-tiles">
            <div class="mem-tile"><small>Compressed</small><b>83%</b><small>of rows, by size</small></div>
            <div class="mem-tile"><small>Ratio</small><b>2.58×</b><small>zstd · level 2</small></div>
            <div class="mem-tile is-saved"><small>Saved</small><b>108 MB</b><small>48% of 223 MB</small></div>
          </div>
          <div class="mem-big-hdr">
            <span>Biggest Results</span>
            ${!isCurrent && state.memItems.length ? `<button type="button" style="color:var(--text-accent);font-size:10.5px;text-transform:none;letter-spacing:0;" data-act="freeAllMem">Close all</button>` : `<span>rows → stored</span>`}
          </div>
          <div class="mem-big-list ${isCurrent ? 'is-legacy-bug' : ''}">
            ${state.memItems.length ? state.memItems.map(m => `
              <div class="mem-big-row">
                <span class="mem-big-name" title="${m.tab} · ${m.res}">
                  <span class="mem-big-tab">${m.tab}</span>
                  <span style="color:var(--text-muted);">·</span>
                  <span class="mem-big-res">${m.res}</span>
                </span>
                <span style="color:var(--text-muted);font-size:11px;">${m.raw}</span>
                <strong style="font-size:11px;">${m.stored}</strong>
                <span class="mem-state-pill ${m.state}">${m.label}</span>
                <button type="button" class="mem-free-btn" data-act="freeMem" data-id="${m.id}" title="Release ${m.res}">${ICONS.close}</button>
              </div>`).join('') : `<div style="font-size:11.5px;color:var(--text-muted);padding:4px 0;">No cached result sets. <button type="button" style="color:var(--text-accent);text-decoration:underline;" data-act="restoreMem">Restore sample</button></div>`}
          </div>
        </div>
      </div>`;

    return `<footer class="wb-statusbar ${barCls}">${leftHtml}${rightHtml}${memPopover}</footer>`;
  }

  function renderWorkbench() {
    const o = state.opts;
    const wb = document.getElementById('wbWindow');
    wb.classList.toggle('is-narrow', state.scenario === 'narrow');

    const isSplit = state.scenario === 'split';
    const isEmpty = state.scenario === 'empty';
    const visibleTabs = isEmpty ? [TABS[0]] : TABS;
    const curTab = visibleTabs.find(t => t.id === state.activeTab) || visibleTabs[0];
    const isQuery = curTab.kind === 'sql';

    let editorPaneHtml = '';
    if (isSplit) {
      const leftTabs = [TABS[0], TABS[2]];
      const rightTabs = [TABS[1]];
      if (o.tabOrder === 'tabsAbove') {
        editorPaneHtml = `
          <div class="wb-groups-row">
            <div class="wb-editor-group">
              ${renderTabBar(leftTabs, 'q1')}
              ${renderQueryBar(TABS[0], true)}
              ${renderSqlEditor(TABS[0])}
            </div>
            <div class="wb-editor-group">
              ${renderTabBar(rightTabs, 'q2')}
              ${renderQueryBar(TABS[1], true)}
              ${renderSqlEditor(TABS[1])}
            </div>
          </div>`;
      } else {
        editorPaneHtml = `
          ${renderQueryBar(TABS[0], false)}
          <div class="wb-groups-row">
            <div class="wb-editor-group">
              ${renderTabBar(leftTabs, 'q1')}
              ${renderSqlEditor(TABS[0])}
            </div>
            <div class="wb-editor-group">
              ${renderTabBar(rightTabs, 'q2')}
              ${renderSqlEditor(TABS[1])}
            </div>
          </div>`;
      }
    } else {
      if (o.tabOrder === 'tabsAbove') {
        editorPaneHtml = `
          ${renderTabBar(visibleTabs, curTab.id)}
          ${isQuery ? renderQueryBar(curTab, false) : ''}
          ${isQuery ? renderSqlEditor(curTab) : renderActivityView()}`;
      } else {
        editorPaneHtml = `
          ${isQuery ? renderQueryBar(curTab, false) : ''}
          ${renderTabBar(visibleTabs, curTab.id)}
          ${isQuery ? renderSqlEditor(curTab) : renderActivityView()}`;
      }
    }

    const pinsHtml = CALLOUTS.map(c => {
      const st = Object.entries(c.pos).map(([k, v]) => `${k}:${v}`).join(';');
      return `<button type="button" class="pin-badge sev-${c.sev}" data-pin="${c.n}" style="${st}" title="${c.title}">${c.n}</button>`;
    }).join('');

    wb.innerHTML = `
      ${renderTitleBar()}
      <div class="wb-main-split">
        ${renderOE()}
        <div class="wb-splitter-v" id="oeSplitter" title="Drag to resize Object Explorer"></div>
        <div class="wb-right">
          <div class="wb-editor-pane">${editorPaneHtml}</div>
          ${isQuery ? `<div class="wb-splitter-h" title="Splitter"></div>${renderOutputPane()}` : ''}
        </div>
      </div>
      ${renderStatusBar()}
      ${pinsHtml}`;

    bindWorkbenchInteractions();
  }

  function renderConfigPanel() {
    const body = document.getElementById('configBody');
    body.innerHTML = AXES.map(ax => `
      <div class="cfg-axis">
        <div class="cfg-axis-top">
          <span class="cfg-axis-title">${ax.title}</span>
          <span class="cfg-axis-tag ${ax.tagClass}">${ax.tag}</span>
        </div>
        <div class="cfg-choices">
          ${ax.choices.map(ch => `
            <button type="button" class="cfg-choice ${state.opts[ax.id] === ch.id ? 'is-picked' : ''}" data-axis="${ax.id}" data-val="${ch.id}">
              <div class="cfg-choice-name">
                <span>${ch.label}</span>
                ${ch.rec ? `<span style="font-size:9.5px;opacity:.75;font-weight:600;">REC</span>` : ''}
              </div>
              <div class="cfg-choice-note">${ch.note}</div>
            </button>`).join('')}
        </div>
      </div>`).join('');

    body.querySelectorAll('.cfg-choice').forEach(btn => {
      btn.addEventListener('click', () => {
        state.opts[btn.dataset.axis] = btn.dataset.val;
        state.preset = detectPreset();
        syncChrome();
        renderWorkbench();
        renderConfigPanel();
      });
    });
  }

  function renderCalloutDeck() {
    const deck = document.getElementById('calloutDeck');
    deck.innerHTML = CALLOUTS.map(c => `
      <div class="callout-card" data-card="${c.n}">
        <div class="callout-top">
          <span class="callout-num sev-${c.sev}">${c.n}</span>
          <span class="callout-title">${c.title}</span>
          <span class="callout-tag">${c.tag}</span>
        </div>
        <div class="callout-desc">${c.desc}</div>
      </div>`).join('');

    deck.querySelectorAll('.callout-card').forEach(card => {
      const n = card.dataset.card;
      card.addEventListener('mouseenter', () => highlightPin(n, true));
      card.addEventListener('mouseleave', () => highlightPin(n, false));
    });
  }

  function highlightPin(n, on) {
    document.querySelectorAll(`[data-pin="${n}"], [data-card="${n}"]`).forEach(el => el.classList.toggle('is-hot', on));
  }

  function syncChrome() {
    const root = document.documentElement;
    root.dataset.theme = state.theme;
    root.dataset.density = state.density;
    root.dataset.borders = state.opts.borders;
    root.dataset.mode = state.mode;
    root.dataset.pins = state.pins ? 'on' : 'off';

    // Sync shared row-1 baseline height (--h-doc-tab) so OE Header and Document Tab Strip align 1:1 with zero stair-step
    const tabBase = state.opts.tabStyle === 'compact1' ? 34 : state.opts.tabStyle === 'current2' ? 44 : 40;
    const densityBump = state.density === 'comfortable' ? 4 : 0;
    root.style.setProperty('--h-doc-tab', `${tabBase + densityBump}px`);

    // Toggle themed scrollbars off when in full baseline
    document.body.classList.toggle('themed-scroll', state.opts.borders !== 'current' || state.opts.resultsGrid !== 'current');

    // Update topbar buttons
    document.querySelectorAll('#presetBar button').forEach(b => b.classList.toggle('is-active', b.dataset.preset === state.preset));
    document.querySelectorAll('#themeBar button').forEach(b => b.classList.toggle('is-active', b.dataset.theme === state.theme));
    document.querySelectorAll('#densityBar button').forEach(b => b.classList.toggle('is-active', b.dataset.density === state.density));
    document.querySelectorAll('#scenarioBar button').forEach(b => b.classList.toggle('is-active', b.dataset.scenario === state.scenario));

    document.getElementById('pinsBtn').classList.toggle('is-on', state.pins);
    document.getElementById('pinsBtn').textContent = state.pins ? 'Pins: On' : 'Pins: Off';
    document.getElementById('configToggleBtn').classList.toggle('is-on', state.configOpen);
    document.getElementById('configPanel').classList.toggle('is-collapsed', !state.configOpen);

    // Headline & telemetry
    const presetLabel = PRESETS[state.preset]?.name || 'Custom Mix';
    document.getElementById('stageHeadline').textContent = `Workbench Polish — ${presetLabel}`;
    const saved = computeReclaimedPx();
    document.getElementById('telemetry').innerHTML = `
      <span class="tel-badge ${saved === 0 ? 'is-neutral' : ''}">${saved > 0 ? `+${saved} px vertical workspace reclaimed` : '0 px delta (Baseline heights)'}</span>
      <span>OE: ${state.oeWidth}px</span>`;
  }

  /* ==========================================================================
     WORKBENCH EVENT BINDING
     ========================================================================== */
  function bindWorkbenchInteractions() {
    const wb = document.getElementById('wbWindow');

    wb.querySelectorAll('[data-act]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = el.dataset.act;
        if (act === 'openTab') {
          state.activeTab = el.dataset.tab;
          state.openPopover = null;
          renderWorkbench();
        } else if (act === 'togglePin') {
          const t = TABS.find(x => x.id === el.dataset.tab);
          if (t) t.pinned = !t.pinned;
          renderWorkbench();
        } else if (act === 'toggleOe') {
          const k = el.dataset.node;
          state.oeExpanded[k] = !state.oeExpanded[k];
          renderWorkbench();
        } else if (act === 'toggleSchema') {
          state.oeSchemaGroup = !state.oeSchemaGroup;
          renderWorkbench();
        } else if (act === 'togglePop') {
          const p = el.dataset.pop;
          state.openPopover = state.openPopover === p ? null : p;
          renderWorkbench();
        } else if (act === 'toggleActual') {
          state.actualPlan = !state.actualPlan;
          renderWorkbench();
        } else if (act === 'toggleLive') {
          state.livePlan = !state.livePlan;
          renderWorkbench();
        } else if (act === 'toggleStats') {
          state.clientStats = !state.clientStats;
          renderWorkbench();
        } else if (act === 'toggleSel') {
          state.selectionActive = !state.selectionActive;
          renderWorkbench();
        } else if (act === 'runExec') {
          startExecution();
        } else if (act === 'cancelExec') {
          stopExecution(true);
        } else if (act === 'setOutView') {
          state.outputView = el.dataset.view;
          renderWorkbench();
        } else if (act === 'selectResult') {
          state.selectedResult = el.dataset.res;
          state.selectedResultView = 'table';
          state.outputView = 'results';
          renderWorkbench();
        } else if (act === 'setResView') {
          state.selectedResultView = el.dataset.val;
          renderWorkbench();
        } else if (act === 'toggleDrawer') {
          const d = el.dataset.drawer;
          state.drawer = state.drawer === d ? null : d;
          renderWorkbench();
        } else if (act === 'toggleRowSize') {
          state.rowSizeOn = !state.rowSizeOn;
          renderWorkbench();
        } else if (act === 'setWs') {
          state.whitespace = el.dataset.val;
          state.openPopover = null;
          renderWorkbench();
        } else if (act === 'setSort') {
          state.sortText = el.dataset.val;
          state.openPopover = null;
          renderWorkbench();
        } else if (act === 'freeMem') {
          state.memItems = state.memItems.filter(m => m.id !== el.dataset.id);
          showToast('Released result set from backend memory');
          renderWorkbench();
        } else if (act === 'freeAllMem') {
          state.memItems = [];
          showToast('Closed all cached result sets');
          renderWorkbench();
        } else if (act === 'restoreMem') {
          state.memItems = [
            { id: 'm1', tab: 'SQLQuery1.sql', res: 'Validation Cases · Result 2', raw: '92 MB', stored: '38 MB', state: 'unpack', label: 'Unpacking 62%' },
            { id: 'm2', tab: 'SQLQuery1.sql', res: 'Summary Metrics · Result 3', raw: '92 MB', stored: '38 MB', state: 'packed', label: 'Packed' },
            { id: 'm3', tab: 'SQLQuery2.sql', res: 'Active Orders · Result 1', raw: '38 MB', stored: '38 MB', state: 'raw', label: 'Raw' }
          ];
          renderWorkbench();
        } else if (act === 'setScenario') {
          applyScenario(el.dataset.scenario);
        } else if (act === 'toast') {
          showToast(el.dataset.msg);
        }
      });
    });

    const dbSel = wb.querySelector('[data-act="changeDb"]');
    if (dbSel) {
      dbSel.addEventListener('change', () => {
        state.activeDb = dbSel.value;
        renderWorkbench();
      });
    }

    const searchInput = document.getElementById('oeSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        const pos = searchInput.selectionStart;
        state.oeFilter = searchInput.value;
        renderWorkbench();
        const next = document.getElementById('oeSearchInput');
        if (next) { next.focus(); next.setSelectionRange(pos, pos); }
      });
    }

    // Pins hover link
    wb.querySelectorAll('.pin-badge').forEach(pin => {
      const n = pin.dataset.pin;
      pin.addEventListener('mouseenter', () => highlightPin(n, true));
      pin.addEventListener('mouseleave', () => highlightPin(n, false));
      pin.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelector(`[data-card="${n}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });

    // OE Splitter Drag
    const splitter = document.getElementById('oeSplitter');
    if (splitter) {
      splitter.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = state.oeWidth;
        splitter.classList.add('is-dragging');
        const onMove = (ev) => {
          state.oeWidth = Math.max(210, Math.min(380, startW + (ev.clientX - startX)));
          const oeEl = wb.querySelector('.wb-oe');
          if (oeEl) oeEl.style.setProperty('--oe-w', `${state.oeWidth}px`);
          syncChrome();
        };
        const onUp = () => {
          splitter.classList.remove('is-dragging');
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
    }

    // Object Explorer Sticky Top/Bottom Pinned Server Bands (exact tree-model.ts pinnedServerBands math!)
    const treeEl = document.getElementById('oeTreeScroll');
    const topBand = document.getElementById('oePinTop');
    const botBand = document.getElementById('oePinBottom');
    const popTop = document.getElementById('oePinPopTop');
    const popBot = document.getElementById('oePinPopBottom');
    if (treeEl && topBand && botBand && window.__OE_SERVERS && window.__renderServerBand) {
      if (state.oeScrollTop) treeEl.scrollTop = state.oeScrollTop;
      const serverEls = [...treeEl.querySelectorAll('[data-oe-server]')];
      const headerHeight = state.opts.oeStyle === 'current' ? 30 : 44;
      const overflowH = 22;
      const topLimit = 2, bottomLimit = 2;

      const computeEdge = (items, distanceFn, limit, wholeHeaders) => {
        const viewport = treeEl.clientHeight;
        const budget = Math.max(0, Math.min(Math.floor(viewport / 3), Math.floor((viewport - headerHeight) / 2)));
        if (!limit || budget < overflowH) return { headers: [], offsets: [], overflow: [], overflowHeight: 0, height: 0 };
        const fit = (count) => {
          const slots = Math.min(limit, Math.floor(budget / headerHeight));
          const shown = Math.min(count, items.length <= slots ? slots : Math.floor((budget - overflowH) / headerHeight), limit);
          return { shown, height: shown * headerHeight + (count > shown ? overflowH : 0) };
        };
        let count = 0;
        while (count < items.length && distanceFn(items[count]) < fit(count).height) count++;
        if (!count) return { headers: [], offsets: [], overflow: [], overflowHeight: 0, height: 0 };
        const next = fit(count), prev = fit(count - 1);
        const overflow = items.slice(0, count - next.shown);
        if (!next.shown) {
          const h = Math.min(overflowH, Math.max(0, -distanceFn(items[0])));
          return { headers: [], offsets: [], overflow, overflowHeight: h, height: h };
        }
        const incoming = distanceFn(items[count - 1]), travel = prev.height - (next.height - headerHeight);
        if (!wholeHeaders && prev.shown && travel > 0 && incoming > next.height - headerHeight) {
          const moved = prev.height - incoming, start = prev.height - prev.shown * headerHeight;
          const headers = items.slice(count - 1 - prev.shown, count);
          const offsets = headers.map((_, idx) => start + idx * headerHeight - moved);
          const oh = prev.height > prev.shown * headerHeight ? overflowH : overflowH * moved / travel;
          return { headers, offsets, overflow, overflowHeight: oh, height: incoming + headerHeight };
        }
        const headers = items.slice(count - next.shown, count);
        const oh = overflow.length ? overflowH : 0;
        return { headers, offsets: headers.map((_, idx) => oh + idx * headerHeight), overflow, overflowHeight: oh, height: next.height };
      };

      const renderBand = (bandEl, popEl, edgeName, band) => {
        bandEl.style.height = band.height ? `${band.height}px` : '';
        if (!band.height) { bandEl.innerHTML = ''; popEl.classList.remove('is-open'); return; }
        const moreBtn = band.overflow.length > 0 ? `
          <div class="oe-pin-overflow" style="height:${band.overflowHeight}px;">
            <button type="button" class="oe-pin-more-btn" data-pin-more="${edgeName}">
              <span>… ${band.overflow.length} more ${edgeName === 'top' ? 'above' : 'below'}</span>
              ${edgeName === 'top' ? ICONS.chevDown : ICONS.chevRight}
            </button>
          </div>` : '';
        const cards = band.headers.map((item, i) => window.__renderServerBand(item.srv, edgeName, band.offsets[i])).join('');
        bandEl.innerHTML = (edgeName === 'top' ? moreBtn : '') + cards + (edgeName === 'bottom' ? moreBtn : '');

        bandEl.querySelectorAll('[data-jump-server]').forEach(btn => {
          btn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            const target = serverEls.find(s => s.dataset.oeServer === btn.dataset.jumpServer);
            if (target) treeEl.scrollTo({ top: Math.max(0, target.offsetTop - (edgeName === 'top' ? 0 : 44)), behavior: 'smooth' });
          });
        });
        const moreEl = bandEl.querySelector('[data-pin-more]');
        if (moreEl) {
          moreEl.addEventListener('click', (ev) => {
            ev.stopPropagation();
            const isOpen = popEl.classList.contains('is-open');
            popTop.classList.remove('is-open'); popBot.classList.remove('is-open');
            if (!isOpen) {
              popEl.innerHTML = band.overflow.map(item => window.__renderServerBand(item.srv, edgeName)).join('');
              popEl.classList.add('is-open');
              popEl.querySelectorAll('[data-jump-server]').forEach(btn => {
                btn.addEventListener('click', (e2) => {
                  e2.stopPropagation();
                  popEl.classList.remove('is-open');
                  const target = serverEls.find(s => s.dataset.oeServer === btn.dataset.jumpServer);
                  if (target) treeEl.scrollTo({ top: target.offsetTop, behavior: 'smooth' });
                });
              });
            }
          });
        }
      };

      const syncBands = () => {
        const scrollTop = treeEl.scrollTop;
        state.oeScrollTop = scrollTop;
        const viewport = treeEl.clientHeight;
        const items = serverEls.map(el => ({
          el,
          top: el.offsetTop,
          srv: window.__OE_SERVERS.find(s => s.id === el.dataset.oeServer)
        })).filter(x => x.srv);
        const top = computeEdge(items, it => it.top - scrollTop, topLimit, false);
        const lower = computeEdge([...items].reverse(), it => scrollTop + viewport - it.top - headerHeight, bottomLimit, true);
        const bottom = {
          ...lower,
          headers: [...lower.headers].reverse(),
          offsets: [...lower.offsets].reverse().map(off => lower.height - off - headerHeight),
          overflow: [...lower.overflow].reverse()
        };
        renderBand(topBand, popTop, 'top', top);
        renderBand(botBand, popBot, 'bottom', bottom);
      };

      treeEl.addEventListener('scroll', syncBands, { passive: true });
      [topBand, botBand].forEach(b => b.addEventListener('wheel', (ev) => {
        ev.preventDefault();
        treeEl.scrollTop += ev.deltaY;
      }, { passive: false }));
      syncBands();
    }
  }

  function startExecution() {
    clearInterval(execTimer);
    state.executing = true;
    state.openPopover = null;
    let ms = 0;
    state.execElapsed = '0.0';
    renderWorkbench();
    execTimer = setInterval(() => {
      ms += 100;
      state.execElapsed = (ms / 1000).toFixed(1);
      if (ms >= 1600) stopExecution(false);
      else renderWorkbench();
    }, 100);
  }

  function stopExecution(cancelled) {
    clearInterval(execTimer);
    state.executing = false;
    showToast(cancelled ? 'Query execution cancelled' : 'Query completed · 130 rows · 0.042 s');
    renderWorkbench();
  }

  function applyScenario(sc) {
    clearInterval(execTimer);
    state.scenario = sc;
    state.executing = false;
    state.openPopover = null;
    if (sc === 'nonquery') {
      state.activeTab = 'act';
    } else if (sc === 'executing') {
      state.activeTab = 'q1';
      state.selectionActive = true;
      state.executing = true;
      state.execElapsed = '1.4';
    } else if (sc === 'empty') {
      state.activeTab = 'q1';
      state.selectionActive = false;
      state.drawer = null;
    } else {
      state.activeTab = 'q1';
      state.selectionActive = false;
    }
    syncChrome();
    renderWorkbench();
  }

  function showToast(msg) {
    const t = document.getElementById('labToast');
    t.textContent = msg;
    t.classList.add('is-show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('is-show'), 2200);
  }

  function exportChoicesMarkdown() {
    const lines = [
      `## Selected Workbench v2 Choices (${PRESETS[state.preset]?.name || 'Custom'})`,
      `- **Theme / Density:** ${state.theme} / ${state.density}`,
      `- **Vertical Space Reclaimed:** +${computeReclaimedPx()} px`,
      '',
      '| Axis | Chosen Option |',
      '| --- | --- |',
      ...AXES.map(ax => {
        const ch = ax.choices.find(c => c.id === state.opts[ax.id]);
        return `| ${ax.title} | **${ch?.label}** |`;
      })
    ];
    const md = lines.join('\n');
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(md).then(() => showToast('Copied selected choices as Markdown!'), () => showToast('Ready — see console for Markdown'));
    } else {
      showToast('Exported to console');
    }
    console.log(md);
  }

  /* ==========================================================================
     GLOBAL CHROME WIRING
     ========================================================================== */
  document.querySelectorAll('#presetBar button').forEach(b => b.addEventListener('click', () => {
    state.preset = b.dataset.preset;
    state.opts = { ...PRESETS[state.preset] };
    syncChrome(); renderWorkbench(); renderConfigPanel();
  }));
  document.querySelectorAll('#modeBar button').forEach(b => b.addEventListener('click', () => {
    state.mode = b.dataset.mode; syncChrome();
  }));
  document.querySelectorAll('#themeBar button').forEach(b => b.addEventListener('click', () => {
    state.theme = b.dataset.theme; syncChrome();
  }));
  document.querySelectorAll('#densityBar button').forEach(b => b.addEventListener('click', () => {
    state.density = b.dataset.density; syncChrome();
  }));
  document.querySelectorAll('#scenarioBar button').forEach(b => b.addEventListener('click', () => {
    applyScenario(b.dataset.scenario);
  }));
  document.getElementById('pinsBtn').addEventListener('click', () => {
    state.pins = !state.pins; syncChrome();
  });
  document.getElementById('configToggleBtn').addEventListener('click', () => {
    state.configOpen = !state.configOpen; syncChrome();
  });
  document.getElementById('resetRecBtn').addEventListener('click', () => {
    state.preset = 'approachB';
    state.opts = { ...PRESETS.approachB };
    syncChrome(); renderWorkbench(); renderConfigPanel();
    showToast('Reset to Approach B (Agreed)');
  });
  document.getElementById('exportBtn').addEventListener('click', exportChoicesMarkdown);

  document.addEventListener('click', () => {
    if (state.openPopover) { state.openPopover = null; renderWorkbench(); }
  });

  // Initial URL query param support (?preset=baseline&theme=light&scenario=narrow&pop=memory&drawer=profile)
  const qp = new URLSearchParams(location.search);
  if (qp.get('preset') && PRESETS[qp.get('preset')]) { state.preset = qp.get('preset'); state.opts = { ...PRESETS[state.preset] }; }
  if (qp.get('theme') === 'light') state.theme = 'light';
  if (qp.get('density') === 'comfortable') state.density = 'comfortable';
  if (qp.get('mode')) state.mode = qp.get('mode');
  if (qp.get('pins') === 'off') state.pins = false;
  if (qp.get('config') === 'off') state.configOpen = false;
  if (qp.get('scenario')) applyScenario(qp.get('scenario'));
  if (qp.get('pop')) state.openPopover = qp.get('pop');
  if (qp.get('drawer')) state.drawer = qp.get('drawer');
  if (qp.get('oeScroll')) state.oeScrollTop = Number(qp.get('oeScroll')) || 0;

  renderCalloutDeck();
  renderConfigPanel();
  syncChrome();
  renderWorkbench();
})();
</script>
</body>
